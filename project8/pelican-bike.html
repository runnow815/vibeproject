<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html,body{margin:0;height:100%;background:#eef3f6;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;box-sizing:border-box;}
  .frame{width:min(960px,100%);border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(40,50,60,.18);background:#cfe6f2;}
  svg{display:block;width:100%;height:auto;}
  .cap{color:#5b6b76;font-size:13px;letter-spacing:2px;}

  /* 云朵：慢速横向漂移 */
  .cloud{animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(960px)}to{transform:translateX(-320px)}}
  /* 阳光射线：缓慢自转 */
  .rays{animation:turn 26s linear infinite;transform-origin:790px 84px;}
  @keyframes turn{to{transform:rotate(360deg)}}
  /* 尾羽 / 翅膀 / 围巾：轻微摆动 */
  .tail{animation:tail 1.1s ease-in-out infinite alternate;transform-origin:300px 240px;}
  @keyframes tail{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  .wing{animation:wing .55s ease-in-out infinite alternate;transform-origin:342px 238px;}
  @keyframes wing{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
  .scarf{animation:scarf .5s ease-in-out infinite alternate;transform-origin:472px 188px;}
  @keyframes scarf{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(9deg) translateY(-3px)}}
  /* 速度线 */
  .zip{animation:zip .5s linear infinite;opacity:.5;}
  @keyframes zip{from{transform:translateX(0);opacity:.65}to{transform:translateX(-140px);opacity:0}}
</style>
</head>
<body>

<div class="frame">
<svg id="scene" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f2"/><stop offset="1" stop-color="#eaf5f8"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cf9a"/><stop offset="1" stop-color="#8cbb85"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb177"/><stop offset="1" stop-color="#669a63"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3dee4"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b25c"/><stop offset="1" stop-color="#e2863a"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c777"/><stop offset="1" stop-color="#e9a24a"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="900" height="500" fill="url(#sky)"/>
  <g class="rays" opacity=".55">
    <g stroke="#ffd98a" stroke-width="6" stroke-linecap="round">
      <line x1="790" y1="30" x2="790" y2="2"/><line x1="790" y1="166" x2="790" y2="194"/>
      <line x1="726" y1="84" x2="698" y2="84"/><line x1="854" y1="84" x2="882" y2="84"/>
      <line x1="745" y1="39" x2="725" y2="19"/><line x1="835" y1="129" x2="855" y2="149"/>
      <line x1="835" y1="39" x2="855" y2="19"/><line x1="745" y1="129" x2="725" y2="149"/>
    </g>
  </g>
  <circle cx="790" cy="84" r="40" fill="#ffe08a"/>
  <circle cx="790" cy="84" r="30" fill="#fff4c9"/>

  <!-- ===== 云 ===== -->
  <g fill="#ffffff" opacity=".92">
    <g class="cloud" style="animation-duration:38s">
      <ellipse cx="0" cy="96" rx="46" ry="22"/><ellipse cx="34" cy="84" rx="34" ry="26"/><ellipse cx="-30" cy="102" rx="30" ry="16"/>
    </g>
    <g class="cloud" style="animation-duration:27s;animation-delay:-9s">
      <ellipse cx="0" cy="186" rx="34" ry="16"/><ellipse cx="26" cy="176" rx="26" ry="20"/><ellipse cx="-24" cy="190" rx="22" ry="12"/>
    </g>
    <g class="cloud" style="animation-duration:47s;animation-delay:-20s">
      <ellipse cx="0" cy="52" rx="30" ry="14"/><ellipse cx="22" cy="44" rx="22" ry="17"/>
    </g>
  </g>

  <!-- ===== 远近山峦（远层带视差） ===== -->
  <g id="hillsFar" fill="url(#hillFar)">
    <path d="M-40 372 q 120 -96 240 -30 q 90 -74 200 -18 q 110 -60 220 6 q 120 -40 240 42 L960 420 L-40 420 Z"/>
  </g>
  <g id="hillsNear" fill="url(#hillNear)">
    <path d="M-40 404 q 90 -58 200 -12 q 120 -54 230 4 q 120 -44 230 10 q 110 -20 180 26 L960 424 L-40 424 Z"/>
  </g>

  <!-- ===== 路边景物（随车速滚动） ===== -->
  <g id="bushes"></g>

  <!-- ===== 路面 ===== -->
  <rect x="0" y="424" width="900" height="76" fill="#5f6469"/>
  <rect x="0" y="424" width="900" height="6" fill="#7c8489"/>
  <g id="dashes" fill="#f4efe2"></g>
  <rect x="0" y="492" width="900" height="8" fill="#4d5256"/>

  <!-- ===== 速度线 ===== -->
  <g stroke="#8fb6c9" stroke-width="4" stroke-linecap="round">
    <line class="zip" x1="250" y1="200" x2="322" y2="200" style="animation-delay:0s"/>
    <line class="zip" x1="236" y1="268" x2="296" y2="268" style="animation-delay:.16s"/>
    <line class="zip" x1="262" y1="330" x2="330" y2="330" style="animation-delay:.32s"/>
  </g>

  <!-- ===== 车 + 鹈鹕 ===== -->
  <g id="rig">

    <!-- 车轮 -->
    <g transform="translate(300,380)"><g id="rearSpin"></g></g>
    <g transform="translate(570,380)"><g id="frontSpin"></g></g>

    <!-- 车架 -->
    <g stroke="#2f3b45" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M300 380 L415 380"/>            <!-- 后下叉 -->
      <path d="M300 380 L352 300"/>            <!-- 后上叉 -->
      <path d="M352 300 L415 380"/>            <!-- 座管 -->
      <path d="M352 300 L520 296"/>            <!-- 上管 -->
      <path d="M520 296 L415 380"/>            <!-- 下管 -->
      <path d="M520 296 L570 380"/>            <!-- 前叉 -->
      <path d="M520 296 L516 282"/>            <!-- 车把立管 -->
    </g>
    <path d="M498 288 q 18 -16 40 -6" stroke="#2f3b45" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M330 296 q 22 -12 46 -3 q -20 11 -46 3 z" fill="#33383c"/>   <!-- 车座 -->
    <circle cx="415" cy="380" r="15" fill="#c9d2d6" stroke="#2f3b45" stroke-width="4"/>  <!-- 牙盘 -->
    <circle cx="415" cy="380" r="5" fill="#2f3b45"/>

    <!-- 后腿（在身体之后，压深一档） -->
    <line id="thighB" stroke="#d98b3a" stroke-width="13" stroke-linecap="round"/>
    <line id="calfB"  stroke="#d98b3a" stroke-width="11" stroke-linecap="round"/>
    <ellipse id="footB" rx="15" ry="6" fill="#c97a2c"/>
    <line id="crankB" stroke="#8d9aa3" stroke-width="7" stroke-linecap="round"/>
    <rect id="pedalB" width="30" height="9" rx="4" fill="#3b444b"/>

    <!-- 鹈鹕身体 -->
    <g id="bird">
      <path class="tail" d="M306 236 L246 206 L262 232 L240 240 L268 254 L306 268 Z" fill="#cdd8de"/>
      <ellipse cx="360" cy="248" rx="70" ry="54" transform="rotate(-10 360 248)" fill="url(#bodyG)"/>
      <!-- 翅膀（近侧，轻扇） -->
      <path class="wing" d="M336 232 q 52 -14 78 14 q -34 28 -70 10 q -14 -12 -8 -24 z" fill="#c3d0d8" stroke="#a9b8c1" stroke-width="2"/>
      <!-- 脖子 -->
      <path d="M398 214 C 418 168, 452 144, 486 154 L 498 192 C 462 200, 428 226, 412 256 Z" fill="#f3f8fa"/>
      <!-- 头 -->
      <g id="head">
        <circle cx="492" cy="166" r="28" fill="#fbfdfe"/>
        <path d="M470 142 q 22 -16 44 -2 q -22 -10 -44 2 z" fill="#e6eff3"/>
        <circle cx="501" cy="158" r="7" fill="#fff"/><circle cx="503" cy="158" r="3.6" fill="#22303a"/>
        <!-- 上喙 -->
        <path d="M508 148 L642 166 L638 178 L508 170 Z" fill="url(#beakG)"/>
        <path d="M512 152 L636 169" stroke="#d2913f" stroke-width="2" fill="none"/>
        <!-- 喉囊 -->
        <path d="M510 166 C 540 222, 602 216, 630 180 C 600 200, 546 194, 510 166 Z" fill="url(#pouchG)"/>
        <!-- 囊里的鱼 -->
        <path d="M584 190 q 20 -12 34 -2 q -18 12 -34 2 z" fill="#7fc0d8"/>
        <path d="M584 190 l -10 -8 l 2 11 z" fill="#5aa7c4"/>
        <circle cx="606" cy="187" r="2" fill="#22303a"/>
      </g>
      <!-- 围巾 -->
      <path class="scarf" d="M474 192 q -46 12 -80 -6 q 34 26 84 10 z" fill="#c0392b"/>
      <path class="scarf" d="M466 206 q -52 22 -92 6 q 44 30 96 6 z" fill="#a5281d" style="animation-delay:-.18s"/>
    </g>

    <!-- 前腿 -->
    <line id="thighF" stroke="#f0a04a" stroke-width="14" stroke-linecap="round"/>
    <line id="calfF"  stroke="#f0a04a" stroke-width="12" stroke-linecap="round"/>
    <ellipse id="footF" rx="16" ry="6.5" fill="#e08e33"/>

    <!-- 抓车把的翅膀 -->
    <path d="M392 236 C 440 250, 486 264, 512 284" stroke="#b9c7d0" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M392 236 C 440 250, 486 264, 512 284" stroke="#d7e2e8" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- 前曲柄 + 脚踏 -->
    <line id="crankF" stroke="#b4c0c7" stroke-width="7" stroke-linecap="round"/>
    <rect id="pedalF" width="32" height="10" rx="4" fill="#4a545c"/>
  </g>
</svg>
</div>

<div class="cap">鹈鹕骑自行车 · 纯 SVG + requestAnimationFrame</div>

<script>
(function(){
  /* ---------- 几何常量 ---------- */
  var WHEEL_R = 58;
  var REAR = {x:300, y:380}, FRONT = {x:570, y:380};
  var CRANK = {x:415, y:380}, RC = 26;          // 曲柄中心 / 半径
  var HIP   = {x:368, y:272};                   // 鹈鹕髋关节
  var L1 = 70, L2 = 72;                          // 大腿 / 小腿
  var RATE = 2.2, GEAR = 2.0;                    // 踏频 rad/s，齿比
  var V = RATE * GEAR * WHEEL_R;                 // 车速 px/s

  function $(id){ return document.getElementById(id); }
  var svgNS = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs){
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ---------- 车轮（辐条程序生成） ---------- */
  function buildWheel(id){
    var g = $(id);
    g.appendChild(mk('circle', {r:WHEEL_R, fill:'none', stroke:'#33383c', 'stroke-width':8}));
    g.appendChild(mk('circle', {r:WHEEL_R-9, fill:'none', stroke:'#b9c2c7', 'stroke-width':3}));
    var spokes = mk('g', {stroke:'#d5dde1', 'stroke-width':2.4});
    for (var i = 0; i < 12; i++){
      var a = i * Math.PI / 6;
      spokes.appendChild(mk('line', {x1:0, y1:0, x2:Math.cos(a)*(WHEEL_R-11), y2:Math.sin(a)*(WHEEL_R-11)}));
    }
    g.appendChild(spokes);
    g.appendChild(mk('circle', {r:6, fill:'#4a545c'}));
  }
  buildWheel('rearSpin'); buildWheel('frontSpin');

  /* ---------- 路面虚线 ---------- */
  var dashes = $('dashes');
  for (var i = 0; i < 9; i++)
    dashes.appendChild(mk('rect', {x:i*120, y:456, width:56, height:7, rx:3.5}));

  /* ---------- 路边灌木 / 树（滚动） ---------- */
  var bushes = $('bushes');
  for (var b = 0; b < 7; b++){
    var x = b * 220 + 40;
    var g = mk('g', {});
    g.appendChild(mk('rect', {x:x-3, y:378, width:6, height:26, fill:'#6b4f34'}));
    g.appendChild(mk('circle', {cx:x, cy:370, r:20, fill:'#5f955c'}));
    g.appendChild(mk('circle', {cx:x-14, cy:376, r:14, fill:'#6ea768'}));
    g.appendChild(mk('circle', {cx:x+15, cy:375, r:15, fill:'#548a55'}));
    if (b % 2 === 0) g.appendChild(mk('circle', {cx:x+4, cy:340, r:9, fill:'#f2a4b0'}));
    bushes.appendChild(g);
  }

  /* ---------- 两段式 IK：脚必须踩在脚踏上 ---------- */
  function ik(hip, target){
    var dx = target.x - hip.x, dy = target.y - hip.y;
    var d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(L1 - L2) + 0.01, Math.min(L1 + L2 - 0.01, d));
    var ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
    var a = (L1*L1 - L2*L2 + d*d) / (2*d);
    var h = Math.sqrt(Math.max(0, L1*L1 - a*a));
    /* 膝盖朝前（+x 侧） */
    var kx = hip.x + a*ux + h*uy, ky = hip.y + a*uy - h*ux;
    return {x:kx, y:ky};
  }
  function line(el, x1, y1, x2, y2){
    el.setAttribute('x1', x1); el.setAttribute('y1', y1);
    el.setAttribute('x2', x2); el.setAttribute('y2', y2);
  }

  /* ---------- 元素引用 ---------- */
  var rear = $('rearSpin'), front = $('frontSpin'), rig = $('rig');
  var head = $('head');
  var thighB = $('thighB'), calfB = $('calfB'), footB = $('footB'), crankB = $('crankB'), pedalB = $('pedalB');
  var thighF = $('thighF'), calfF = $('calfF'), footF = $('footF'), crankF = $('crankF'), pedalF = $('pedalF');

  var theta = 0, wheelA = 0, scroll = 0, last = 0;

  function frame(t){
    if (!last) last = t;
    var dt = Math.min(0.05, (t - last) / 1000); last = t;

    theta += RATE * dt;
    wheelA += RATE * GEAR * dt * 180 / Math.PI;
    scroll += V * dt;

    /* 车轮 */
    rear.setAttribute('transform', 'rotate(' + wheelA + ')');
    front.setAttribute('transform', 'rotate(' + wheelA + ')');

    /* 路面 / 景物滚动 */
    dashes.setAttribute('transform', 'translate(' + (-(scroll % 120)) + ',0)');
    bushes.setAttribute('transform', 'translate(' + (-(scroll % 220)) + ',0)');

    /* 车身随踩踏轻微起伏 */
    var bob = Math.sin(theta * 2) * 1.8;
    rig.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');

    /* 头部随节奏轻点 */
    head.setAttribute('transform', 'rotate(' + (Math.sin(theta * 2) * 1.6).toFixed(2) + ' 405 220)');

    /* 两只脚踏（相差 180°） */
    var pb = {x: CRANK.x + Math.cos(theta) * RC,       y: CRANK.y + Math.sin(theta) * RC};
    var pf = {x: CRANK.x + Math.cos(theta + Math.PI) * RC, y: CRANK.y + Math.sin(theta + Math.PI) * RC};

    line(crankB, CRANK.x, CRANK.y, pb.x, pb.y);
    line(crankF, CRANK.x, CRANK.y, pf.x, pf.y);
    pedalB.setAttribute('x', (pb.x - 15).toFixed(1)); pedalB.setAttribute('y', (pb.y - 4).toFixed(1));
    pedalF.setAttribute('x', (pf.x - 16).toFixed(1)); pedalF.setAttribute('y', (pf.y - 5).toFixed(1));

    /* 腿：髋 → 膝（IK） → 脚踏 */
    var kb = ik(HIP, pb), kf = ik(HIP, pf);
    line(thighB, HIP.x, HIP.y, kb.x, kb.y); line(calfB, kb.x, kb.y, pb.x, pb.y);
    line(thighF, HIP.x, HIP.y, kf.x, kf.y); line(calfF, kf.x, kf.y, pf.x, pf.y);

    footB.setAttribute('cx', pb.x.toFixed(1)); footB.setAttribute('cy', (pb.y + 3).toFixed(1));
    footF.setAttribute('cx', pf.x.toFixed(1)); footF.setAttribute('cy', (pf.y + 3.5).toFixed(1));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
