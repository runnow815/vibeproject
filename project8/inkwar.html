/* ===== 音效（WebAudio 合成） ===== */
var Sound = {
  ac: null,
  ensure: function(){
    if (!this.ac){ try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone: function(freq, dur, type, vol, slideTo){
    if (!soundOn || !this.ac) return;
    var t0 = this.ac.currentTime;
    var o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  seq: function(arr, gap, dur, type, vol){
    var self = this;
    arr.forEach(function(f, i){ setTimeout(function(){ self.tone(f, dur || 0.14, type || 'triangle', vol || 0.12); }, i * (gap || 90)); });
  },
  select: function(){ this.tone(660, 0.05, 'triangle', 0.07); },
  send: function(){ this.tone(320, 0.16, 'sawtooth', 0.06, 120); },
  capture: function(){ this.seq([523, 784], 70, 0.16); },
  upgrade: function(){ this.seq([660, 990], 80, 0.16); },
  card: function(){ this.tone(880, 0.14, 'triangle', 0.12, 1320); },
  /* v1.20：敌方出牌——下行滑音，与己方出牌的上扬音明显区分，不看屏幕也能听出是谁在打牌 */
  foeCard: function(){ this.tone(620, 0.24, 'triangle', 0.10, 360); },
  err: function(){ this.tone(150, 0.12, 'square', 0.08); },
  block: function(){ this.tone(220, 0.1, 'square', 0.06, 160); },
  clash: function(){ this.tone(180, 0.09, 'sawtooth', 0.05, 90); },   // 墨色相溶：短促闷响
  tower: function(kind){                                               // 塔火：一塔一音色
    if (kind === 'cannon') this.tone(120, 0.14, 'square', 0.05, 55);
    else if (kind === 'arrow') this.tone(1500, 0.04, 'triangle', 0.035);
    else if (kind === 'mage') this.tone(520, 0.18, 'sine', 0.055, 1250);
    else this.tone(300, 0.12, 'sawtooth', 0.05, 720);                  // 爪
  },
  grab: function(){ this.tone(240, 0.16, 'sawtooth', 0.055, 480); },   // 爪子抓兵转己方
  shuffle: function(){ this.seq([520, 620, 470], 55, 0.07); },          // v1.14 洗牌：三连轻响
  win: function(){ this.seq([523, 659, 784, 1046], 110, 0.22); },
  lose: function(){ this.seq([330, 262, 196], 160, 0.3, 'triangle', 0.1); },
};

/* v1.26 心跳与延迟：DataChannel 的 onclose 在异常网络下可能长时间不触发，靠 ping/pong 主动发现断线 */
var netRtt = 0;          // 最近一次往返延迟（ms）

var netPingT = 0;        // 距上次发 ping 的秒数
var netSeq = 0;          // ping 序号
var netMiss = 0;         // 连续未收到任何下行包的秒数
var netDropT = 0;        // 断线宽限倒计时（秒；>0 表示正在等对手重连）
var netWaiting = false;  // 是否正处在「等待重连」遮罩中
var NET_MISS = 4;        // 连续 4 秒收不到任何下行包 → 判定失联
var NET_WAIT = 10;       // 失联后给对手 10 秒重连宽限，期间对局暂停（主机不能单方面推进）
/* v1.35 切后台不再被判断连：手机来电话 / 切 App / 桌面切标签页都会让 rAF 停摆，
   快照与心跳随之中断 —— 旧逻辑会在 4 秒后判失联、10 秒后**直接终止对局**。
   现在双方用 away 包互报「我离开页面了」，离开期间冻结失联判定并各自暂停（谁也别单方面推进）。 */
var netSelfAway = false; // 我自己切到后台
var netFoeAway = false;  // 对手切到后台
var netAwayPaused = false; // 当前这次暂停是「离开页面」造成的（回来要自动恢复）

/* v1.26 心跳节拍：每秒 ping 一次、累计失联时长、驱动重连宽限倒计时 */
function netTick(dt){
  if (netRole === 'none') return;
  netPingT += dt;
  if (netPingT >= 1){
    netPingT = 0; netSeq++;
    Net.pingSent[netSeq] = Date.now();
    Net.send({ t: 'pg', s: netSeq });
  }
  /* v1.35：我自己在后台时不再累计失联（我的 rAF 可能只被节流到 1fps，计时本身不可信）；
     对手在后台时同样不判失联 —— 他只是离开了页面，不是掉线。 */
  if (!netSelfAway) netMiss += dt;
  if (netMiss > NET_MISS && netAlive && !netFoeAway){ netAlive = false; netDrop(); }
  if (netWaiting){
    netDropT -= dt;
    var el = document.getElementById('netWaitMsg');
    if (el) el.textContent = '等待对手重连 … ' + Math.max(0, Math.ceil(netDropT)) + ' 秒';
    if (netDropT <= 0) netGiveUp();
  }
  /* v1.26 请求类超时提示：再战请求没人响应 / 暂停请求没人理，都要给个说法 */
  if (netAgain.me && !netAgain.foe && mode === 'over'){
    var was = netAgain.t;
    netAgain.t += dt;
    if (was < NET_ACK && netAgain.t >= NET_ACK)
      setHint('对手未在 ' + NET_ACK + ' 秒内响应再战 · 可先返回菜单');
  }
  if (netPauseT > 0){
    netPauseT -= dt;
    if (netPauseT <= 0 && netRole === 'guest' && mode === 'playing') setHint('房主未响应暂停请求 · 暂停权在房主');
  }
}
/* v1.26 客机本地预测：下令后立刻在本地画一支半透明「影子部队」，把「一个 RTT + 100ms 才看到反应」的空档填掉。
   影子不进任何判定（框选 / 命中 / 选中一律跳过），真身随下一份快照到达即被重建覆盖。 */
var ghostSeq = 0;
function netGhostFrom(cmd){
  if (netRole !== 'guest' || !sim || !cmd || !cmd.from) return;
  var ratio = cmd.ratio == null ? 1 : cmd.ratio;
  var to = cmd.to || {};
  var tc = to.k === 'c' ? sim.castles[to.id] : null;
  if (to.k === 'c' && !tc) return;
  var tx = tc ? tc.x : to.x, ty = tc ? tc.y : to.y, tKind = tc ? 'c' : 'pt', tid = tc ? tc.id : -1;
  for (var i = 0; i < cmd.from.length; i++){
    var f = cmd.from[i], sx = 0, sy = 0, n = 0, srcId = -1;
    if (f.k === 'c'){
      var c = sim.castles[f.id];
      if (!c || c.owner !== mySide) continue;
      sx = c.x; sy = c.y; n = Math.floor(c.garrison * ratio); srcId = c.id;
    } else if (f.k === 'p'){
      var p = campById(f.id);
      if (!p || p.owner !== mySide) continue;
      sx = p.x; sy = p.y; n = Math.floor(p.count * ratio); srcId = p.id;
    } else continue;
    if (n < 1) continue;
    sim.armies.push({ id: 950000 + (++ghostSeq), owner: mySide, count: n, x: sx, y: sy, tx: tx, ty: ty,
                      tKind: tKind, tid: tid, srcId: srcId, hx: sx, hy: sy, atkT: 0, ghost: 1, gt: 0 });
  }
}

/* 失联：暂停对局 + 10 秒宽限（主机不能趁对手掉线单方面推进）
   v1.37：补「重新连接」—— 旧版只有「放弃等待」一条路，手机切 Wi-Fi/4G、锁屏再回来必废局。
   续连复用建连流程（重新交换一次码），成功后**不重开局**：主机补推快照、客机要一份 resnap 接着打。 */
function netDrop(){
  if (netRole === 'none' || netWaiting) return;
  netWaiting = true; netDropT = NET_WAIT;
  if (mode === 'playing') mode = 'paused';

/* v1.25：结算拆成「记分」与「渲染」两步 —— 战报看完要能原样回到结算，不能重复记一次分 */
var lastResult = null;
function showResult(){
  var win = sim.over === mySide;
  var isTut = !!sim.opts.tutorial;                 // v1.25：教学局不污染战绩 / 闯关进度 / 最快纪录
  /* v1.26 口径统一：单机 → record；联机 → netRec。好友对战不该污染单机连胜，反之亦然。 */
  var isPvp = sim.opts.mode === 'pvp';
  if (win){
    if (!isTut && !isPvp){ record.w++; record.streak = Math.max(1, record.streak + 1); save('ink.stats', record); }
    else if (!isTut && isPvp){ netRec.w++; save('ink.netrec', JSON.stringify(netRec)); }
    Sound.win();
    if (sim.opts.mode === 'campaign'){
      var lv = sim.opts.level;
      /* v1.24：上限改由关卡表驱动（10 → 15），破完最后一关停在「已通关」而不是溢出 */
      if (!isTut && lv >= progress){ progress = Math.min(Sim.CAMPAIGN.length, lv + 1); save('ink.progress', progress); }
    } else if (!isTut && netRole === 'none' && (!best || sim.t < best)){ best = Math.floor(sim.t); save('ink.best', best); }
  } else {
    if (!isTut && !isPvp){ record.l++; record.streak = 0; save('ink.stats', record); }
    else if (!isTut && isPvp){ netRec.l++; save('ink.netrec', JSON.stringify(netRec)); }
    Sound.lose();
  }
  lifeUpdate(win);                                 // v1.25 生涯统计（成就的数据源）

  var campMsg = '';
  if (sim.opts.mode === 'campaign'){
    var LVN2 = Sim.CAMPAIGN.length;
    campMsg = win ? (sim.opts.level >= LVN2 ? '<br><span style="color:var(--cinnabar)">十五关俱破 · 问鼎天下！</span>'
                   : '<br><span style="color:var(--cinnabar)">第 ' + (sim.opts.level + 1) + ' 关已解锁</span>')
                  : '<br><span>第 ' + sim.opts.level + ' 关可再战</span>';
    /* v1.24：失败时把「差在哪」讲清楚——限时超时 / 守城没撑满 / 占领数不够 */
    if (!win && sim.opts.goal) campMsg += '<br><span style="opacity:.75">本关目标：' + goalDesc(sim.opts.goal) + '</span>';
  } else if (sim.opts.mode === 'pvp'){
    campMsg = '<br><span>好' + (win ? '友对战 · 技高一筹' : '友对战 · 胜败乃兵家常事') + '</span>';
  }
  repFinish(win);                                  // v1.25：战报封板（只内存）
  if (sim.opts.tutorial) tutEnd();                 // v1.25：教学局打完即引导收尾
  var newAch = achCheck();                         // v1.25：结算后统一结算成就
  lastResult = { win: win, campMsg: campMsg, loot: rollLoot(win), newAch: newAch };
  renderResult();
}
function renderResult(){
  var R = lastResult; if (!R){ showMenu(); return; }
  var loot = R.loot, win = R.win;
  panel = 'result';
  showOverlay(
    '<div class="stamp ' + (win ? 'win">胜<small>JIANGSHAN</small>' : 'lose">败<small>ZHENGUO</small>') + '</div>' +
    '<h1 style="font-size:24px;letter-spacing:8px;text-indent:8px">' + (win ? '江山尽入吾墨' : '卷土重来未可知') + '</h1>' +
    '<div class="rstat">用时 <b>' + fmt(sim.t) + '</b> · 占领 <b>' + (sim.stats.capturedBy[mySide] || 0) + '</b> 城 · 用卡 <b>' + sim.stats.cardsUsed + '</b> 张<br>' +
      /* v1.26：联机局展示联机战绩（生涯统计本就不计联机，口径一致） */
      (sim.opts.mode === 'pvp' ? '联机战绩 ' + netRec.w + '胜' + netRec.l + '负'
                               : '生涯战绩 ' + record.w + '胜' + record.l + '负') + R.campMsg +

/* ===== v1.25 生涯统计：成就的唯一数据源（块2 自算，不动块1） =====
   联机与教学局不计入生涯，避免刷成就。 */
var life = loadJSON('ink.life', { games: 0, win: 0, lose: 0, loss: 0, kill: 0, cards: 0, captured: 0,
                                  fast: 0, campMax: 0, streakMax: 0, master: 0, tut: 0 });
function lifeUpdate(win){
  if (!sim || netRole !== 'none' || sim.opts.tutorial) return;
  life.games++;
  if (win) life.win++; else life.lose++;
  life.loss     += Math.round(sim.stats.loss[mySide] || 0);
  life.kill     += Math.round(sim.stats.loss[mySide === 1 ? 2 : 1] || 0);
  life.cards    += sim.stats.cardsUsed || 0;
  life.captured += sim.stats.capturedBy[mySide] || 0;
  if (win && (!life.fast || sim.t < life.fast)) life.fast = Math.floor(sim.t);
  if (record.streak > (life.streakMax || 0)) life.streakMax = record.streak;
  if (sim.opts.mode === 'campaign' && win) life.campMax = Math.max(life.campMax || 0, sim.opts.level || 0);
  if (sim.opts.diff === 'master' && win) life.master = (life.master || 0) + 1;
  save('ink.life', JSON.stringify(life));
}

/* ===== v1.25 成就：规则表 + 进度展示 ===== */
var ACHS = [
  { id: 'first_win', name: '初出茅庐', desc: '赢下第一局',     chk: function(L){ return L.win >= 1; } },
  { id: 'games30',   name: '身经百战', desc: '累计对局 30 场', chk: function(L){ return L.games >= 30; }, prog: function(L){ return [Math.min(L.games, 30), 30]; } },
  { id: 'win10',     name: '十战之将', desc: '累计取胜 10 局', chk: function(L){ return L.win >= 10; },   prog: function(L){ return [Math.min(L.win, 10), 10]; } },
  { id: 'fast90',    name: '疾风扫叶', desc: '90 秒内取胜',    chk: function(L){ return L.fast > 0 && L.fast <= 90; },
    prog: function(L){ return [L.fast ? Math.max(0, 91 - L.fast) : 0, 91]; } },
  { id: 'streak3',   name: '三连捷',   desc: '取得 3 连胜',    chk: function(L){ return (L.streakMax || 0) >= 3; }, prog: function(L){ return [Math.min(L.streakMax || 0, 3), 3]; } },
  { id: 'camp5',     name: '过关斩将', desc: '闯过第 5 关',    chk: function(L){ return (L.campMax || 0) >= 5; },   prog: function(L){ return [Math.min(L.campMax || 0, 5), 5]; } },
  { id: 'camp15',    name: '问鼎天下', desc: '通关全部 ' + Sim.CAMPAIGN.length + ' 关',
    chk: function(L){ return (L.campMax || 0) >= Sim.CAMPAIGN.length; },
    prog: function(L){ return [Math.min(L.campMax || 0, Sim.CAMPAIGN.length), Sim.CAMPAIGN.length]; } },
  { id: 'master1',   name: '宗师手下', desc: '在宗师难度取胜', chk: function(L){ return (L.master || 0) >= 1; } },
  { id: 'card50',    name: '运筹帷幄', desc: '累计打出 50 张卡', chk: function(L){ return L.cards >= 50; },   prog: function(L){ return [Math.min(L.cards, 50), 50]; } },
  { id: 'cap30',     name: '开疆拓土', desc: '累计占领 30 座城', chk: function(L){ return L.captured >= 30; }, prog: function(L){ return [Math.min(L.captured, 30), 30]; } },
  { id: 'kill500',   name: '血流漂杵', desc: '累计歼敌 500 兵',  chk: function(L){ return L.kill >= 500; },    prog: function(L){ return [Math.min(L.kill, 500), 500]; } },
  { id: 'tut_done',  name: '出师',     desc: '完成新手引导',    chk: function(L){ return (L.tut || 0) >= 1; } }
];
var ach = loadJSON('ink.ach', {});
function achCount(){ var n = 0; for (var i = 0; i < ACHS.length; i++) if (ach[ACHS[i].id]) n++; return n; }
function achCheck(){
  var out = [];
  for (var i = 0; i < ACHS.length; i++){
    var a = ACHS[i];
    if (ach[a.id]) continue;
    if (a.chk(life)){ ach[a.id] = 1; out.push(a); }
  }
  if (out.length) save('ink.ach', JSON.stringify(ach));
  return out;
}
function showAch(){
  panel = 'ach';
  var got = achCount();
  showOverlay(
    '<h1>🏅 成<span>·</span>就</h1>' +
    '<div class="motto">已达成 ' + got + ' / ' + ACHS.length + ' · 未解锁的显示进度</div>' +
    '<div class="achlist">' + ACHS.map(function(a){
      var on = !!ach[a.id], pr = (!on && a.prog) ? a.prog(life) : null;
      return '<div class="achrow' + (on ? ' on' : '') + '">' +
        '<b class="achname">' + (on ? a.name : '？？？') + '</b>' +
        '<span class="achdesc">' + a.desc + '</span>' +
        (on ? '<i class="achok">已达成</i>'
            : (pr ? '<i class="achprog">' + pr[0] + ' / ' + pr[1] + '</i>' : '<i class="achprog">未解锁</i>')) +
      '</div>';
    }).join('') + '</div>' +
    '<div class="btnrow"><button class="bb pri" id="btnAchBack">返回菜单</button></div>'
  );
  document.getElementById('btnAchBack').onclick = function(){ Sound.select(); showMenu(); };
}

/* ===== v1.25 存档：三槽位，只存元进度 + 最近一局的种子（可一键复现） =====
   不存棋盘中局 —— sim 里带三路随机源函数与互相引用，JSON 化既不可靠也不可复现；
   「种子 + 配置」才是可复现的最小充分条件。 */
var slots = loadJSON('ink.slots', [null, null, null]);
function slotSnapshot(name){
  return { v: 1, ts: Date.now(), name: name || '墨战档案',
    progress: progress, best: best, record: { w: record.w, l: record.l, streak: record.streak },
    deck: deck.list.slice(), collected: { daily: collected.daily, sub: collected.sub },
    life: life, ach: ach, cfg: cfg, cfg2: cfg2, sound: soundOn ? 1 : 0,
    last: lastRep ? { seed: lastRep.meta.seed, mode: lastRep.meta.mode, level: lastRep.meta.level,
                      diff: lastRep.meta.diff, custom: lastRep.meta.custom } : null };
}
function slotSave(i){
  slots[i] = slotSnapshot('档案 ' + (i + 1));
  save('ink.slots', JSON.stringify(slots));
}
function slotApply(s){
  progress = s.progress || 1; best = s.best || 0;
  record = { w: (s.record || {}).w || 0, l: (s.record || {}).l || 0, streak: (s.record || {}).streak || 0 };
  deck.list = (s.deck || []).slice();
  collected = { daily: (s.collected || {}).daily || {}, sub: (s.collected || {}).sub || {} };
  life = s.life || life; ach = s.ach || {};
  cfg = s.cfg || cfg; cfg2 = s.cfg2 || cfg2;
  soundOn = s.sound !== 0;
  save('ink.progress', progress); save('ink.best', best); save('ink.stats', JSON.stringify(record));
  save('ink.deck', JSON.stringify(deck)); save('ink.collected', JSON.stringify(collected));
  save('ink.life', JSON.stringify(life)); save('ink.ach', JSON.stringify(ach));
  save('ink.cfg', JSON.stringify(cfg)); save('ink.cfg2', JSON.stringify(cfg2));
  save('ink.sound', soundOn ? 1 : 0);
}
function slotReplay(s){
  if (!s || !s.last) return;
  var o = { mode: s.last.mode || 'quick', seed: s.last.seed, opponents: cfg.opponents, castles: cfg.size,
            diff: s.last.diff || cfg.diff, custom: s.last.custom || null };
  if (s.last.mode === 'campaign' && s.last.level) o = { mode: 'campaign', level: s.last.level, seed: s.last.seed,
    castles: Sim.CAMPAIGN[s.last.level - 1].castles, opponents: Sim.CAMPAIGN[s.last.level - 1].opponents,
    diff: Sim.CAMPAIGN[s.last.level - 1].diff, bonus: Sim.CAMPAIGN[s.last.level - 1].bonus, goal: Sim.CAMPAIGN[s.last.level - 1].goal };
  startGame(o);
}
function showSlots(){
  panel = 'slots';
  function row(i){
    var s = slots[i];
    return '<div class="slotbox">' +
      '<div class="slotname">' + (s ? s.name : '空档位 ' + (i + 1)) + '</div>' +
      '<div class="slotinfo">' + (s
        ? ('闯关 ' + Math.min(s.progress, Sim.CAMPAIGN.length) + ' / ' + Sim.CAMPAIGN.length +
           ' · ' + (s.record.w || 0) + '胜' + (s.record.l || 0) + '负 · 卡组 ' + (s.deck || []).length + ' 张 · 成就 ' +
           Object.keys(s.ach || {}).length + '<br>' + new Date(s.ts).toLocaleString())
        : '尚未存档') + '</div>' +
      '<div class="slotbtns">' +
        '<button class="tbtn" id="btnSSave' + i + '">存入</button>' +
        '<button class="tbtn" id="btnSLoad' + i + '"' + (s ? '' : ' disabled') + '>读取</button>' +
        '<button class="tbtn" id="btnSRep' + i + '"' + (s && s.last ? '' : ' disabled') + '>复现此局</button>' +
        '<button class="tbtn" id="btnSDel' + i + '"' + (s ? '' : ' disabled') + '>删除</button>' +
      '</div></div>';
  }
  showOverlay(
    '<h1>卷<span>·</span>档</h1>' +
    '<div class="motto">三个档位 · 存的是进度、卡组、收集与成就</div>' +
    row(0) + row(1) + row(2) +
    '<div class="slotnote">「复现此局」用同一随机种子与配置重开那一局 —— 同种子 = 同地图同开局。战报只留内存，不入档。</div>' +
    '<div class="btnrow"><button class="bb pri" id="btnSlotBack">返回菜单</button></div>'
  );
  for (var i = 0; i < 3; i++) (function(i){
    var bs = document.getElementById('btnSSave' + i), bl = document.getElementById('btnSLoad' + i),
        br = document.getElementById('btnSRep' + i), bd = document.getElementById('btnSDel' + i);
    if (bs) bs.onclick = function(){ slotSave(i); Sound.select(); showSlots(); };
    if (bl) bl.onclick = function(){ slotApply(slots[i]); Sound.select(); showMenu(); };
    if (br) br.onclick = function(){ Sound.ensure(); slotReplay(slots[i]); };
    if (bd) bd.onclick = function(){ slots[i] = null; save('ink.slots', JSON.stringify(slots)); Sound.select(); showSlots(); };
  })(i);
  document.getElementById('btnSlotBack').onclick = function(){ Sound.select(); showMenu(); };
}

var tut = { on: false, i: 0, wait: null, waitFrom: 0, els: [] };
var tutState = loadJSON('ink.tut', { v: 1, i: 0, done: false });
function tutSave(){ save('ink.tut', JSON.stringify(tutState)); }
function tutClear(){
  for (var i = 0; i < tut.els.length; i++){ var e = tut.els[i]; if (e && e.parentNode) e.parentNode.removeChild(e); }
  tut.els = [];
}
function tutHole(){
  var s = TUT[tut.i], el = null, r = null;
  try { el = s && s.anchor ? document.querySelector(s.anchor) : null; } catch (e){ el = null; }
  if (el && el.getBoundingClientRect){ try { r = el.getBoundingClientRect(); } catch (e){ r = null; } }
  if (!r || !r.width || !r.height) r = null;
  return r ? { x: Math.max(0, r.left - 6), y: Math.max(0, r.top - 6),
               w: r.width + 12, h: r.height + 12 } : null;

function tutShow(){
  tutClear();

  var hole = tutHole(), host = document.body || document.documentElement;

      wallR = mk('tutwall tw-r'), holeEl = mk('tuthole'), card = mk('tutcard');
  /* 说明卡内容仍走 innerHTML 字符串（打桩下 querySelectorAll 恒为 []，按钮绑定走 getElementById 兜底） */
  card.innerHTML =
    '<div class="tutstep">' + (tut.i + 1) + ' / ' + TUT.length + '</div>' +
    '<div class="tuttitle">' + s.title + '</div>' +
    '<div class="tutbody">' + s.body + '</div>' +
    '<div class="tutbtns">' +
      (s.act ? '<button class="bb pri" id="' + s.act.id + '">' + s.act.label + '</button>' : '') +
      (s.wait ? '<span class="tutwait">完成后自动继续</span>' : '<button class="bb" id="tutNext">下一步</button>') +
      '<button class="tbtn" id="tutSkip">跳过引导</button>' +
    '</div>';
  var els = [wallT, wallB, wallL, wallR, holeEl, card];
  for (var i = 0; i < els.length; i++){ if (host && host.appendChild) host.appendChild(els[i]); tut.els.push(els[i]); }
  var d = document.documentElement;
  var vw = (d && d.clientWidth) || (window.innerWidth || 960);
  var vh = (d && d.clientHeight) || (window.innerHeight || 640);
  if (hole){

    wallL.style.cssText = 'left:0;top:' + hole.y + 'px;width:' + hole.x + 'px;height:' + hole.h + 'px';
    wallR.style.cssText = 'left:' + (hole.x + hole.w) + 'px;top:' + hole.y + 'px;width:' + Math.max(0, vw - hole.x - hole.w) + 'px;height:' + hole.h + 'px';
    holeEl.style.cssText = 'left:' + hole.x + 'px;top:' + hole.y + 'px;width:' + hole.w + 'px;height:' + hole.h + 'px';
  } else {

    wallB.style.display = 'none'; wallL.style.display = 'none'; wallR.style.display = 'none'; holeEl.style.display = 'none';

/* 结算掉落（v1.14）：三选一 = 从次卡池按稀有度权重抽 3 张不重复候选，胜利时有概率给出「+」升级版 */
function rollLoot(won){
  var pool = Sim.CARDS.filter(function(c){ return !c.up; });     // 候选只从基础卡出，升级与否再掷点
  var W = Sim.CFG.RARITY_W;
  function weighted(){
    var total = 0, i;
    for (i = 0; i < pool.length; i++) total += W[pool[i].rar] || 0;
    var r = Math.random() * total;
    for (i = 0; i < pool.length; i++){ r -= (W[pool[i].rar] || 0); if (r <= 0) return pool[i]; }
    return pool[pool.length - 1];
  }
  var upP = won ? Sim.CFG.UP_CHANCE.win : Sim.CFG.UP_CHANCE.lose;
  var out = [], used = {}, guard = 0;
  while (out.length < 3 && guard++ < 300){
    var c = weighted();
    if (used[c.key]) continue;                                   // 三张互不重复（按基础卡去重）
    used[c.key] = 1;
    var key = (Math.random() < upP && CARD_BY_KEY[c.key + '+']) ? c.key + '+' : c.key;
    var card = CARD_BY_KEY[key];
    /* v1.19：cd / base 供选牌卡面显示（只增不删，kind/name/desc/cost/rar/ex/up 含义不变） */
    out.push({ kind: 'deck', key: key, name: card.name, desc: card.desc, cost: card.cost,
               cd: card.cd, base: c.key, rar: c.rar, ex: !!card.ex, up: key !== c.key });
  }
  return out;
}

/* ===== v1.25 战报：只留内存，不落盘（本地配额留给存档与成就） =====
   采样挂 drainEvents()（每帧一次，loop 与测试钩子共用同一入口），事件直接复用已消费的那份 list，
   因此不需要给块1 加任何钩子；曲线按 sim.t 每 0.5s 一点，上限 600 点（≈5 分钟）。 */
var rep = null, lastRep = null;
var REP_MAX = 600, REP_MARK_MAX = 40, REP_SHOW = 12;
function totalTroops(s, o){
  var n = 0, i;
  for (i = 0; i < s.castles.length; i++) if (s.castles[i].owner === o) n += s.castles[i].garrison;
  for (i = 0; i < s.armies.length; i++) if (s.armies[i].owner === o) n += s.armies[i].count;
  for (i = 0; i < s.camps.length; i++) if (s.camps[i].owner === o) n += s.camps[i].count;
  return Math.round(n);
}
function repBegin(){
  var o = (sim && sim.opts) || {};
  rep = { meta: { seed: sim ? sim.rngSeed : 0, mode: o.mode || 'quick', level: o.level || 0, diff: o.diff || 'normal',
                  tutorial: !!o.tutorial, goal: o.goal || null, custom: o.custom || null, win: false, t: 0 },
          curve: [], marks: [], lastT: -1 };
}
function repSample(){
  if (!rep || !sim) return;
  if (sim.t - rep.lastT < 0.5) return;
  rep.lastT = sim.t;
  if (rep.curve.length >= REP_MAX) return;
  rep.curve.push({ t: Math.round(sim.t * 10) / 10,
                   n: [0, totalTroops(sim, 1), totalTroops(sim, 2), totalTroops(sim, 3), totalTroops(sim, 4)] });
}
/* 关键事件：只挑「能讲清这局发生了什么」的几类；同类 3 秒内只留一条（否则 clash 会刷满） */
var REP_MARK = {
  capture:  { rank: 6, txt: function(e){ return '占领一座城池'; } },
  breach:   { rank: 5, txt: function(e){ return '攻破了敌人的塔'; } },
  card:     { rank: 4, txt: function(e){ return '打出「' + e.name + '」'; } },
  tower:    { rank: 3, txt: function(e){ return '城中建起了塔'; } },
  ambushHit:{ rank: 3, txt: function(e){ return '伏兵吃掉 ' + e.n + ' 兵'; } },
  defect:   { rank: 3, txt: function(e){ return '策反 ' + e.n + ' 兵'; } },
  upgrade:  { rank: 2, txt: function(e){ return '城池升到 ' + e.level + ' 级'; } },
  block:    { rank: 2, txt: function(e){ return '护盾挡下来犯'; } },
  supply:   { rank: 1, txt: function(e){ return '粮道补给 +' + e.n + ' 兵'; } },
  clash:    { rank: 0, txt: function(e){ return '两军在野外遭遇'; } }
};
function repEvents(list){
  if (!rep || !sim) return;
  for (var i = 0; i < list.length; i++){
    if (rep.marks.length >= REP_MARK_MAX) return;
    var e = list[i], f = REP_MARK[e.type];
    if (!f) continue;
    var t = Math.round(sim.t * 10) / 10, last = null;
    for (var j = rep.marks.length - 1; j >= 0; j--){ if (rep.marks[j].kind === e.type){ last = rep.marks[j]; break; } }
    if (last && t - last.t < 3) continue;                 // 同类节流
    rep.marks.push({ t: t, kind: e.type, txt: f.txt(e), by: e.owner != null ? e.owner : (e.by || 0), rank: f.rank });
  }
}
function repFinish(win){
  if (!rep || !sim) return null;
  rep.meta.win = !!win; rep.meta.t = Math.round(sim.t * 10) / 10;
  var L = [0, 0, 0, 0, 0], C = [0, 0, 0, 0, 0], o;
  for (o = 1; o <= 4; o++){ L[o] = Math.round(sim.stats.loss[o] || 0); C[o] = sim.stats.capturedBy[o] || 0; }
  rep.total = { loss: L, captured: C, cards: sim.stats.cardsUsed || 0 };
  lastRep = rep; rep = null;

}
/* 曲线：两条折线（朱=我方 青=敌方），纯 polyline，不用 defs / 渐变 / id（图鉴走 data-URI 取不到宿主引用） */
function repCurveSvg(r){
  var W = 300, H = 92, pad = 7;

  if (!pts || pts.length < 2) return '<div class="repnone">本局太短，还没攒够采样点</div>';
  var maxT = Math.max(1, pts[pts.length - 1].t), maxN = 1, i;
  for (i = 0; i < pts.length; i++){ if (pts[i].n[1] > maxN) maxN = pts[i].n[1]; if (pts[i].n[2] > maxN) maxN = pts[i].n[2]; }
  function path(o){

      var y = H - pad - (pts[k].n[o] / maxN) * (H - pad * 2);
      s += (k ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
    }
    return s;
  }
  return '<svg class="repchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' +
         '<title>双方兵力曲线</title>' +
         '<polyline points="' + path(1) + '" fill="none" stroke="#b33327" stroke-width="1.6" stroke-linejoin="round"/>' +
         '<polyline points="' + path(2) + '" fill="none" stroke="#2c5f6e" stroke-width="1.6" stroke-linejoin="round"/>' +
         '</svg>';
}
function repMarksHtml(r){

                          .slice(0, REP_SHOW).sort(function(a, b){ return a.t - b.t; });

    dispatch([s], { k: 'pt', x: to.x, y: to.y }, true);   // 走 v1.11 的单兵出队链路（沿用相位 = 同一个兵）
    ctrl.pending = true;                                  // 下一步后认领新建的那支部队
    selection = selection.filter(function(x){ return x !== s; });
    setHint('WASD 移动 · 松开就地驻扎<br>鼠标点击目标 = 攻击 / 前往');
    return true;
  }
  /* v1.29：选中己方城池 / 阵列时按方向键 = 直接派兵朝该方向并接管。
     此前只认「点中的兵」，而电脑上一个环兵只有约 7 CSS px —— 用户点城池后按 WASD 只听到一声错误音，
     「操控部队移动」等于不可用。城池/阵列是最好点的目标，让 WASD 从这里就能起步。 */
  var from = [];
  for (var k2 = 0; k2 < selection.length; k2++){
    var it = selection[k2];
    if (it.k === 'c'){ if (sim.castles[it.id] && sim.castles[it.id].owner === mySide) from.push(it); }
    else if (it.k === 'p'){ var pp = campById(it.id); if (pp && pp.owner === mySide) from.push(it); }
  }
  if (from.length){
    var src = from[0], org = src.k === 'c' ? sim.castles[src.id] : campById(src.id);
    if (org){
      var to2 = clampMap(org.x + dir.x * MANUAL_AHEAD, org.y + dir.y * MANUAL_AHEAD);
      ctrl.pendKnown = snapshotArmyIds();
      dispatch(from, { k: 'pt', x: to2.x, y: to2.y }, true);     // v1.31：同上，保留选中以接续下一次指令
      ctrl.pending = true;                                // 下一步认领新部队 → 之后 WASD 持续改向
      setHint('已派出部队 · <b>WASD / 方向键</b> 持续行军 · 松开就地驻扎');
      Sound.send();
      return true;
    }
  }
  /* v1.29：什么都没选中时，接管最近的一支己方在途部队（此前只会响一声错误音） */
  var near = nearestOwnArmy();
  if (near){ selection = [{ k: 'a', id: near.id }]; return takeoverArmy(near.id); }
  setHint('先<b>选中己方城池</b>或<b>点中一个兵</b><br>再按 <b>W A S D</b> / <b>↑ ↓ ← →</b> 操控它行军');
  Sound.err();
  return false;
}
/* v1.29：离「屏幕中心 / 最近战斗」最近的一支己方在途部队（供无选中时接管） */
function nearestOwnArmy(){
  var best = null, bd = Infinity;
  for (var i = 0; i < sim.armies.length; i++){
    var a = sim.armies[i];
    if (a.owner !== mySide || a.ghost) continue;
    var d = (a.x - CFG.MAP_W / 2) * (a.x - CFG.MAP_W / 2) + (a.y - CFG.MAP_H / 2) * (a.y - CFG.MAP_H / 2);
    if (d < bd){ bd = d; best = a; }
  }
  return best;
}
/* 持续行走：每 MANUAL_TICK 秒把目标点推到前方 */
function manualTick(dt){
  if (mode !== 'playing' || !sim) return;
  if (ctrl.pending){                                    // 认领刚出队的那支 1 兵部队（id 最大）
    var best = null;
    for (var i = 0; i < sim.armies.length; i++){
      var a = sim.armies[i];
      if (a.owner !== mySide) continue;
      if (ctrl.pendKnown && ctrl.pendKnown[a.id]) continue;      // v1.20：排除按下前就存在的旧部队
      if (!best || a.id > best.id) best = a;
    }
    /* v1.31 连续指令：认领即选中这支部队 —— 之后「松手驻扎 → 再按方向键」不必重新点选 */
    if (best){ ctrl.id = best.id; ctrl.pending = false; ctrl.wait = 0; ctrl.pendKnown = null;
               ctrl.lx = best.x; ctrl.ly = best.y; selection = [{ k: 'a', id: best.id }]; }
    else {                                              // 部队可能已阵亡/驻扎：0.5 秒后放弃认领，防卡死
      ctrl.wait = (ctrl.wait || 0) + dt;
      if (ctrl.wait > 0.5){ ctrl.pending = false; ctrl.wait = 0; ctrl.pendKnown = null; }
      return;
    }
  }
  var dir = manualDir();
  ctrl.acc += dt;
  if (ctrl.acc < MANUAL_TICK) return;
  ctrl.acc = 0;
  var ca = ctrlArmy();
  /* v1.31：部队消失时先把「它扎下的阵列」接成新的选中，再摘掉指向这支部队的失效选择 */
  if (!ca){ manualSettle(); dropSelArmy(ctrl.id); ctrlReset(); return; }
  ctrl.lx = ca.x; ctrl.ly = ca.y;                        // v1.31：记录最后位置，驻扎后据此认阵列
  if (!dir){                                            // 松开：目标设在自身位置 → 立即抵达并驻扎
    if (ca.tKind === 'pt'){
      ctrl.settle = true;                               // v1.31：标记「主动驻扎」，抵达后自动选中
      if (Math.abs(ca.x - ca.tx) > 1 || Math.abs(ca.y - ca.ty) > 1){
        manualRetarget(ca.x, ca.y, [ca.id]);
      }
    }
    return;
  }
  var to = clampMap(ca.x + dir.x * MANUAL_AHEAD, ca.y + dir.y * MANUAL_AHEAD);
  manualRetarget(to.x, to.y, [ca.id]);
}
/* v1.31 连续指令：被操控的部队消失后，若它是「玩家松手就地驻扎」而消失的，
   就把新扎下的阵列设为当前选中 —— 玩家不必再点一次即可直接下一条移动指令。
   部队若是被打光/并入城池（settle = false），一律不接管，保持原语义。 */
function campNear(x, y, maxD){
  var best = null, bd = maxD * maxD;
  for (var i = 0; i < sim.camps.length; i++){
    var p = sim.camps[i];
    if (p.owner !== mySide) continue;
    var dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
    if (d < bd){ bd = d; best = p; }
  }
  return best;
}
/* v1.31：摘掉指向某支部队的失效选择（部队驻扎/被歼灭后不该继续显示在选中里） */
function dropSelArmy(id){
  selection = selection.filter(function(s){ return !(s.id === id && (s.k === 'a' || s.k === 's')); });
}
function manualSettle(){
  if (!ctrl.settle || !sim) return false;
  ctrl.settle = false;
  var p = campNear(ctrl.lx, ctrl.ly, 90);
  if (!p) return false;
  selection = [{ k: 'p', id: p.id }];
  setHint('已就地驻扎 · <b>直接按 WASD / ↑↓←→</b> 继续行军（无需重新点选）<br>点目标 = 派遣 · 点空地 = 列阵');
  return true;
}
/* 鼠标攻击：选中兵时，点谁打谁（敌城 → 冲锋；敌军 → 冲向它互溶） */
function hitEnemyAim(v){
  if (!sim) return null;
  var c = hitCastle(v), i, a;
  if (c && c.owner !== mySide) return { k: 'c', id: c.id, x: c.x, y: c.y };
  /* 敌军部队：先试兵级命中（≤10px），再试碰撞体积 */
  var sol = hitSoldier(v, null);
  if (sol && sol.src === 'a'){
    for (i = 0; i < sim.armies.length; i++){
      if (sim.armies[i].id === sol.id && sim.armies[i].owner !== mySide)
        return { k: 'pt', x: sim.armies[i].x, y: sim.armies[i].y };
    }
  }
  var ha = hitArmy(v, null);
  if (ha && ha.a.owner !== mySide) return { k: 'pt', x: ha.a.x, y: ha.a.y };
  return null;
}

/* ==================================================================================
 * v1.34 出兵比例条：滑块 0~100% 连续调节 + 25/50/75/100 快捷档位 + 实时「百分比 — 实际兵力」
 *
 * 可用兵力 = 当前**选中**的己方城池驻军 + 阵列兵力（在途部队与单兵不计），口径与块1 doSend 完全一致：
 *   城池 Math.floor(garrison × ratio)、阵列 Math.floor(count × ratio) —— 逐来源 floor 再累加，
 *   所以「读数」就是这一次真的会派出去的兵数，不是估算。
 * 可用兵力为 0（没选中 / 选中来源已空）或比例越界 → .off 置灰 + disabled 禁用交互。
 * 拖动时 input 事件逐帧写 value 与读数文本（只有两个写点，不做节流）。
 * ================================================================================== */
var elRange = document.getElementById('ratioRange'), elRatioVal = document.getElementById('ratioVal');
var lastRatioSig = '';
function numFmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
/* 选中来源的可派兵力合计（100% 时的兵数） */
function selAvailTroops(){
  if (!sim) return 0;
  var n = 0, i, s, c, p;
  for (i = 0; i < selection.length; i++){
    s = selection[i];
    if (s.k === 'c'){ c = sim.castles[s.id]; if (c && c.owner === mySide) n += Math.floor(c.garrison); }
    else if (s.k === 'p'){ p = campById(s.id); if (p && p.owner === mySide) n += Math.floor(p.count); }
  }
  return n;
}
/* 该比例下真正会派出的兵数（逐来源 floor 累加，与块1 同源同口径） */
function ratioSendCount(r){
  if (!sim) return 0;
  r = (r == null ? ratio : r);
  var n = 0, i, s, c, p;
  for (i = 0; i < selection.length; i++){
    s = selection[i];
    if (s.k === 'c'){ c = sim.castles[s.id]; if (c && c.owner === mySide) n += Math.floor(c.garrison * r); }
    else if (s.k === 'p'){ p = campById(s.id); if (p && p.owner === mySide) n += Math.floor(p.count * r); }
  }
  return n;
}
function ratioBarState(){
  var avail = selAvailTroops();
  var ok = avail > 0 && ratio >= 0 && ratio <= 1;      // 可用兵力为 0 或比例越界 → 禁用
  return { ratio: ratio, pct: Math.round(ratio * 100), avail: avail, send: ratioSendCount(), off: !ok };
}
function renderRatioBar(force){
  if (!elRatio) return null;
  var st = ratioBarState();
  var sig = st.pct + '|' + st.avail + '|' + (st.off ? 1 : 0);
  if (!force && sig === lastRatioSig) return st;       // 每帧调用：只在三者变化时写 DOM
  lastRatioSig = sig;
  elRatio.className = 'ratio' + (st.off ? ' off' : '');
  if (elRange){ elRange.value = String(st.pct); elRange.disabled = !!st.off; }
  if (elRatioVal) elRatioVal.textContent = st.off ? '— 无可用兵力'
                                                  : (st.pct + '% — ' + numFmt(st.send) + ' 兵');
  if (elRatio.querySelectorAll) elRatio.querySelectorAll('.rquick b').forEach(function(b){
    b.classList.toggle('on', Math.abs((+b.dataset.r || 0) - ratio) < 0.005);
  });
  return st;
}
/* 唯一入口：钳进 [0,1] 再刷新；silent 用于拖动（不每帧出声） */
function setRatio(v, silent){
  v = +v;
  if (!(v >= 0)) v = 0;
  if (v > 1) v = 1;
  ratio = v;
  renderRatioBar(true);
  if (!silent && typeof Sound !== 'undefined') Sound.select();
  return ratio;
}
if (elRatio && elRatio.querySelectorAll) elRatio.querySelectorAll('.rquick b').forEach(function(b){
  b.onclick = function(){ setRatio(+b.dataset.r); };
});
if (elRange){
  /* input（拖动 / 方向键）与 change（松手）都接：各浏览器 range 事件时机不一致 */
  elRange.addEventListener('input', function(){ setRatio((+elRange.value || 0) / 100, true); });
  elRange.addEventListener('change', function(){ setRatio((+elRange.value || 0) / 100); });
}
elPause.onclick = function(){ if (mode === 'playing' || mode === 'paused') togglePause(); };
document.getElementById('btnAllout').onclick = function(){
  if (mode !== 'playing' || !sim) return;
  var foe = sim.castles.filter(function(c){ return c.owner !== mySide && c.owner !== 0; });
  var neutralLeft = sim.castles.filter(function(c){ return c.owner === 0; }).length;
  if (foe.length !== 1 || neutralLeft > 0){ setHint('残局（中立清空且敌仅一城）方可全军出击'); return; }
  var targetId = foe[0].id;
  if (netRole === 'guest') Net.send({ t: 'cmd', kind: 'allout', targetId: targetId });
  else Sim.command(sim, { type: 'allout', owner: mySide, targetId: targetId });
  Sound.win();
};

/* ===== 输入（统一 Pointer，rect 缩放换算） ===== */
/* ===== v1.27 视野变换：双指缩放 + 拖动平移 + 一键复位 =====
 * 基准 fit 用 cover（铺满画布）：手机竖屏把画布比例放宽后，contain 会在上下留死白、
 * cover 则让地图真正变大（两侧各裁一点），裁掉的部分由左下角缩略图补全图感知。
 * 桌面 / 横屏画布恒为 16:9，cover 与 contain 完全相等 → 既有渲染断言逐像素不变。
 * 平移量 px/py 是「视野中心相对地图中心」的地图坐标偏移，缩放围绕视野中心进行。 */
var view = { z: 1, px: 0, py: 0 };
var VIEW_Z_MIN = 1, VIEW_Z_MAX = 3.2;      // VIEW_Z_MIN 现在是「不裁时」的下限，实际下限见 viewZoomMin()
function viewBase(){
  var w = canvas.width || CFG.MAP_W, h = canvas.height || CFG.MAP_H;
  var s = Math.max(w / CFG.MAP_W, h / CFG.MAP_H);        // cover
  return s;
}
/* v1.37：手机竖屏画布变瘦长后 cover 会裁掉约一半地图，而旧实现把缩放下限钉死在 z=1 ——
   意味着「复位」回到的是裁切视角，玩家**永远看不到全图**。补三个概念：
     viewContain = 整图可见所需的缩放；viewCropped = 当前基准是否已裁切；
     viewZoomMin = 允许的最小 z（裁切时可缩到整图可见，未裁时就是 1）。
   桌面 / 横屏画布恒 16:9 → cover == contain → 三个值全部退化成旧行为（z 下限 1、不裁、不画缩略图）。 */
function viewContain(){
  var w = canvas.width || CFG.MAP_W, h = canvas.height || CFG.MAP_H;
  return Math.min(w / CFG.MAP_W, h / CFG.MAP_H);
}
function viewCropped(){ var c = viewContain(); return c > 0 && viewBase() > c * 1.02; }
function viewZoomMin(){ return viewCropped() ? Math.max(0.2, viewContain() / viewBase()) : VIEW_Z_MIN; }
function viewK(){ return viewBase() * view.z; }
function viewClamp(){                                     // 不让视野飘出地图（未裁满时偏移恒为 0）
  var k = viewK();
  var mx = Math.max(0, CFG.MAP_W / 2 - (canvas.width / 2) / k);
  var my = Math.max(0, CFG.MAP_H / 2 - (canvas.height / 2) / k);
  view.px = Math.max(-mx, Math.min(mx, view.px));
  view.py = Math.max(-my, Math.min(my, view.py));
}
function viewApply(){
  var k = viewK(), cx = CFG.MAP_W / 2 + view.px, cy = CFG.MAP_H / 2 + view.py;
  ctx.setTransform(k, 0, 0, k, canvas.width / 2 - cx * k, canvas.height / 2 - cy * k);
}
function viewZoomAt(z, devX, devY, anchorX, anchorY){     // 以 (devX,devY) 为锚点缩放到 z
  view.z = Math.max(viewZoomMin(), Math.min(VIEW_Z_MAX, z));
  var k = viewK();
  view.px = anchorX - CFG.MAP_W / 2 - (devX - canvas.width / 2) / k;
  view.py = anchorY - CFG.MAP_H / 2 - (devY - canvas.height / 2) / k;
  viewClamp();
}
function viewDev(e){                                      // 事件 → 画布设备像素
  var rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / (rect.width || 1) * (canvas.width || CFG.MAP_W),
           y: (e.clientY - rect.top) / (rect.height || 1) * (canvas.height || CFG.MAP_H) };
}
/* v1.38 单指平移：手机竖屏画布瘦长，cover 会把近一半地图裁到屏外，而旧实现「只有双指才能平移」——
   玩家用一根手指怎么拖都拖不动（单指拖空白被框选占用、拖单位是派遣），这就是「手机上不能拖动」的根因。
   现在：**触屏单指拖空白 = 平移地图**；框选退到「长按 300ms 后拖」（与卡牌长按看详情同一套交互语言）。
   桌面鼠标拖空白仍是框选（`ptr.pan` 只有触屏为真），既有断言零回归。 */
function viewPanBy(dDevX, dDevY){
  var k = viewK();
  if (!k) return;
  view.px -= dDevX / k;
  view.py -= dDevY / k;
  viewClamp();
  viewChip();
}
function viewToMap(dx, dy){                               // 设备像素 → 地图坐标（viewApply 的逆）
  var k = viewK();
  return { x: (dx - canvas.width / 2) / k + CFG.MAP_W / 2 + view.px,
           y: (dy - canvas.height / 2) / k + CFG.MAP_H / 2 + view.py };
}
/* v1.38：竖屏画布瘦长后 cover 裁得更狠（可见宽度只剩 ~46%），开局/复位回到「地图几何中心」时
   玩家连自己的主城都在屏外 —— 实测屏内一座己方城都搜不到。现在改为**居中己方主城**：
   未裁切时 viewClamp 会把偏移钳回 0，桌面 / 横屏（16:9）与旧版逐像素一致。 */
function homeCastle(){
  if (!sim || !sim.castles) return null;
  var best = null;
  for (var i = 0; i < sim.castles.length; i++){
    var c = sim.castles[i];
    if (c.owner !== mySide) continue;
    if (!best || c.level > best.level || (c.level === best.level && c.garrison > best.garrison)) best = c;
  }
  return best;
}
function viewReset(){
  view.z = 1; view.px = 0; view.py = 0;
  var c = homeCastle();
  if (c){ view.px = c.x - CFG.MAP_W / 2; view.py = c.y - CFG.MAP_H / 2; }
  viewClamp();
  viewChip();
}
/* v1.37：一键「整图可见」—— z 缩到 contain，未裁时等价于 viewReset（桌面 16:9 完全一致） */
function viewFit(){ view.z = viewZoomMin(); view.px = 0; view.py = 0; viewChip(); }
function viewMoved(){ return view.z > 1.01 || Math.abs(view.px) > 1 || Math.abs(view.py) > 1 || view.z < viewZoomMin() * 0.99; }
/* v1.37 屏内缩放按钮：以画布中心为锚点步进（触屏专用，桌面滚轮语义不变） */
function viewZoomStep(mul){
  viewZoomAt(view.z * mul, (canvas.width || CFG.MAP_W) / 2, (canvas.height || CFG.MAP_H) / 2,
             CFG.MAP_W / 2 + view.px, CFG.MAP_H / 2 + view.py);
  viewChip();
}
function viewChip(){
  var el = document.getElementById('zoomchip');
  if (el && el.classList){
    var on = viewMoved();
    if (on) el.classList.add('on'); else el.classList.remove('on');
  }
  if (el && el.textContent != null) el.textContent = view.z > 1.01 ? ('⤢ ' + view.z.toFixed(1) + '×') : '⤢';
  /* v1.37 屏内缩放条：只在触屏 / 窄屏显示（桌面有滚轮，不占地方）；⛶ 在全览态高亮 */
  var zb = document.getElementById('zbar');
  if (zb && zb.classList && zb.classList.contains('on')){
    var f = document.getElementById('zFit');
    if (f && f.classList){
      var fitted = view.z <= viewZoomMin() * 1.02;
      if (fitted) f.classList.add('fitdone'); else f.classList.remove('fitdone');
    }
  }
}
/* v1.37 屏内缩放条显隐：触屏（coarse）或窄屏才挂出来，桌面端彻底不出现 */
var COARSE_MQ = (typeof window.matchMedia === 'function') ? window.matchMedia('(pointer:coarse)') : null;
function isCoarse(){
  if (coarseForce != null) return !!coarseForce;                     // 测试钩子优先
  if (COARSE_MQ && typeof COARSE_MQ.matches === 'boolean') return COARSE_MQ.matches;
  return false;
}
var zbarOn = null;                                        // 缓存，避免每帧重复写 class
function bindZoomBar(){
  var zb = document.getElementById('zbar');
  if (!zb) return;
  var on = isCoarse();
  if (on !== zbarOn){
    zbarOn = on;
    if (zb.classList){ if (on) zb.classList.add('on'); else zb.classList.remove('on'); }
  }
  var zi = document.getElementById('zIn'), zo = document.getElementById('zOut'), zf = document.getElementById('zFit');
  if (zi && !zi.__bound){ zi.__bound = 1; zi.addEventListener('click', function(e){ e.preventDefault(); viewZoomStep(1.35); }); }
  if (zo && !zo.__bound){ zo.__bound = 1; zo.addEventListener('click', function(e){ e.preventDefault(); viewZoomStep(1 / 1.35); }); }
  if (zf && !zf.__bound){ zf.__bound = 1; zf.addEventListener('click', function(e){ e.preventDefault(); viewFit(); }); }
}
function toVirtual(e){
  var d = viewDev(e);
  return viewToMap(d.x, d.y);
}
/* ===== v1.28 触屏命中与手势阈值 =====
   硬伤：点按/拖动阈值（14）、兵级命中半径（10）全是地图虚拟像素写死。
   手机竖屏 cover 下 1 CSS px ≈ 2 个虚拟像素 —— 阈值实际只有 7 CSS px，手指轻抖就被判成
   拖拽（点兵变出兵）；命中半径只有 5 CSS px，想点中一个兵需要 5px 的指头精度，基本点不中。
   mapPerCss = 1 个 CSS 像素折合多少地图虚拟像素（随缩放变化）；粗指针（手指）再放大容差。 */
function mapPerCss(){
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !canvas.width) return 1;
  return (canvas.width / rect.width) / viewK() || 1;
}
var coarseForce = null;                                   // 测试钩子：null = 跟随系统
function isCoarse(){
  if (coarseForce != null) return coarseForce;
  try { return matchMedia('(pointer:coarse)').matches; } catch (e){ return false; }
}
/* 命中容差：桌面保持原有虚拟像素常量（stub 下 mapPerCss=1，逐项断言不受影响）；
   触屏放大到 cssPx 个 CSS 像素（真机约等于 base×2） */
function hitSlack(base, cssPx){
  return isCoarse() ? Math.max(base, cssPx * mapPerCss()) : base;
}
/* 点按 vs 拖动 的判定位移（地图虚拟像素）：桌面 14（与既有语义一致）；触屏 22 CSS px */
function tapSlop(type){
  return (type === 'touch' || isCoarse()) ? 22 * mapPerCss() : 14 * mapPerCss();
}
/* v1.32「士兵进城升级」：城池外侧的「↑」徽章 = 可点入口（点它或按 E = 让城里的兵进城升级）。
   徽章放在驻军最外环之外；临近地图右边界时自动翻到左侧，渲染与命中共用同一个函数。 */
var UP_CHIP_R = 17;
/* 入口必须落在驻军最外环之外：Lv2 满仓时士兵最远约为 castleR+39；
   旧版 castleR+22 与驻军环只差 9px，会被 hitSoldier 吞掉，表现为徽章偶尔点不中。 */
function upChipOf(c){
  var off = castleR(c) + 64;
  var side = c.x + off + UP_CHIP_R > CFG.MAP_W ? -1 : 1;
  return { x: c.x + side * off, y: c.y, r: UP_CHIP_R };
}
function upChipCastles(){
  if (!sim) return [];
  return sim.castles.filter(function(c){ return c.owner === mySide && Sim.upgradeNeed(c) > 0; });
}
function hitUpChip(v){
  var list = upChipCastles(), i, ch;
  for (i = 0; i < list.length; i++){
    ch = upChipOf(list[i]);
    if (dist(v.x, v.y, ch.x, ch.y) <= (UP_CHIP_R + hitSlack(10, 8))) return list[i];
  }
  return null;
}
function hitCastle(v, ownerFilter){
  for (var i = 0; i < sim.castles.length; i++){
    var c = sim.castles[i];
    if (ownerFilter != null && c.owner !== ownerFilter) continue;
    if (dist(v.x, v.y, c.x, c.y) <= castleR(c) + hitSlack(12, 8)) return c;
  }
  return null;
}
function hitCamp(v, ownerFilter){
  for (var i = sim.camps.length - 1; i >= 0; i--){
    var p = sim.camps[i];
    if (ownerFilter != null && p.owner !== ownerFilter) continue;
    if (dist(v.x, v.y, p.x, p.y) <= campR(p) + hitSlack(8, 9)) return p;
  }
  return null;
}
/* 全场景兵级命中：在途/驻城/扎营的任意一个兵（取最近，触屏时按 CSS 像素放宽） */
function hitSoldier(v, ownerFilter){
  var best = null, bd = hitSlack(10, 11);
  function consider(src, id, idx, x, y){
    var dd = dist(v.x, v.y, x, y);
    if (dd < bd){ bd = dd; best = { src: src, id: id, idx: idx }; }
  }
  for (var i = 0; i < sim.armies.length; i++){
    var a = sim.armies[i];
    if (a.ghost) continue;                                   // v1.26 影子部队不可点
    if (ownerFilter != null && a.owner !== ownerFilter) continue;
    var units = armyFormations(a, tNow, starMulOf(sim, a));
    for (var j = 0; j < units.length; j++) consider('a', a.id, j, units[j].x, units[j].y);
  }
  for (i = 0; i < sim.camps.length; i++){
    var p = sim.camps[i];
    if (ownerFilter != null && p.owner !== ownerFilter) continue;
    var pf = campFormations(p, tNow);                 // 与渲染同源的方阵坐标
    for (var q = 0; q < pf.length; q++) consider('p', p.id, q, pf[q].x, pf[q].y);
  }
  for (i = 0; i < sim.castles.length; i++){
    var c = sim.castles[i];
    if (ownerFilter != null && c.owner !== ownerFilter) continue;
    var ring = castleRingUnits(c, tNow);
    for (var g = 0; g < ring.length; g++) consider('c', c.id, g, ring[g].x, ring[g].y);
  }
  return best;
}
function hitArmy(v, ownerFilter){
  for (var i = sim.armies.length - 1; i >= 0; i--){
    var a = sim.armies[i];
    if (a.ghost) continue;                                   // v1.26 影子部队不可点
    if (ownerFilter != null && a.owner !== ownerFilter) continue;
    if (dist(v.x, v.y, a.x, a.y) <= Sim.armyR(a) + hitSlack(7, 9)){
      var units = armyFormations(a, tNow, starMulOf(sim, a));  // 找最近个体（兵级选中）
      var best = 0, bd = Infinity;
      for (var j = 0; j < units.length; j++){
        var dd = dist(v.x, v.y, units[j].x, units[j].y);

}
function selHas(k, id){ return selection.some(function(s){ return s.k === k && s.id === id; }); }
/* v1.18：选中项里的在途部队（回防 / WASD 接管用） */
function selArmies(){

/* 塔：kind ↔ 快照索引（0 = 无塔，1..4 对应 TOWERS 顺序） */
function towerIdx(kind){
  if (!kind) return 0;

function towerKind(idx){

}
/* 神速星级倍数：按阵营归属取值（v1.10），渲染与命中测试共用同一公式 */
function starMulOf(s, a){

/* 阵列按稳定 id 取（v1.10：阵列数组会清场重排，下标不可靠） */
function campById(id){ for (var i = 0; i < sim.camps.length; i++) if (sim.camps[i].id === id) return sim.camps[i]; return null; }
function selToggle(k, id, idx){
  var i = selection.findIndex(function(s){ return s.k === k && s.id === id && (k !== 's' || s.idx === idx); });
  if (i >= 0) selection.splice(i, 1);
  else {
    if (k === 's') selection = selection.filter(function(x){ return x.k !== 's'; });  // 旗手唯一
    selection.push({ k: k, id: id, idx: idx });

function pruneSelection(){
  selection = selection.filter(function(s){
    var i, o;
    if (s.k === 'c'){ var c = sim.castles[s.id]; return c && c.owner === mySide; }
    if (s.k === 'a' || s.k === 's'){
      for (i = 0; i < sim.armies.length; i++){ o = sim.armies[i]; if (o.id === s.id) return o.owner === mySide; }
      return false;
    }
    if (s.k === 'gs'){ var gc = sim.castles[s.id]; return gc && gc.owner === mySide && s.idx < Math.floor(gc.garrison); }
    if (s.k === 'ps'){ var gp = campById(s.id); if (gp) return gp.owner === mySide && s.idx < Math.floor(gp.count); return false; }
    return !!campById(s.id) && campById(s.id).owner === mySide;
  });

/* 下达军令：选中城池/阵列 → 派遣出兵；选中在途部队 → 改向
   v1.31：`keep = true` 时**不清空选择**（供单兵/部队操控链路使用，见 manualLaunch / manualTick），
   这样「移动 → 驻扎 → 再移动」不必重新点选；普通派遣（点目标 / 回防 / 列阵）仍一律清空，语义不变 */
function dispatch(sources, target, keep){
  pruneSelection();
  var to = target.k === 'c' ? { k: 'c', id: target.id } : { k: 'pt', x: target.x, y: target.y };
  var ids = [], from = [], soldiers = [], i, s;
  for (i = 0; i < sources.length; i++){
    s = sources[i];
    if (s.k === 'a'){
      var f = null;
      for (var j = 0; j < sim.armies.length; j++){ if (sim.armies[j].id === s.id){ f = sim.armies[j]; break; } }
      if (f && f.owner === mySide && ids.indexOf(s.id) < 0) ids.push(s.id);
    } else if (s.k === 's'){
      var fa = null;
      for (var j2 = 0; j2 < sim.armies.length; j2++){ if (sim.armies[j2].id === s.id){ fa = sim.armies[j2]; break; } }
      /* 在途兵：带上被点中那个兵的当前坐标与相位，从他所在位置离队 */
      if (fa && fa.owner === mySide){
        var fu = armyFormations(fa, tNow, starMulOf(sim, fa))[s.idx];
        soldiers.push({ type: 'split', armyId: s.id, n: 1,
                        pt: fu ? { x: fu.x, y: fu.y } : null, ph: fu ? fu.ph : null });
      }
    } else if (s.k === 'gs'){
      var gc = sim.castles[s.id];
      if (gc && gc.owner === mySide && s.idx < Math.floor(gc.garrison)){
        var ru = castleRingUnits(gc, tNow)[s.idx];     // 驻城环上被点中的那个兵
        soldiers.push({ type: 'send', from: { k: 'c', id: s.id, pt: ru ? { x: ru.x, y: ru.y } : null }, n: 1 });
      }
    } else if (s.k === 'ps'){
      var gp = campById(s.id);
      if (gp && gp.owner === mySide && s.idx < Math.floor(gp.count)){
        var pu = campFormations(gp, tNow)[s.idx];      // 方阵中被点中的那个兵
        soldiers.push({ type: 'send', from: { k: 'p', id: s.id, pt: pu ? { x: pu.x, y: pu.y } : null,
                                              ph: campPh(gp, s.idx) }, n: 1 });
      }
    } else if (s.k === 'c'){
      if (sim.castles[s.id] && sim.castles[s.id].owner === mySide) from.push(s);
    } else if (s.k === 'p'){
      var p2 = campById(s.id);
      if (p2 && p2.owner === mySide) from.push(s);
    }
  }
  var did = false;
  /* 兵级单兵指挥：选中的那一个兵单独出队执行任务 */
  for (i = 0; i < soldiers.length; i++){
    var sc = soldiers[i];
    /* v1.36：城里的兵点他自己所在的那座城 = 出城又进城（净值为 0，观感是「兵闪一下」），直接忽略 */
    if (sc.type === 'send' && sc.from.k === 'c' && to.k === 'c' && sc.from.id === to.id) continue;
    if (sc.type === 'split'){
      var spl = { type: 'split', owner: mySide, armyId: sc.armyId, to: to, n: sc.n,
                  pt: sc.pt || null, ph: sc.ph != null ? sc.ph : null };
      if (netRole === 'guest') Net.send({ t: 'cmd', kind: 'split', cmd: spl });
      else Sim.command(sim, spl);
    } else {
      var snd = { owner: mySide, from: [sc.from], to: to, n: sc.n };
      if (netRole === 'guest') Net.send({ t: 'cmd', kind: 'send', cmd: snd });
      else Sim.command(sim, snd);
    }
    did = true;
  }
  if (ids.length){
    var rt = { type: 'retarget', owner: mySide, ids: ids, to: to };
    if (netRole === 'guest') Net.send({ t: 'cmd', kind: 'retarget', cmd: rt });
    else Sim.command(sim, rt);
    did = true;
  }
  if (from.length){
    /* v1.36：**派不出兵就不要假装下了令**。旧实现只要构造出命令就把选择清空，
       于是「出兵比例 0%」「选中空城 / 空阵列」时点了回城，选择没了、兵没动、也没有任何提示
       ——玩家看到的就是「点击回城无响应」。这里先按块1 的同一口径算一遍实派兵数再决定。 */
    if (selAvailTroops() < 1){
      setHint('无可用兵力 · 先选一座<b>有兵</b>的己方城池或阵列'); Sound.err(); return false;
    }
    if (ratioSendCount(ratio) < 1){
      setHint('出兵比例 <b>' + Math.round(ratio * 100) + '%</b> 派不出兵<br>拖滑块或点 25 / 50 / 75 / 100 档位');
      Sound.err(); return false;
    }
    var cmd = { owner: mySide, from: from, to: to, ratio: Math.max(0, Math.min(1, ratio)) };  // v1.34：钳进 [0,1]
    if (netRole === 'guest'){ Net.send({ t: 'cmd', kind: 'send', cmd: cmd }); netGhostFrom(cmd); }   // v1.26 本地预测
    else Sim.command(sim, cmd);
    did = true;
  }
  if (!did) return false;                            // v1.36：返回「是否真的下了军令」，供回城入口判定
  if (!keep) selection = [];                             // 军令下达后清空选择（v1.31：keep 时保留）
  setHint(soldiers.length ? '单兵已出队执行任务<br>可继续点选其他兵分别指挥'
           : ids.length && !from.length ? '军令已改 · 部队转向新目标<br>点空地 = 改道列阵'
           : '已派遣 · 重新框选可再派<br>点空地 = 列阵屯兵');
  Sound.send();
  return true;
}
/* v1.32 士兵进城升级：选中项 → 目标城（己方城 / 城内被点中的兵 → 他所在的那座城） */
function upgradeTargetId(){
  var i, s;
  for (i = 0; i < selection.length; i++){
    s = selection[i];
    if (s.k === 'c' && sim.castles[s.id] && sim.castles[s.id].owner === mySide) return s.id;
    if (s.k === 'gs' && sim.castles[s.id] && sim.castles[s.id].owner === mySide) return s.id;   // 城内兵 → 他所驻的城

/* 下达成升级军令：主机本地执行，客机发指令交主机（与 dispatch 同一套路） */
function upgradeCastleById(id){
  if (mode !== 'playing' || !sim){ return false; }
  var c = sim.castles[id];
  if (!c || c.owner !== mySide){
    setHint('只能让<b>己方城池</b>里的兵进城升级'); Sound.err(); return false;
  }
  var need = Sim.upgradeNeed(c);
  if (!(need > 0)){
    setHint('此城已是<b>最高等级（Lv' + c.level + '）</b> · 容量与产速均已封顶'); Sound.err(); return false;
  }
  if (c.garrison < need){
    setHint('兵力不足 · 还需 <b>' + Math.max(1, Math.ceil(need - c.garrison)) + '</b> 兵（' +
            Math.floor(c.garrison) + '/' + need + '）才能升到 Lv' + (c.level + 1));
    Sound.err(); return false;
  }
  var lv2 = c.level + 1, cap2 = Math.round(LEVELS[lv2 - 1].cap * sim.mods.cap);
  var isGuestReq = netRole === 'guest';
  if (isGuestReq) Net.send({ t: 'cmd', kind: 'castleUp', cmd: { type: 'castleUp', owner: mySide, id: id } });
  else Sim.command(sim, { type: 'castleUp', owner: mySide, id: id });
  /* 点中的驻城单兵已经作为升级兵力进入城内，只清掉这座城的兵级选择；
     城池/其它部队/框选结果保持不变，避免波及既有多选语义。 */
  selection = selection.filter(function(s){ return !(s.k === 'gs' && s.id === id); });
  if (isGuestReq){
    setHint('升级请求已发送 · 等待房主确认（预计消耗 <b>' + need + '</b> 兵 → Lv' + lv2 + '）');
  } else {
    setHint('<b>' + need + '</b> 兵进城 · 城池升至 <b>Lv' + lv2 + '</b>（容量 ' + cap2 +
            ' · 产速 ' + LEVELS[lv2 - 1].rate + '/秒）');
  }
  return true;
}
/* 快捷键 / 屏内入口：从当前选中推导目标城 */
function tryUpgrade(){

var HINT_DEFAULT_TOUCH = '单指拖空白 = 拖动地图 · 双指缩放<br>点己方城选中 → 点目标派遣 / 回防<br>长按后拖 = 框选多个 · 拖卡出牌 · 长按看详情<br><span style="font-size:12px;opacity:.75">右下 ＋ − ⛶ 也能缩放 / 一键看全图</span>';

function boxSelect(x0, y0, x1, y1){
  var lx = Math.min(x0, x1), rx = Math.max(x0, x1), ty = Math.min(y0, y1), by = Math.max(y0, y1);
  boxRect = { x: lx, y: ty, w: rx - lx, h: by - ty };

  sim.armies.forEach(function(a){
    if (a.owner === mySide && !a.ghost && a.x >= lx - pad && a.x <= rx + pad && a.y >= ty - pad && a.y <= by + pad)   // v1.26 跳过影子部队

canvas.addEventListener('pointerdown', function(e){
