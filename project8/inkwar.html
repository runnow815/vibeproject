<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>墨战 · 水墨城池攻防</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>">
<style>
:root{
  --paper:#f2ecdb; --paper2:#f5f0e0; --ink:#2b2a26; --ink2:#57534a;
  --cinnabar:#b33327; --cinnabar2:#8e2a1d; --gold:#c9962e;
  --dai:#2c5f6e; --zhe:#a86b3c; --lv:#4a6b52;
  /* v1.19 卡面视觉：稀有度三色与 Sim.RARITY.color 同源（有断言互锁，改一处必须同步另一处） */
  --rar-c:#5b6560; --rar-u:#3f6f9a; --rar-r:#9a6a1e;
  --card-radius:5px; --card-shadow:2px 3px 0 rgba(43,42,38,.16);
  --cost-bg:#2b2a26; --cost-fg:#f5f0e0;
  /* v1.19 卡面插画：手牌作纸面水印（零高度代价），结算三选一作正式图区；置 0 即整体降级回 v1.18 */
  --art-op:.20; --art-loot-op:1; --art-loot-h:56px;
  --stage-reserve:176px;
  /* 视觉视口高度：默认 = 布局视口；支持 dvh 则用 dvh；JS 在 visualViewport.resize 时写实际像素（软键盘） */
  --vvh:100vh;
}
@supports (height:100dvh){ :root{--vvh:100dvh} }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink); overflow:hidden;
  font-family:"STKaiti","KaiTi","楷体","Noto Serif SC",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px;
  /* v1.17：安全区（刘海 / home 条 / 横屏左右留白） */
  padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px))
          max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(ellipse at 15% 8%,rgba(43,42,38,.05),transparent 55%),
                   radial-gradient(ellipse at 88% 92%,rgba(179,51,39,.04),transparent 50%);
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;user-select:none}
.topbar,.cardbar{user-select:none}
/* ===== 顶栏 ===== */
.topbar{
  width:min(1080px,96vw); display:flex; align-items:center; gap:14px;
  padding:4px 6px; user-select:none;
}
.brand{
  width:44px;height:44px;flex:none;border:2.5px solid var(--cinnabar);color:var(--cinnabar);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
  letter-spacing:1px;line-height:1.05;border-radius:5px;transform:rotate(-5deg);
  box-shadow:1px 2px 0 rgba(43,42,38,.15);
}
.hud{display:flex;align-items:center;gap:12px;flex:1;min-width:0;font-size:16px;letter-spacing:1px}
.hud .item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.hud .lab{font-style:normal;color:var(--ink2)}
/* v1.24 关卡目标徽标：朱砂描边，倒计时/进度常显 */
.hud .item.goal{border:1.5px solid var(--cinnabar);border-radius:3px;padding:1px 6px}
.hud .item.goal .lab,.hud .item.goal b{color:var(--cinnabar)}
/* v1.26 联机延迟指示：≤80ms 绿 / ≤200ms 金 / 更差朱砂；断线宽限期间显示倒计时 */
.hud .item.net{border:1px solid rgba(43,42,38,.25);border-radius:3px;padding:1px 6px}
.hud .item.net b{font-variant-numeric:tabular-nums}
.hud .narrow{display:none}
.inkwrap{width:110px;height:12px;border:1.5px solid var(--ink2);background:#e6dfca;position:relative;border-radius:2px}
.inkfill{position:absolute;inset:1px;width:30%;background:linear-gradient(90deg,#4a4640,var(--cinnabar));border-radius:1px;transition:width .25s}
.inkwrap.flash{animation:inkflash .4s}
@keyframes inkflash{0%,100%{border-color:var(--ink2)}50%{border-color:#e03e2e;box-shadow:0 0 0 3px rgba(224,62,46,.25)}}
.tbtn{
  border:1.5px solid var(--ink2);background:transparent;color:var(--ink2);
  padding:6px 13px;font-size:15px;letter-spacing:2px;border-radius:4px;
}
.tbtn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
/* 势力存亡条（v1.13）：各阵营徽记，灭亡盖红叉 */
.facs{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
.fac{
  position:relative;display:flex;align-items:center;gap:4px;white-space:nowrap;
  font-size:13px;letter-spacing:0;padding:1.5px 8px;border-radius:10px;
  border:1.5px solid var(--fc);color:var(--fc);background:rgba(247,242,227,.6);
}
.fac b{font-weight:700}
.fac.me{background:var(--fc);color:#f7f2e3;box-shadow:1px 1px 0 rgba(43,42,38,.18)}
.fac.dead{opacity:.42;filter:grayscale(.6)}
.fac.dead::after{
  content:'✗';position:absolute;inset:-3px 0 0 0;display:flex;align-items:center;justify-content:center;
  color:#e03e2e;font-size:16px;font-weight:700;
}
/* 卡片图鉴（v1.13） */
.dexrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
.dexlab{font-size:12.5px;color:var(--ink2);flex:none;width:32px;letter-spacing:2px}
.dex{
  font-size:12px;padding:2px 8px 2px 5px;border-radius:9px;border:1.2px solid var(--ink2);
  color:var(--ink2);opacity:.4;position:relative;white-space:nowrap;
  /* v1.19：左侧让出插画位（图由 injectArtStyle 按 data-art 一次性注入为 ::before 背景，不污染 innerHTML） */
  display:inline-flex;align-items:center;gap:3px;
}
.dex::before{content:'';flex:none;width:19px;height:14px;background:no-repeat center/contain;opacity:.9}
.dex:not(.own)::before{filter:grayscale(1);opacity:.55}       /* 未获得：插画去色 */
.dex.own{opacity:1;border-color:var(--rc,var(--cinnabar));color:var(--ink);background:rgba(179,51,39,.06)}
.dex.up::after{content:'＋';color:var(--cinnabar);font-weight:700;margin-left:1px}
.dex i{font-style:normal;margin-left:4px;color:var(--cinnabar);font-weight:700}
/* 等待室（v1.13） */
.waitrow{display:flex;gap:12px;justify-content:center;margin:10px 0 6px}
.seat{
  min-width:132px;padding:8px 10px;border:2px solid var(--ink2);border-radius:8px;
  text-align:center;background:rgba(247,242,227,.7);
}
.seat .face{
  width:52px;height:52px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#f7f2e3;border:3px solid var(--ink2);position:relative;
}
.seat .face.ok::after{
  content:'✓';position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;
  background:#3f7a4a;color:#f7f2e3;font-size:14px;display:flex;align-items:center;justify-content:center;
}
.seat .nm{font-size:14px;font-weight:700}
.seat .rc{font-size:12.5px;color:var(--ink2);margin-top:2px}
.waitlog{
  text-align:left;font-size:13px;line-height:1.8;color:var(--ink2);
  border-top:1.5px dashed var(--ink2);margin-top:8px;padding-top:6px;min-height:74px;
}
/* ===== 舞台（三重约束响应式） ===== */
/* v1.27：画布宽高比参数化 —— 桌面/横屏 16:9 完整显示；手机竖屏放宽到 1.15（见断点），
   配合「铺满 + 双指缩放平移」，把棋盘占屏高从 25% 提到 ~40%（原先上下各一大块死白）。 */
.stage{
  position:relative;   /* v1.17：去掉 container-type —— 它会形成布局限制，使内部 fixed 元素不再相对视口 */
  width:min(1080px, 96vw, calc((var(--vvh) - var(--stage-reserve)) * var(--board-ar,1.7778)));   /* v1.18：--vvh 随软键盘收缩 */
}
#board{
  display:block;width:100%;aspect-ratio:var(--board-ar,1.7778);border:2px solid var(--ink);
  background:var(--paper2);touch-action:none;box-shadow:4px 5px 0 rgba(43,42,38,.14);
  border-radius:3px;cursor:crosshair;
}
/* v1.27 视野指示：缩放/平移偏离默认视角时才出现，点按复位。左上（右下是 dpad，左下是缩略图） */
.zoomchip{
  position:absolute;left:6px;top:6px;z-index:6;display:none;
  font-size:12px;letter-spacing:1px;color:var(--paper2);background:rgba(43,42,38,.72);
  border-radius:10px;padding:3px 9px;pointer-events:auto;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.zoomchip.on{display:block}
/* ===== v1.37 屏内缩放控件：触屏专用（桌面走滚轮，不显示，桌面端零回归） =====
   竖屏画布变瘦长后 cover 裁掉约一半地图，双指缩放不是人人会用 —— 给一组 44px 的 ＋ / − / ⛶：
   ⛶ = 一键缩到「整图可见」（viewFit），＋/− 以画布中心为锚点按 1.35 倍步进。
   位置放右侧垂直居中（拇指弧线上），与右下角的 .dpad、左上角的 .zoomchip 都不重叠。 */
.zbar{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:6;display:none;
  flex-direction:column;gap:8px;-webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.zbar.on{display:flex}
.zbar b{
  width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(247,242,227,.9);border:1.5px solid var(--ink2);border-radius:50%;
  color:var(--ink);font-size:19px;font-weight:700;line-height:1;cursor:pointer;
  box-shadow:1px 2px 0 rgba(43,42,38,.22);
}
.zbar b:active{background:var(--ink);color:var(--paper2)}
.zbar b.fit{font-size:15px}
.zbar b.fitdone{background:var(--ink);color:var(--paper2)}   /* v1.37：已在「整图可见」档 */
/* ===== 底部操作区 ===== */
.cardbar{width:min(1080px,96vw);display:flex;gap:10px;align-items:stretch;min-width:0}
/* ===== v1.34 出兵比例条：读数 + 滑块（0~100% 连续）+ 25/50/75/100 快捷档位 =====
   三行竖排：读数行（比例 — 实际兵力）/ 滑块 / 档位；可用兵力为 0 或比例越界 → .off 置灰禁用 */
.ratio{flex:none;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:192px;
  padding:5px 8px;border:1.5px solid var(--ink2);border-radius:4px;background:#efe8d3;
  -webkit-user-select:none;user-select:none}
.ratio .rhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ratio .rlabel{font-style:normal;font-size:11.5px;letter-spacing:1px;color:var(--ink2);white-space:nowrap}
.ratio .rval{font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--ink);white-space:nowrap}
/* 滑块去默认外观：墨线轨道 + 朱砂圆点（与卡片角标/城池徽记同一套朱砂） */
.ratio .rslide{-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;background:transparent;cursor:pointer}
.ratio .rslide::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#d9d1b9;border:1px solid var(--ink2)}
.ratio .rslide::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-6px;
  border-radius:50%;background:var(--cinnabar);border:1.5px solid var(--ink);box-shadow:1px 1px 0 rgba(43,42,38,.25)}
.ratio .rslide::-moz-range-track{height:4px;border-radius:2px;background:#d9d1b9;border:1px solid var(--ink2)}
.ratio .rslide::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--cinnabar);border:1.5px solid var(--ink)}
.ratio .rquick{display:flex;gap:4px}
.ratio .rquick b{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:1px 2px;
  font-size:11.5px;letter-spacing:.5px;color:var(--ink2);background:#f2ecda;
  border:1.2px solid var(--ink2);border-radius:3px;cursor:pointer}
.ratio .rquick b.on{background:var(--ink);color:var(--paper2);border-color:var(--ink);font-weight:700}
/* 禁用态：可用兵力为 0（未选中己方城池/阵列）或比例越界 */
.ratio.off{opacity:.5;filter:grayscale(.55)}
.ratio.off .rslide{cursor:not-allowed}
.ratio.off .rquick b{cursor:not-allowed}
/* v1.17：5 张卡 flex 等分 —— 取消「min-width:88px」与「max-width」的冲突，窄屏不再横向溢出 */
.cards{display:flex;gap:5px;flex:1 1 auto;min-width:0;justify-content:center}
.card{
  flex:1 1 0;min-width:0;max-width:96px;
  border:1.5px solid var(--ink);background:#f9f4e6;border-radius:4px;position:relative;
  padding:6px 4px 5px;text-align:center;box-shadow:2px 3px 0 rgba(43,42,38,.16);
  transition:transform .12s;color:var(--ink);min-height:64px;
}
/* v1.14 稀有度配色 → v1.19：三档各配一套框线 + 底纹 + 内封（普通墨线 / 罕见靛蓝内环 / 稀有金线 + 虚线内封 + 外晕） */
.card.r-c{border-color:var(--rar-c);background:linear-gradient(180deg,#f9f4e6,#f4ecd9)}
.card.r-u{border-color:var(--rar-u);background:linear-gradient(180deg,#f7f6ef,#e9f0f7);
  box-shadow:var(--card-shadow),inset 0 0 0 2px rgba(63,111,154,.13)}
.card.r-r{border-color:var(--rar-r);background:linear-gradient(180deg,#fdf8ea,#f7ead0);
  box-shadow:var(--card-shadow),inset 0 0 0 2px rgba(154,106,30,.16),0 0 0 2px rgba(154,106,30,.10)}
.card.r-r::after{content:'';position:absolute;inset:1.5px;border-radius:3px;pointer-events:none;z-index:2;
  border:1px dashed rgba(154,106,30,.38)}
.card .cn{font-size:clamp(13px,1.1vw + 8px,18px);letter-spacing:2px;font-weight:700;line-height:1.15;position:relative}
.card .cn .rk{position:absolute;right:-2px;top:-9px;font-size:9px;letter-spacing:0;font-style:normal;
  color:var(--rc,#5b6560);font-weight:400;border:1px solid var(--rc,#5b6560);border-radius:2px;padding:0 2px;background:#fdfaf0}
.card.up{background:linear-gradient(#fdf8ea,#f6ecd2)}
/* v1.19：升级版叠加稀有度底色（必须写在 .r-* 之后才能覆盖） */
.card.up.r-u{background:linear-gradient(#fdf8ea,#e7eef6)}
.card.up.r-r{background:linear-gradient(#fdf8ea,#f8e8c9)}
.card.up .cn::after{content:'＋';font-size:11px;color:var(--cinnabar);vertical-align:super}
/* v1.14：牌堆计数（抽 / 弃 / 消） */
.piles{display:flex;gap:7px;align-self:center;font-size:11.5px;letter-spacing:1px;color:var(--ink2);flex:none}
.piles span{border:1px solid var(--ink2);border-radius:3px;padding:1px 5px;background:#f2ecda}
.piles .pl3{color:var(--cinnabar);border-color:var(--cinnabar)}
.card:hover{transform:translateY(-2px)}
.card .cd{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.3;height:29px;display:flex;align-items:center;justify-content:center}
.card .cc{font-size:12px;color:var(--paper2);background:var(--ink);display:inline-block;padding:0 8px;border-radius:2px;letter-spacing:1px}
.card.dim{opacity:.45;filter:grayscale(.35)}       /* v1.19：不可用 / 冷却中再补一道去色 */
.card.aim{outline:2.5px solid var(--cinnabar);outline-offset:2px;transform:translateY(-3px)}
.card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* ===== v1.19 卡面：纸纹底 / 插画容器 / 状态标记 ===== */
/* 纸纹：三层极淡 CSS 渐变（双 radial 云斑 + 1px 帘纹）。
   刻意不用 feTurbulence —— 逐像素滤镜在「冷却期每秒重建」的卡面上会掉帧，且图鉴 data-URI 背景是独立文档、取不到宿主滤镜 */
.card::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  border-radius:calc(var(--card-radius) - 1px);
  background:radial-gradient(ellipse at 18% 12%,rgba(43,42,38,.045),transparent 46%),
             radial-gradient(ellipse at 86% 88%,rgba(43,42,38,.035),transparent 42%),
             repeating-linear-gradient(94deg,rgba(43,42,38,.028) 0 1px,transparent 1px 5px)}
.card>*{position:relative;z-index:1}                 /* 文字永远压在纸纹与插画之上 */
/* 插画容器：手牌走 absolute 水印（零高度代价，重排开销近 0）；结算三选一走正式图区 */
.inkart{position:absolute;inset:0;display:block;pointer-events:none;z-index:0;
  opacity:var(--art-op);border-radius:3px}
.inkart>svg{width:100%;height:100%;display:block}
.card.up .inkart{opacity:calc(var(--art-op) + .1)}
.card.loot .inkart{position:relative;inset:auto;z-index:1;display:block;
  height:var(--art-loot-h);margin:0 0 5px;opacity:var(--art-loot-op)}
/* 升级版朱砂「＋」印记：叠在插画右下角，结算卡放大后最明显 */
.card.up .inkart::after{content:'＋';position:absolute;right:4px;bottom:1px;
  font:700 24px/1 "STKaiti","KaiTi","楷体",serif;color:var(--cinnabar);
  text-shadow:0 0 3px rgba(247,242,227,.95),1px 1px 0 rgba(247,242,227,.9)}
/* 冷却：圆形朱砂徽 —— 只读 .cn 上的 data-cd，不产出任何新可见文本（既有文本断言自动免疫） */
.card .cn[data-cd]::before{content:attr(data-cd);position:absolute;left:-6px;top:-7px;
  min-width:15px;height:15px;line-height:15px;font-size:9px;letter-spacing:0;font-weight:700;text-align:center;
  color:#f7f2e3;background:var(--cinnabar);border-radius:50%;box-shadow:1px 1px 0 rgba(43,42,38,.25)}
/* 消耗牌：墨签右下角一道朱砂斜切（纯视觉，不动文本） */
.card[data-ex] .cc{background:linear-gradient(135deg,var(--cost-bg) 78%,var(--cinnabar2) 78%)}
/* ===== v1.33 卡面精简：费用角标 / 消耗斜切 / 拖拽占位 =====
   卡面只留「插画 + 名称 + 费用」三要素，描述与冷却秒数进 .inkpop 浮层。
   注意：.cd / .cc 两条规则**一行都不能删** —— 结算三选一（.card.loot）仍在用它们。 */
/* 费用角标：右下角墨签。与左上冷却圆徽、右上稀有度角标三方互不重叠 */
.card .inkcost{position:absolute;right:2px;bottom:2px;z-index:2;
  min-width:17px;height:17px;line-height:16px;padding:0 3px;border-radius:3px;
  font:700 10.5px/16px "STKaiti","KaiTi","楷体",serif;font-style:normal;
  color:var(--cost-fg);background:var(--cost-bg);box-shadow:1px 1px 0 rgba(43,42,38,.25)}
.card.dim .inkcost{background:var(--ink2)}
/* 手牌已无 .cc：消耗斜切改挂费用角标（loot 卡仍走上面 203 行的旧规则） */
.card[data-ex] .inkcost{background:linear-gradient(135deg,var(--cost-bg) 72%,var(--cinnabar2) 72%)}
/* 拖拽中：原卡置灰占位（class 由 dragCard.slot 推导，可断言） */
.card.out{opacity:.22;filter:grayscale(.6)}
.card.out .inkart{opacity:.06}
/* 拖拽中：手牌区不再响应 hover 位移，避免跟手替身与「卡面抬起」打架 */
.cards{touch-action:none}                        /* 触屏拖卡不被浏览器滚动 / 长按菜单抢走 */
.cards.dragging{cursor:grabbing}
.cards.dragging .card{transition:none;pointer-events:none}
.cards.dragging .card:hover,.cards.dragging .card.aim{transform:none}
/* ===== v1.33 卡牌详情浮层 =====
   默认 display:none + position:fixed：不占布局，check-mobile 的溢出量测抓不到它。 */
.inkpop{position:fixed;z-index:60;display:none;pointer-events:none;
  width:min(258px,78vw);padding:8px 10px;background:#fbf6e9;color:var(--ink2);
  border:1.5px solid var(--ink);border-radius:4px;box-shadow:3px 4px 0 rgba(43,42,38,.22);
  font-size:12.5px;line-height:1.6;letter-spacing:.5px}
.inkpop.on{display:block}
.inkpop .ph{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.inkpop .ph b{font-size:15px;color:var(--ink);letter-spacing:2px}
.inkpop .ph .pr{font-style:normal;font-size:11px;color:var(--cost-fg);
  background:var(--rc,var(--ink2));border-radius:2px;padding:0 5px}
.inkpop .pc{font-size:12px;color:var(--ink);padding-bottom:5px;margin-bottom:5px;
  border-bottom:1px dashed rgba(43,42,38,.25)}
.inkpop .pd{color:var(--ink2)}
.inkpop .pf{margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px}
.inkpop .pf .ex{font-style:normal;color:var(--cinnabar)}
/* ===== v1.33 拖拽替身 =====
   class 以 ink 开头：smoke-ui 按 /class="card/g 前缀计数，绝不能用 card 开头。
   基础态**不加 transition**（跟手必须零延迟），只有回弹 .back 才动画。 */
.inkghost{position:fixed;z-index:70;pointer-events:none;
  width:92px;height:64px;margin:-32px 0 0 -46px;         /* 以指针为中心 */
  border:1.5px solid var(--ink);border-radius:4px;background-color:#f9f4e6;
  background-repeat:no-repeat;background-position:center;background-size:86% 86%;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;
  box-shadow:3px 4px 0 rgba(43,42,38,.28);opacity:.92}
.inkghost b{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--ink);
  text-shadow:0 0 3px rgba(249,244,230,.95),1px 1px 0 rgba(249,244,230,.9)}
.inkghost.ok{border-color:var(--cinnabar);
  box-shadow:0 0 0 3px rgba(179,51,39,.22),3px 4px 0 rgba(43,42,38,.28)}
.inkghost.bad{opacity:.62;filter:grayscale(.55)}
.inkghost.back{transition:left .18s ease-in,top .18s ease-in,opacity .18s linear;opacity:0}
.inkghost.r-u{border-color:var(--rar-u)}
.inkghost.r-r{border-color:var(--rar-r)}
/* ===== v1.21 提示条：固定高度 + 溢出裁剪 —— 高度恒定，文案变化不再撑高卡栏（棋盘不再跳） ===== */
.hint{flex:none;align-self:center;height:96px;color:var(--ink2);font-size:12.5px;letter-spacing:1px;
  max-width:166px;text-align:center;line-height:1.6;overflow:hidden}   /* v1.34：让出宽度给比例条（档位需 40px 热区） */
/* ===== 遮罩层（菜单/暂停/结算 复用） ===== */
/* v1.17：遮罩层改为全屏 fixed —— 竖屏手机的 16:9 舞台只有约 360×202，
   面板塞在里面根本展不开；移到 body 直属并用整屏空间（可滚动） */
.overlay{
  position:fixed; inset:0; background:rgba(36,32,26,.52);backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:50;
  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px))
          max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
}
.overlay.hide{display:none}
.panel{
  width:min(560px,94vw);
  max-height:calc(var(--vvh) - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#f7f2e3;border:2px solid var(--ink);
  box-shadow:6px 7px 0 rgba(20,18,14,.35);padding:20px 22px 16px;text-align:center;border-radius:4px;
}
.panel h1{font-size:34px;letter-spacing:16px;text-indent:16px;font-weight:700;line-height:1.2}
.panel h1 i{color:var(--cinnabar);font-style:normal}
.panel .motto{color:var(--ink2);font-size:13px;letter-spacing:4px;margin:4px 0 14px}
.pbox{border:1.5px solid var(--ink2);border-radius:4px;padding:12px 14px;margin-bottom:12px;text-align:left;background:#fbf6e9}
.ptitle{font-size:17px;letter-spacing:4px;margin-bottom:9px;display:flex;align-items:baseline;gap:8px}
.ptitle small{font-size:12px;color:var(--ink2);letter-spacing:1px}
.optrow{display:flex;align-items:center;gap:7px;margin:7px 0;flex-wrap:wrap}
.optrow .lab{font-size:13.5px;color:var(--ink2);width:44px;letter-spacing:2px;flex:none}
.opt{font-size:13.5px;border:1px solid var(--ink2);padding:4px 11px;border-radius:3px;color:var(--ink2);background:transparent;letter-spacing:1px}
.opt.sel{background:var(--ink);color:var(--paper2);border-color:var(--ink)}
.bigbtn{
  display:block;width:100%;padding:10px 0;font-size:20px;letter-spacing:14px;text-indent:14px;
  background:var(--cinnabar);color:#fbf6e9;border:none;border-radius:4px;
  box-shadow:2px 3px 0 rgba(43,42,38,.3);margin:2px 0 4px;
}
.bigbtn:active{transform:translateY(1px)}
.lvlgrid{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.lvl{width:40px;height:40px;border:1.5px solid var(--ink2);border-radius:3px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:15px;color:var(--ink2);background:transparent;line-height:1}
.lvl small{font-size:9px;letter-spacing:0;margin-top:1px}
.lvl.done{background:var(--lv);color:#fff;border-color:var(--lv)}
.lvl.now{border-color:var(--cinnabar);color:var(--cinnabar);box-shadow:0 0 0 2px rgba(179,51,39,.22)}
.lvl:disabled{opacity:.32;cursor:not-allowed}
/* v1.24 关卡目标图例 */
.gllegend{margin-top:6px;font-size:11.5px;color:var(--ink2);letter-spacing:0;line-height:1.6}
.gllegend b{color:var(--cinnabar);font-weight:700}
/* v1.25 自定义对局参数折叠区 */
/* v1.26：等待室里客机看到的规则按钮是只读的（由房主设定） */
.opt:disabled{opacity:.4;cursor:default}
.cstrow{margin:8px 0 2px;text-align:center}
.cstbox{margin:6px 0 2px;padding:8px 10px;border:1px dashed rgba(43,42,38,.25);border-radius:6px;background:rgba(43,42,38,.03)}
.cstbox .optrow{margin:5px 0}
.cstnote{margin-top:6px;font-size:11.5px;color:var(--ink2);letter-spacing:0;line-height:1.6}
/* v1.25 战报：曲线 / 时间轴 / 统计（战报只留内存，不进本地存储） */
.repchart{display:block;width:100%;height:92px;margin:4px 0 2px;background:rgba(43,42,38,.04);border-radius:4px}
.repnone{font-size:12px;color:var(--ink2);padding:6px 2px;letter-spacing:0}
.replines{margin:4px 0;max-height:150px;overflow-y:auto}
.repline{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.9;letter-spacing:0}
.rept{font-style:normal;color:var(--ink2);min-width:38px;font-variant-numeric:tabular-nums}
.repk{width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;background:rgba(43,42,38,.07);font-size:11px}
.repline span{color:var(--ink);flex:1}
.repstat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);letter-spacing:0}
.repstat b{color:var(--ink);font-size:14px}
/* v1.25 新手引导：四面遮罩围出一个「洞」+ 洞边框 + 说明卡（与 mode 正交，不改写任何既有状态） */
.tutwall{position:fixed;z-index:60;background:rgba(20,19,17,.55)}
.tuthole{position:fixed;z-index:61;pointer-events:none;border:2px solid var(--cinnabar);border-radius:7px;
  box-shadow:0 0 0 2px rgba(242,236,219,.55)}
.tutcard{position:fixed;z-index:62;left:50%;transform:translateX(-50%);bottom:14px;
  width:min(370px,92vw);background:var(--paper2);border:1px solid rgba(43,42,38,.28);border-radius:8px;
  padding:12px 14px;box-shadow:3px 4px 0 rgba(43,42,38,.18)}
.tutstep{font-size:11.5px;color:var(--ink2);letter-spacing:1px}
.tuttitle{font-size:15px;font-weight:700;letter-spacing:2px;margin:2px 0 6px}
.tutbody{font-size:13px;line-height:1.75;letter-spacing:0;color:var(--ink)}
.tutbtns{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tutbtns .bb{padding:6px 14px;font-size:13px}
.tutwait{font-size:12px;color:var(--cinnabar);letter-spacing:0}
/* v1.25 成就与档案 */
.achlist{margin-top:6px;max-height:52vh;overflow-y:auto}
.achrow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px dashed rgba(43,42,38,.16);font-size:13px}
.achrow.on .achname{color:var(--cinnabar)}
.achname{min-width:74px;font-weight:700;letter-spacing:1px}
.achdesc{flex:1;color:var(--ink2);letter-spacing:0}
.achok{font-style:normal;color:var(--cinnabar);font-size:12px}
.achprog{font-style:normal;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.slotbox{margin:8px 0;padding:8px 10px;border:1px solid rgba(43,42,38,.2);border-radius:6px}
.slotname{font-size:14px;font-weight:700;letter-spacing:2px}
.slotinfo{font-size:12px;color:var(--ink2);line-height:1.7;letter-spacing:0;margin:2px 0 6px}
.slotbtns{display:flex;gap:6px;flex-wrap:wrap}
.slotbtns .tbtn:disabled{opacity:.35;cursor:not-allowed}
.slotnote{margin-top:8px;font-size:11.5px;color:var(--ink2);letter-spacing:0;line-height:1.6}
.mfoot{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:13px;margin-top:4px;padding:0 2px}
/* v1.35 底栏版本号：不抢视觉（半透明小字），但够用来核对线上跑的是哪一版 */
.vtag{opacity:.5;font-size:11px;letter-spacing:.5px;white-space:nowrap}
/* 结算印章 */
.stamp{width:112px;height:112px;margin:4px auto 10px;border:5px solid;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;transform:rotate(-8deg);
  font-size:36px;letter-spacing:8px;text-indent:8px;font-weight:700;line-height:1.1}
.stamp small{font-size:11px;letter-spacing:2px;margin-top:4px;text-indent:0}
.stamp.win{color:var(--cinnabar);border-color:var(--cinnabar)}
.stamp.lose{color:#3a3a3a;border-color:#3a3a3a}
.rstat{color:var(--ink2);font-size:14.5px;line-height:1.9;margin:6px 0 14px;letter-spacing:1px}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bb{padding:9px 24px;font-size:16px;letter-spacing:3px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.bb.pri{background:var(--cinnabar);color:#fbf6e9;border-color:var(--cinnabar)}
.lootrow{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}
.card.loot{width:31%;min-width:88px;padding-top:5px}   /* v1.19：顶部让出插画图区 */
.packrow{font-size:13.5px;color:var(--ink2);margin:5px 0;letter-spacing:1px}
.packrow small{font-size:11px;color:var(--gold);margin-left:4px}
.codebox{
  width:100%;height:58px;font-size:11px;line-height:1.4;color:var(--ink2);resize:none;
  border:1px dashed var(--ink2);border-radius:4px;background:#fbf6e9;padding:5px 7px;
  font-family:Consolas,monospace;word-break:break-all;margin:4px 0;
}
/* v1.26 连接状态提示：跟随 ICE 阶段实时更新，20 秒未连通明确报超时 */
#pvpStat{display:inline-block;font-size:13px;letter-spacing:1px;color:var(--ink2);margin-left:8px;min-height:18px;vertical-align:middle}
#pvpStat.pvpbad{color:var(--cinnabar)}
.pvpcode{font-size:11.5px;color:var(--gold);letter-spacing:0;margin:2px 0 8px}
/* v1.39 房间码：6 位、大写、超大字号 —— 手机上念一遍就能输完，不用再搬 500 字的联机码 */
.roomcode{
  font-size:40px;line-height:1.1;letter-spacing:10px;text-align:center;font-weight:700;
  color:var(--cinnabar);background:#fbf6e9;border:2px dashed var(--ink2);border-radius:6px;
  padding:10px 4px 10px 14px;margin:6px 0 8px;font-family:Consolas,monospace;user-select:all;
}
.roomin{
  width:150px;height:44px;font-size:26px;letter-spacing:6px;text-align:center;text-transform:uppercase;
  color:var(--ink);background:#fbf6e9;border:1px dashed var(--ink2);border-radius:4px;
  padding:0 4px 0 10px;font-family:Consolas,monospace;margin:4px 6px 4px 0;vertical-align:middle;
}
/* v1.37 续连区：对局中断线时联机面板挂到覆层上（菜单不在 DOM），给个上边距别贴着标题 */
.relinkbox{margin-top:10px;text-align:left}
/* ===== v1.20 屏内方向键：与 canvas 平级覆盖在棋盘右下角，仅操控兵/部队时出现 ===== */
.dpad{
  position:absolute;right:8px;bottom:8px;z-index:5;display:none;
  grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:4px;   /* v1.28：30px 对触控板/手指都偏小 */
  touch-action:none;-webkit-user-select:none;user-select:none;
}
.dpad.on{display:grid}
.dpad b{
  display:flex;align-items:center;justify-content:center;
  background:rgba(247,242,227,.86);border:1.5px solid var(--ink2);border-radius:4px;
  color:var(--ink);font-size:15px;font-weight:700;line-height:1;cursor:pointer;
  box-shadow:1px 2px 0 rgba(43,42,38,.2);
}
.dpad b:active,.dpad b.on{background:var(--ink);color:var(--paper2)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .c{grid-area:2/2;font-size:12px;letter-spacing:0}
.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}

/* ===== v1.20 敌方出牌提示条：棋盘顶部居中，阵营色，2.6s 后淡出 ===== */
.foebar{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  display:none;pointer-events:none;max-width:92%;
  padding:5px 13px;border-radius:3px;border:1.5px solid var(--ink2);
  background:rgba(247,242,227,.95);box-shadow:2px 3px 0 rgba(43,42,38,.18);
  font-size:14px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.foebar.on{display:block;animation:foein .18s ease-out, foeout .45s ease-in 2.15s forwards}
.foebar i{font-style:normal;font-weight:700}
@keyframes foein{from{opacity:0;transform:translate(-50%,-9px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes foeout{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-6px)}}

/* ===== v1.37 响应式断点（竖屏卡栏贴底 + 空间还给卡面；横屏卡栏改右侧竖排侧栏） ===== */
/* v1.37 竖屏重做：旧布局用 `.stage{margin:auto}` 把富余纵向空间**均分到地图上下** ——
   实测 iPhone13 竖屏（390×844）棋盘只占屏高 33%，上下各留 ~150px 死白（合计 300px，占屏 36%）。
   现在改成「顶栏 auto / 舞台 flex:1 / 卡栏 auto」：舞台吃掉全部剩余高度，画布不再按 --board-ar
   反推高度（改由 flex 给定 + 绝对定位铺满舞台），--board-ar 只作 JS 未就绪时的兜底。
   画布变瘦长后 cover 裁切更多，故同步新增：⛶ 全览 / ＋ / − 三个屏内按钮（见 .zbar）、
   缩放到「整图可见」的下限放开（viewZoomMin），以及被裁时常驻的缩略图。 */
@media (max-width:700px) and (orientation:portrait){
  :root{--stage-reserve:244px;--art-op:.26;--art-loot-h:48px;--board-ar:1.35;--board-ar-min:.62}
  body{justify-content:space-between;gap:6px}
  /* 舞台吃掉剩余高度；--board-ar-min 是「最多允许多瘦」的闸门（越瘦裁得越多，靠 ⛶ 找回来）。
     v1.38：0.9 太保守 —— 390×844 下 96vw/.9 = 416px 就把舞台卡死，剩 116px 被 space-between
     变成上下死白（棋盘只占 49%）。放宽到 .62 后舞台能吃满剩余高度（实测 63%），
     代价是 cover 裁得更多（可见宽度 60%→47%），由 v1.38 的单指平移 + ⛶ 全览 + 缩略图兜住。 */
  .stage{flex:1 1 auto;min-height:96px;width:min(1080px,96vw);margin:0;
         max-height:calc(96vw / var(--board-ar-min,.9))}
  #board{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;min-height:0}
  .cardbar{margin-top:0;flex:none;flex-wrap:wrap;gap:8px}
  .brand{width:38px;height:38px;font-size:15px}
  .hud{gap:7px;font-size:13px}
  .inkwrap{width:72px}
  .tbtn{padding:5px 9px;font-size:13px;letter-spacing:1px}
  /* 操作区两行：第一行 提示 + 5 张卡横铺满屏，第二行 比例 + 牌堆 */
  .cards{order:2;flex:1 1 100%;gap:5px;align-items:stretch}
  /* v1.37：手牌高度必须显式抬高 —— `@media (pointer:coarse)` 块在源码里排在断点之后，
     它的 `.card{min-height:44px}` 会把这里的 76px 覆盖掉（实测触屏手牌只有 44px，比桌面 64px 还矮）。
     用 `.cardbar .card`（0,2,0）压过它（0,1,0），不再依赖源码顺序这种脆弱约定。 */
  .cardbar .card{min-height:76px}
  /* v1.34：竖屏改成「读数行 +（滑块 + 档位）行」两行横排 —— 棋盘按剩余高度封顶，纵向一寸都不能浪费 */
  .ratio{order:3;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:center;
         gap:4px 6px;padding:4px 7px;min-width:0}
  /* v1.38：比例条在「没有可出兵的选中项」时是纯占位（灰着也不能用），竖屏下直接收起 ——
     实测 iPhone13 竖屏这条白占 73px（≈9% 屏高）。收起来全部还给棋盘（极窄屏 46%→59%）。
     桌面 / 横屏侧栏不受影响（只作用于 .cardbar 内的竖屏态）。 */
  .cardbar .ratio.off{display:none}
  .ratio .rhead{flex:1 1 100%}
  .ratio .rlabel{font-size:11px}
  .ratio .rval{font-size:12px}
  .ratio .rslide{flex:1 1 80px;min-width:80px;height:22px}
  .ratio .rquick{flex:0 0 auto;gap:4px}
  .ratio .rquick b{min-width:40px}
  .piles{order:4;flex:1 1 auto;font-size:11.5px}
  .card{max-width:none;min-height:76px;padding:7px 5px}
  .card .cn{font-size:clamp(13px,3.6vw,18px)}
  .card .cd{display:flex;height:auto;font-size:11.5px}
  /* v1.21：提示重新可见（原先整个手机端都看不到操作指引），固定 42px 高不抖动 */
  .hint{display:block;order:1;flex:1 1 100%;align-self:flex-start;height:42px;max-width:none;
        font-size:12px;line-height:1.55;margin-top:2px}
  .panel{padding:14px 12px 12px}
  .panel h1{font-size:26px;letter-spacing:10px;text-indent:10px}
  .opt{padding:6px 12px;min-height:44px}
  .lvl{width:36px;height:36px}
  .bb{padding:11px 20px;font-size:16px}
}
@media (max-width:430px) and (orientation:portrait){ /* 窄屏：顶栏极简模式 */
  :root{--stage-reserve:236px;--art-op:.22}
  .hud{gap:6px;font-size:12px}
  .hud .lab{display:none}
  .hud .wide{display:none}
  .hud .narrow{display:inline}
  .inkwrap{width:56px}
  .brand{width:32px;height:32px;font-size:13px}
  .cardbar{gap:6px}
  /* v1.34：320px 极窄屏仍要保证档位 40px 热区（滑块让到 60px，两者同排不换行） */

  .tbtn{min-width:44px}

/* 升级版（v1.14）：同名卡的「+」变体，与基础版同为独立 key，可共存于卡组；只从战利品获得 */
CARDS.slice().forEach(function(c){

/* 卡数值：升级版取 v（已在生成时替换为 vu），applyCard 一律走这里，不写死常量 */

/* 闯关十五关（v1.24：10 → 15）
   goal 关卡目标（缺省 = conquer 清空敌方）：

   v1.27 梯度重排：入门 ×2 → 休闲 ×4 → 标准 ×4 → 困难 ×5，且敌方初始加成改为 0/5/10/15/20 五档细步，

var CAMPAIGN = [

function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dist(ax, ay, bx, by){ var dx = ax-bx, dy = ay-by; return Math.sqrt(dx*dx + dy*dy); }

/* ---------- 地图生成：最小间距拒绝采样 + 主城方位 + AI 贪心远点 ---------- */
function mapGen(sim, opts){
  var N = opts.castles || 11, rng = sim.rng;
  var pts = [], minD = CFG.MIN_DIST, guard = 0;
  while (pts.length < N && guard < 8000){
    guard++;
    if (guard > 4000) minD = Math.max(150, minD - 1);
    var x = 90 + rng() * (CFG.MAP_W - 180), y = 90 + rng() * (CFG.MAP_H - 180);
    var ok = true;
    for (var i = 0; i < pts.length; i++){
      var dx = pts[i].x - x, dy = pts[i].y - y;
      if (dx*dx + dy*dy < minD*minD){ ok = false; break; }
    }
    if (ok) pts.push({ x: x, y: y });
  }
  var pi = 0, best = Infinity;                    // 玩家主城：最靠左下角
  for (i = 0; i < pts.length; i++){
    var d = dist(pts[i].x, pts[i].y, 190, 780);
    if (d < best){ best = d; pi = i; }
  }
  var home = pts.splice(pi, 1)[0];
  var chosen = [home], aiPts = [];                 // AI 主城：贪心取离已选点最远者
  for (var k = 0; k < (opts.opponents || 1); k++){
    var bi = 0, bd = -1;
    for (i = 0; i < pts.length; i++){
      var md = Infinity;
      for (var j = 0; j < chosen.length; j++) md = Math.min(md, dist(pts[i].x, pts[i].y, chosen[j].x, chosen[j].y));
      if (md > bd){ bd = md; bi = i; }
    }
    aiPts.push(pts.splice(bi, 1)[0]);
    chosen.push(aiPts[aiPts.length-1]);
  }
  var aid = 0;
  sim.castles.push({ id: aid++, owner: 1, x: home.x, y: home.y, level: 1, garrison: 20, tower: null, shieldT: 0, weakT: 0, flashT: 0, buffT: 0, hitT: 0, ambushT: 0, ambushN: 0, plagueT: 0 });
  for (k = 0; k < aiPts.length; k++)
    sim.castles.push({ id: aid++, owner: 2 + k, x: aiPts[k].x, y: aiPts[k].y, level: 1, garrison: 20 + (opts.bonus || 0), tower: null, shieldT: 0, weakT: 0, flashT: 0, buffT: 0, hitT: 0, ambushT: 0, ambushN: 0, plagueT: 0 });
  for (i = 0; i < pts.length; i++)
    sim.castles.push({ id: aid++, owner: 0, x: pts[i].x, y: pts[i].y, level: 1, garrison: 18 + Math.floor(rng() * 15), tower: null, shieldT: 0, weakT: 0, flashT: 0, buffT: 0, hitT: 0, ambushT: 0, ambushN: 0, plagueT: 0 });   // 中立驻军固定（不产兵）
  for (i = 0; i < sim.castles.length; i++) maybeTower(sim, sim.castles[i]);   // 塔在点位与驻军定完后统一掷点
}
/* 开局建塔：按概率掷点（塔专用 rng，不污染主线随机序列） */
function maybeTower(sim, c){
  if (c.tower) return;
  var p = sim.opts.towerChance != null ? sim.opts.towerChance
        : (c.owner === 0 ? CFG.TOWER_CHANCE.neutral : CFG.TOWER_CHANCE.home);
  if (!(p > 0)) return;
  if (sim.trng() >= p) return;
  c.tower = { kind: TOWERS[Math.floor(sim.trng() * TOWERS.length)].kind, lv: 1, cd: 0 };
}
/* 城池升级时：按概率建塔，已有塔则升塔（封顶 TOWER_MAX_LV） */
function maybeBuildTower(sim, c){
  var p = sim.opts.upTowerChance != null ? sim.opts.upTowerChance : CFG.TOWER_UP_CHANCE;
  if (!(p > 0) || sim.trng() >= p) return;
  if (!c.tower){
    c.tower = { kind: TOWERS[Math.floor(sim.trng() * TOWERS.length)].kind, lv: 1, cd: 0 };
    sim.events.push({ type: 'tower', kind: c.tower.kind, x: c.x, y: c.y, lv: 1 });
  } else if (c.tower.lv < CFG.TOWER_MAX_LV){
    c.tower.lv++;
    sim.events.push({ type: 'tower', kind: c.tower.kind, x: c.x, y: c.y, lv: c.tower.lv });
  }
}
/* v1.32 城池升级：抽成单一入口 —— 增援抵达的「自动升级」与玩家主动的「士兵进城升级」
   共用同一套数值（消耗 LEVELS[level-1].up 兵 → 等级 +1 → 容量/产速/体积提升 → 有几率建塔）。
   校验失败一律不改状态（兵力不足 / 已满级 / 非己方城） */
function upgradeNeed(c){
  if (!c || c.level >= LEVELS.length) return 0;
  return LEVELS[c.level - 1].up || 0;
}
function canUpgrade(sim, c, owner){
  if (!c || sim.over) return false;
  if (owner != null && c.owner !== owner) return false;
  var need = upgradeNeed(c);
  return need > 0 && c.garrison >= need;
}
function upgradeCastle(sim, c){
  if (!canUpgrade(sim, c, c.owner)) return false;
  var spent = upgradeNeed(c);
  c.garrison -= spent;
  c.level++;
  sim.events.push({ type: 'upgrade', x: c.x, y: c.y, level: c.level, spent: spent, owner: c.owner, id: c.id });
  maybeBuildTower(sim, c);                  // v1.12：升级有几率建塔 / 给已有塔升一级
  return true;
}
/* v1.32 玩家主动军令：让城里的兵进城升级（消耗兵力，等级 +1） */
function doCastleUp(sim, cmd){
  var c = sim.castles[cmd.id];
  if (!c || c.owner !== cmd.owner || c.owner === 0) return false;
  return upgradeCastle(sim, c);
}

/* 牌库（v1.14）：洗牌 / 抽牌 —— 洗牌走独立随机源 drng，不消耗主线 rng（否则 AI 断言漂移） */
function shuffleInto(dst, src, rnd){
  var a = src.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  for (var k = 0; k < a.length; k++) dst.push(a[k]);
}
function drawOne(sim, owner){
  var p = sim.piles[owner]; if (!p) return null;
  if (!p.draw.length){
    if (!p.discard.length) return null;                 // 抽牌堆与弃牌堆皆空：本局无牌可抽
    shuffleInto(p.draw, p.discard, sim.drng);
    p.discard.length = 0;
    sim.events.push({ type: 'shuffle', owner: owner });
  }
  var key = p.draw.pop();
  p.hand.push(key);
  return key;
}

/* ---------- 建局 ---------- */
function createGame(opts){
  opts = opts || {};
  var seed = opts.seed != null ? opts.seed : (Date.now() % 2147483647);
  /* v1.25 自定义对局参数：不传 custom（或字段缺省）时与 v1.24 逐字节等价，既有断言零漂移 */
  var cu = opts.custom || null;
  var inkStart = (cu && cu.inkStart != null) ? cu.inkStart : CFG.INK_START;
  var sim = {
    t: 0, over: 0,
    castles: [], armies: [], camps: [],
    ink: [0, inkStart, inkStart, inkStart, inkStart],
    hands: { 1: [], 2: [] },           // 双玩家手牌（PVE 中 2 号为 AI，不使用）
    cmdQueue: [], events: [],
    /* v1.18：prodT = 屯田（全城产速 ×2）；v1.24：slowT = 断粮（行军减速）
       cardCd = 同名卡冷却表（key → 到期时刻 sim.t） */
    effects: { rushT: [0, 0, 0, 0, 0], starT: [0, 0, 0, 0, 0], starMul: [1, 1, 1, 1, 1], prodT: [0, 0, 0, 0, 0], slowT: [0, 0, 0, 0, 0] },
    cardCd: { 1: {}, 2: {}, 3: {}, 4: {} },
    stats: { capturedBy: { 1: 0, 2: 0, 3: 0, 4: 0 }, cardsUsed: 0, loss: { 1: 0, 2: 0, 3: 0, 4: 0 } },
    aiAcc: { 1: 0, 2: 0, 3: 0, 4: 0 }, aiCardCd: { 1: 0, 2: 0, 3: 0, 4: 0 },
    aiIdle: { 1: 0, 2: 0, 3: 0, 4: 0 },
    aiDiff: null,                  // 测试钩子：按阵营覆写难度
    drng: mulberry32((seed ^ 0x9e3779b9) >>> 0),   // 洗牌专用随机源（v1.14）：与 rng / trng 三者隔离
    drawAcc: { 1: 0, 2: 0, 3: 0, 4: 0 },           // 抽牌计时器（v1.14）
    piles: { 1: null, 2: null },                   // 牌库四堆（v1.14）：AI 直接 applyCard，无需牌堆
    opts: opts, rngSeed: seed, rng: mulberry32(seed),
    trng: mulberry32((seed ^ 0x5f3759df) >>> 0),   // 塔专用随机源（v1.12）：与主线 rng 隔离，不影响既有随机序列
    _aid: 1, _pid: 1,
  };
  /* 日卡被动：当日持有的日卡折算成本局全局修正 */
  sim.mods = { prod: 1, inkRegen: 1, cap: 1, speed: 1, inkMaxDelta: 0 };
  (opts.dailies || []).forEach(function(key){
    var d = DAILY_BY_KEY[key];
    if (d) for (var k in d.mod) sim.mods[k] = (k === 'inkMaxDelta') ? d.mod[k] : sim.mods[k] * d.mod[k];
  });
  sim.inkMax = CFG.INK_MAX + sim.mods.inkMaxDelta;
  if (cu){                                            // v1.25 自定义：直接乘进已有的 mods，不新增字段
    if (cu.capMul)  sim.mods.cap  *= cu.capMul;
    if (cu.prodMul) sim.mods.prod *= cu.prodMul;
  }

  mapGen(sim, opts);
  /* 牌库（v1.14）：卡组洗入抽牌堆 → 开局抽 START_HAND 张；AI/联机对手用默认卡组（公平） */
  function initPiles(owner, deck){
    var list = (deck && deck.length) ? deck.slice() : DEFAULT_DECK.slice();
    while (list.length < CFG.MIN_DECK) list.push(DEFAULT_DECK[list.length % DEFAULT_DECK.length]);
    var p = { list: list, draw: [], hand: [], discard: [], exhaust: [] };
    sim.piles[owner] = p;
    shuffleInto(p.draw, list, sim.drng);
    for (var i = 0; i < CFG.START_HAND; i++) drawOne(sim, owner);
    return p;
  }
  /* v1.16：每个参战阵营各建一副牌堆（AI 2/3/4 同样走牌库，与玩家同规则） */
  function sidesOf(){
    var s = [];
    for (var o = 1; o <= 4; o++) if (sim.castles.some(function(c){ return c.owner === o; })) s.push(o);
    return s.length ? s : [1, 2];
  }
  sidesOf().forEach(function(o){
    initPiles(o, opts.decks && opts.decks[o]);
    sim.hands[o] = sim.piles[o].hand;         // 兼容别名：与 piles[o].hand 同一数组引用
  });
  sim.hand = sim.hands[1];
  return sim;
}

/* ---------- 命令接口（玩家与 AI 共用；步首统一执行） ---------- */
function command(sim, cmd){ if (!sim.over) sim.cmdQueue.push(cmd); }

/* 部队碰撞/体型半径：随兵力缩放（用于遭遇判定、命中测试、选中环） */
function armyR(a){ return 9 + Math.min(8, Math.sqrt(a.count) * 1.3); }
/* 阵列规模半径：随驻扎兵力缩放（迎敌判定、命中测试） */
function campR(p){ return 16 + Math.min(22, Math.sqrt(p.count) * 2.2); }
/* 城池半径（v1.23 上移到逻辑块）：等级一/二/三级 = 24/34/44；渲染层经 `Sim.castleR` 复用同一公式 */
function castleR(c){ return 24 + (c.level - 1) * 10; }
/* v1.25 伤亡记账：纯累加，不消耗任何随机源、不参与任何判定 —— 唯一用途是喂给战报与生涯统计。
   双方互耗的场合（在途遭遇 / 阵列迎敌 / 过城开战）两边各记一份，语义天然对称。 */
function loss(sim, owner, n){
  if (!(n > 0) || owner == null || owner === 0) return;
  sim.stats.loss[owner] = (sim.stats.loss[owner] || 0) + n;
}
/* v1.25 自定义限时到点结算：占城数多者胜 → 平则比总兵力（驻军 + 在途 + 阵列）→ 完全相同判玩家负 */
function timeWinner(sim){
  var n = [0, 0, 0], p = [0, 0, 0], i, s;
  for (i = 0; i < sim.castles.length; i++){
    var c = sim.castles[i];
    if (c.owner >= 1){ s = c.owner >= 2 ? 2 : 1; n[s]++; p[s] += c.garrison; }
  }
  for (i = 0; i < sim.armies.length; i++){
    var a = sim.armies[i];
    if (a.owner >= 1) p[a.owner >= 2 ? 2 : 1] += a.count;
  }
  for (i = 0; i < sim.camps.length; i++){
    var cp = sim.camps[i];
    if (cp.owner >= 1) p[cp.owner >= 2 ? 2 : 1] += cp.count;
  }
  if (n[1] !== n[2]) return n[1] > n[2] ? 1 : 2;
  if (p[1] !== p[2]) return p[1] > p[2] ? 1 : 2;
  return 2;
}
/* 阵列按稳定 id 查找（v1.10：id 为自增主键，不再随数组重排） */
function campById(sim, id){
  for (var i = 0; i < sim.camps.length; i++) if (sim.camps[i].id === id) return sim.camps[i];
  return null;
}
/* 行军速度合成：基础 × 日卡急行 × 疾行(×2) × 神速星级 × 断粮(×0.5) —— 增益严格按阵营归属（v1.10） */
function armySpeed(sim, a){
  var o = a.owner;
  return CFG.SPEED * sim.mods.speed
       * (sim.effects.rushT[o] > 0 ? 2 : 1)
       * (sim.effects.starT[o] > 0 ? sim.effects.starMul[o] : 1)
       * (sim.effects.slowT && sim.effects.slowT[o] > 0 ? CFG.SLOW_MUL : 1);   // v1.24 断粮
}

function srcRef(sim, ref){                       // ref: {k:'c'|'p'|'a', id}
  if (ref.k === 'c'){ var c = sim.castles[ref.id]; return c ? { count: c.garrison, x: c.x, y: c.y, srcId: c.id } : null; }
  if (ref.k === 'a'){ return null; }             // 在途部队不作为出兵源
  var p = campById(sim, ref.id); return p ? { count: p.count, x: p.x, y: p.y, srcId: -1 } : null;
}
function srcOwner(sim, ref){
  if (ref.k === 'c'){ var c = sim.castles[ref.id]; return c ? c.owner : -1; }
  var p = campById(sim, ref.id); return p ? p.owner : -1;
}
/* opt: { solo, ph } —— solo=单兵出队（保留被点中那个兵的起点与运动相位） */
function launchArmy(sim, owner, sx, sy, target, count, srcId, opt){
  var a = {
    id: sim._aid++, owner: owner, count: count,
    x: sx, y: sy,
    tx: target.x, ty: target.y, tKind: target.k, tid: target.id != null ? target.id : -1,
    srcId: srcId, hx: sx, hy: sy, atkT: 0,
  };
  if (opt){
    if (opt.solo) a.solo = true;          // 单兵信使：从被点中的那个兵的位置出发
    if (opt.ph != null) a.ph0 = opt.ph;   // 沿用该兵的个体相位（步频/摆动一致 = 同一个兵）
  }
  sim.armies.push(a);
}
/* 军令改向：在途部队变更目标（可指向城池或空地） */
function doRetarget(sim, cmd){
  if (sim.over) return;
  for (var i = 0; i < cmd.ids.length; i++){
    var a = null;
    for (var j = 0; j < sim.armies.length; j++){
      if (sim.armies[j].id === cmd.ids[i]){ a = sim.armies[j]; break; }
    }
    if (!a || a.owner !== cmd.owner) continue;
    if (cmd.to.k === 'c'){
      var c = sim.castles[cmd.to.id]; if (!c) continue;
      a.tx = c.x; a.ty = c.y; a.tKind = 'c'; a.tid = c.id;
    } else {
      a.tx = cmd.to.x; a.ty = cmd.to.y; a.tKind = 'pt'; a.tid = -1;
    }
    a.atkT = 0;
  }
}
function doSend(sim, cmd){
  if (sim.over) return;
  if (sim.armies.length >= CFG.ARMY_CAP){ sim.events.push({ type: 'hint', txt: '墨潮汹涌 · 部队已达上限' }); return; }
  var target = cmd.to.k === 'c' ? (function(){ var c = sim.castles[cmd.to.id]; return c ? { k: 'c', id: c.id, x: c.x, y: c.y } : null; })() : { k: 'pt', id: -1, x: cmd.to.x, y: cmd.to.y };
  if (!target) return;
  var launched = 0;
  for (var i = 0; i < cmd.from.length; i++){
    var ref = cmd.from[i];
    if (srcOwner(sim, ref) !== cmd.owner) continue;
    var s = srcRef(sim, ref); if (!s) continue;
    var n = cmd.n != null ? Math.min(cmd.n, Math.floor(s.count)) : Math.floor(s.count * cmd.ratio);
    if (n < 1) continue;
    if (ref.k === 'c') sim.castles[ref.id].garrison -= n;
    else { var cp = campById(sim, ref.id); if (!cp) continue; cp.count -= n; }
    /* 单兵出队：从被点中的那个兵所在位置出发（而非城池/阵列中心），保持同一个兵的观感 */
    var solo = n === 1 && !!ref.pt;
    var sx = solo ? ref.pt.x : s.x, sy = solo ? ref.pt.y : s.y;
    launchArmy(sim, cmd.owner, sx, sy, target, n, s.srcId, solo ? { solo: true, ph: ref.ph } : null);
    launched++;
  }
  if (launched) sim.events.push({ type: 'send' });
}

/* v1.36 占领结算：**抵达**与「**过城把守军打光**」共用同一套（此前只有抵达能占下城池，
   过城只互耗 —— 守军被清空后城仍挂敌旗，玩家眼里就是「打光了却不占」）。
   改归属 / 进墨 / 记战报 / 剩余兵力转驻军（超容量的部分与抵达一样被弃掉）。
   viaPass=true 表示这是行军路过顺手接管（事件带 pass 标记，渲染层可区分）。 */
function occupyCastle(sim, c, a, viaPass){
  var oldG = c.garrison;                            // v1.25 记账前先留一份
  var from = c.owner;
  c.owner = a.owner;
  c.garrison = Math.min(Math.round(LEVELS[c.level - 1].cap * sim.mods.cap), a.count - oldG);
  loss(sim, from, oldG); loss(sim, a.owner, a.count - c.garrison);   // v1.25
  c.flashT = 0.6;
  /* v1.36 A/B 实测（n=160×2 种子族，困难 vs 容易）：过路接管让困难 AI 胜率
     58.1%→75.0% / 71.7%→81.8%（**+10~17pp**，平均时长 -5~10s，僵局数不变）——强方更爱派兵
     穿行，顺手捡城的收益被放大。试过「过路接管不给占城墨」想把差值压回去，实测**无差异**
     （75.0% / 81.8% 一字未变），所以这里保持与抵达完全同口径（占领即进墨）。
     若后续嫌困难太强，该调的是 DIFF.hard 的参数，不是接管规则。 */
  sim.ink[a.owner] = Math.min(sim.inkMax, sim.ink[a.owner] + (from === 0 ? CFG.CAPTURE_INK.neutral : CFG.CAPTURE_INK.enemy));
  sim.stats.capturedBy[a.owner] = (sim.stats.capturedBy[a.owner] || 0) + 1;   // 按阵营统计（PVP 客机同样计分）
  sim.events.push({ type: 'capture', x: c.x, y: c.y, owner: a.owner, pass: !!viaPass });
  a.count = Math.max(0, a.count - oldG);            // 抵达时部队随后移除；过城时带着剩下的兵继续行军
}
/* v1.36 路过提示：同一支部队对同一座城**只提示一次**（否则守军未清时每帧一条飘字，等于刷屏） */
function passHint(sim, a, c, txt){
  if (!a.passHint) a.passHint = {};
  if (a.passHint[c.id]) return;
  a.passHint[c.id] = 1;
  sim.events.push({ type: 'hint', txt: txt });
}
/* ---------- 抵达结算 ---------- */
function findCamp(sim, owner, x, y, r){
  for (var i = 0; i < sim.camps.length; i++){
    var p = sim.camps[i];
    if (p.owner === owner && dist(p.x, p.y, x, y) < r) return p;
  }
  return null;
}
function resolveArrival(sim, a){
  if (a.tKind === 'pt'){
    var cp = findCamp(sim, a.owner, a.tx, a.ty, 60);
    if (cp) cp.count += a.count;
    else sim.camps.push({ id: sim._pid++, owner: a.owner, x: a.tx, y: a.ty, count: a.count, atkT: 0 });
    return;
  }
  var c = sim.castles[a.tid]; if (!c) return;
  if (c.owner === a.owner){
    var L = LEVELS[c.level - 1];
    c.garrison = Math.min(Math.round(L.cap * sim.mods.cap), c.garrison + a.count);
    /* v1.32：自动升级走 upgradeCastle 单一入口（与玩家主动升级同数值） */
    upgradeCastle(sim, c);
  } else {
    if (c.shieldT > 0){ sim.events.push({ type: 'block', x: c.x, y: c.y }); return; }
    /* v1.24 伏兵：来犯部队先在城下被吃掉一截（伏兵一次性，触发即消耗；吃光则不再结算抵达） */
    if (c.ambushT > 0 && c.ambushN > 0){
      var amb = Math.min(a.count, c.ambushN);
      if (amb > 0){
        a.count -= amb;
        c.ambushT = 0; c.ambushN = 0;
        loss(sim, a.owner, amb);                        // v1.25
        sim.events.push({ type: 'ambushHit', x: c.x, y: c.y, n: amb });
        if (a.count < 1) return;
      }
    }
    if (a.count > c.garrison){
      occupyCastle(sim, c, a);                      // v1.36：与「过城接管」同一入口
    } else {
      c.garrison -= a.count;
      loss(sim, c.owner, a.count); loss(sim, a.owner, a.count);   // v1.25
      c.hitT = 0.25;
      sim.events.push({ type: 'hit', x: c.x, y: c.y });
    }
  }
}

/* ---------- 卡牌 ---------- */
function validTarget(sim, key, owner, targetId){
  var card = CARD_BY_KEY[key]; if (!card) return false;
  var c = targetId != null ? sim.castles[targetId] : null;
  switch (card.target){
    case 'own':   return !!c && c.owner === owner;
    case 'enemy': return !!c && c.owner !== 0 && c.owner !== owner;
    case 'foe':   return !!c && c.owner !== owner;
    default:      return true;
  }
}
function applyCard(sim, key, owner, targetId){
  var i, c;
  var card = CARD_BY_KEY[key];
  /* v1.14：升级版（key+）与原版共用同一分支，数值走 cardVal */
  switch (card && card.base ? card.base : key){
    case 'fire':
      c = sim.castles[targetId];
      if (c){ var burnt = c.garrison - Math.floor(c.garrison * (1 - cardVal(key)));   // v1.25 记账
        c.garrison = Math.floor(c.garrison * (1 - cardVal(key))); loss(sim, c.owner, burnt);
        sim.events.push({ type: 'burn', x: c.x, y: c.y }); }
      break;
    case 'shield':
      c = sim.castles[targetId]; if (c) c.shieldT = cardVal(key);
      break;
    case 'reinforce':
      c = sim.castles[targetId];
      if (c) c.garrison = Math.min(Math.round(LEVELS[c.level - 1].cap * sim.mods.cap), c.garrison + cardVal(key));
      break;
    case 'weak':
      c = sim.castles[targetId]; if (c) c.weakT = cardVal(key);
      break;
    case 'rush':
    case 'sprint':                                     // v1.18：疾驰 = 短版疾行（同一增益通道，取不缩短者）
      sim.effects.rushT[owner] = Math.max(sim.effects.rushT[owner], cardVal(key));
      break;
    case 'levy': {                                     // v1.18：征兵 = 便宜版墨涌
      var lvN = cardVal(key);
      for (i = 0; i < sim.castles.length; i++){
        c = sim.castles[i];
        if (c.owner === owner) c.garrison = Math.min(Math.round(LEVELS[c.level - 1].cap * sim.mods.cap), c.garrison + lvN);
      }
      break;
    }
    case 'arrows': {                                   // v1.18：箭雨——所有敌军在途部队按比例折损
      var cutA = cardVal(key), killed = 0;
      for (i = 0; i < sim.armies.length; i++){
        var aa = sim.armies[i];
        if (aa.owner === owner || aa.count < 1) continue;
        var dead = Math.floor(aa.count * cutA);
        if (dead > 0){ aa.count -= dead; killed += dead; aa.atkT = 0.35; loss(sim, aa.owner, dead); }   // v1.25
      }
      sim.armies = sim.armies.filter(function(x){ return x.count >= 1; });
      if (killed > 0) sim.events.push({ type: 'arrows', n: killed });
      break;
    }
    case 'granary':                                    // v1.18：屯田——全城产速 ×2（阵营级增益）
      sim.effects.prodT[owner] = cardVal(key);
      break;
    case 'rally': {                                    // v1.18：勤王——目标己城 + 420 内己城同时增兵（消耗）
      var rc = sim.castles[targetId];
      if (rc){
        var rN = cardVal(key);
        for (i = 0; i < sim.castles.length; i++){
          c = sim.castles[i];
          if (c.owner !== owner) continue;
          if (c !== rc && dist(c.x, c.y, rc.x, rc.y) > 420) continue;
          c.garrison = Math.min(Math.round(LEVELS[c.level - 1].cap * sim.mods.cap), c.garrison + rN);
        }
      }
      break;
    }
    case 'dagger': {
      var own = sim.castles.filter(function(x){ return x.owner === owner; });
      var ref = own.length ? { x: own[0].x, y: own[0].y } : { x: CFG.MAP_W / 2, y: CFG.MAP_H / 2 };
      var want = Math.max(1, Math.round(cardVal(key)));          // v1.14：升级版倒戈 2 座
      var neus = [];
      for (i = 0; i < sim.castles.length; i++) if (sim.castles[i].owner === 0) neus.push(sim.castles[i]);
      neus.sort(function(a, b){ return dist(a.x, a.y, ref.x, ref.y) - dist(b.x, b.y, ref.x, ref.y); });
      for (i = 0; i < Math.min(want, neus.length); i++){
        var best = neus[i];
        best.owner = owner; best.flashT = 0.6;
        sim.events.push({ type: 'capture', x: best.x, y: best.y, owner: owner });
      }
      break;
    }
    case 'divert': {
      var cut = cardVal(key);                                    // v1.14：升级版召回并削两成
      for (i = 0; i < sim.armies.length; i++){
        var a = sim.armies[i];
        if (a.owner === owner) continue;
        var ret = null;
        if (a.srcId >= 0 && sim.castles[a.srcId]) ret = sim.castles[a.srcId];
        else {
          var mine = sim.castles.filter(function(x){ return x.owner === a.owner; });
          var bm = null, bmd = Infinity;
          for (var j = 0; j < mine.length; j++){
            var dd = dist(mine[j].x, mine[j].y, a.x, a.y);
            if (dd < bmd){ bmd = dd; bm = mine[j]; }
          }
          ret = bm;
        }
        if (ret){ a.tx = ret.x; a.ty = ret.y; a.tKind = 'c'; a.tid = ret.id; }
        if (cut > 0) a.count -= Math.floor(a.count * cut);
      }
      sim.armies = sim.armies.filter(function(a){ return a.count >= 1; });
      break;
    }
    case 'surge': {
      var sn = cardVal(key);
      for (i = 0; i < sim.castles.length; i++){
        c = sim.castles[i];
        if (c.owner === owner) c.garrison = Math.min(Math.round(LEVELS[c.level - 1].cap * sim.mods.cap), c.garrison + sn);
      }
      break;
    }
    case 'defect':
      c = sim.castles[targetId];
      if (c){
        var defectN = Math.floor(c.garrison * cardVal(key));
        if (defectN >= 1){
          c.garrison -= defectN;
          launchArmy(sim, owner, c.x, c.y, { k: 'c', id: c.id, x: c.x, y: c.y }, defectN, c.id);
          sim.events.push({ type: 'defect', x: c.x, y: c.y, n: defectN });
        }
      }
      break;
    case 'holdfast':
      c = sim.castles[targetId]; if (c) c.buffT = cardVal(key);
      break;
    case 'star1': case 'star2': case 'star3': {
      var mul = 1 + cardVal(key);                 // v1.14：升级版倍数更高（+45%/+85%/+140%）
      sim.effects.starT[owner] = 8;
      sim.effects.starMul[owner] = sim.effects.starMul[owner] > mul ? sim.effects.starMul[owner] : mul;
      break;
    }
    /* ---- v1.24 新增七卡 ---- */
    case 'ambush':                                     // 伏击：己城埋伏，来犯部队抵达前先损 N 兵（一次性）
      c = sim.castles[targetId];
      if (c){ c.ambushT = CFG.AMBUSH_T; c.ambushN = cardVal(key); sim.events.push({ type: 'ambush', x: c.x, y: c.y }); }
      break;
    case 'plague':                                     // 瘟疫：敌城停产且持续减员（减员在 step 的产兵段结算）
      c = sim.castles[targetId]; if (c) c.plagueT = cardVal(key);
      break;
    case 'repeater':                                   // 连弩：己城架临时箭塔，到期自动拆除
      c = sim.castles[targetId];
      if (c && !c.tower){
        c.tower = { kind: CFG.TEMP_TOWER_KIND, lv: CFG.TEMP_TOWER_LV, cd: 0, temp: true, tempT: cardVal(key) };
        sim.events.push({ type: 'tower', kind: CFG.TEMP_TOWER_KIND, x: c.x, y: c.y, lv: CFG.TEMP_TOWER_LV });
      }
      break;
    case 'breach':                                     // 摧塔：敌城塔降 v 级，降到 0 级即摧毁
      c = sim.castles[targetId];
      if (c && c.tower){
        c.tower.lv -= Math.max(1, Math.round(cardVal(key)));
        if (c.tower.lv < 1) c.tower = null;
        sim.events.push({ type: 'breach', x: c.x, y: c.y });
      }
      break;
    case 'forge':                                      // 墨锭：直接回墨（成本在 cardPlay 里随后扣除）
      sim.ink[owner] = Math.min(sim.inkMax, sim.ink[owner] + cardVal(key));
      break;
    case 'supply': {                                   // 粮道：己方**在途**部队各 +N 兵（与增援「守城」互补）
      var spN = cardVal(key), spK = 0;
      for (i = 0; i < sim.armies.length; i++){
        if (sim.armies[i].owner !== owner) continue;
        sim.armies[i].count += spN; spK++;
      }
      if (spK) sim.events.push({ type: 'supply', n: spN });
      break;
    }
    case 'sabotage':                                   // 断粮：除自己外所有阵营行军减速（取不缩短者）
      for (i = 1; i <= 4; i++){
        if (i === owner) continue;
        sim.effects.slowT[i] = Math.max(sim.effects.slowT[i], cardVal(key));
      }
      break;
  }
}
/* 单兵拆分：从在途部队拆出 n 兵（默认 1）改道执行，原队继续原任务 */
function doSplit(sim, cmd){
  if (sim.over) return;
  var a = null;
  for (var j = 0; j < sim.armies.length; j++){
    if (sim.armies[j].id === cmd.armyId){ a = sim.armies[j]; break; }
  }
  if (!a || a.owner !== cmd.owner) return;
  var n = Math.min(cmd.n || 1, a.count - (a.count > 1 ? 1 : 0));
  if (n < 1) return;
  var target = cmd.to.k === 'c' ? (function(){ var c = sim.castles[cmd.to.id]; return c ? { k: 'c', id: c.id, x: c.x, y: c.y } : null; })() : { k: 'pt', id: -1, x: cmd.to.x, y: cmd.to.y };
  if (!target) return;
  a.count -= n;
  if (a.count < 1){                                  // 全队拆走 = 改向
    a.tx = target.x; a.ty = target.y; a.tKind = target.k; a.tid = target.id != null ? target.id : -1;
    a.count = n;
    return;
  }
  /* 单兵拆队：从被点中的那个兵所在位置离队（保留其相位），原队继续原任务 */
  var solo = n === 1 && !!cmd.pt;
  launchArmy(sim, a.owner, solo ? cmd.pt.x : a.x, solo ? cmd.pt.y : a.y, target, n,
             a.srcId >= 0 ? a.srcId : -1, solo ? { solo: true, ph: cmd.ph } : null);
}

/* 全军出击：敌方仅剩一座城时的总攻——全军满额出兵 + 在途部队齐转 + 行军加速 */
function doAllout(sim, owner, targetId){
  var t = sim.castles[targetId]; if (!t || sim.over) return;
  sim.effects.rushT[owner] = Math.max(sim.effects.rushT[owner], 8);
  var from = sim.castles.filter(function(c){ return c.owner === owner && c.garrison >= 1; })
                        .map(function(c){ return { k: 'c', id: c.id }; });
  if (from.length) doSend(sim, { owner: owner, from: from, to: { k: 'c', id: targetId }, ratio: 1 });
  var camps = sim.camps.filter(function(p){ return p.owner === owner; })
                       .map(function(p){ return { k: 'p', id: p.id }; });
  if (camps.length) doSend(sim, { owner: owner, from: camps, to: { k: 'c', id: targetId }, ratio: 1 });
  var ids = sim.armies.filter(function(a){ return a.owner === owner; }).map(function(a){ return a.id; });
  if (ids.length) doRetarget(sim, { owner: owner, ids: ids, to: { k: 'c', id: targetId } });
  sim.events.push({ type: 'allout', x: t.x, y: t.y });
}
function canPlay(sim, slot, owner){
  owner = owner || 1;
  var key = sim.hands[owner][slot]; if (!key) return { ok: false, reason: '无此卡' };
  var card = CARD_BY_KEY[key], i;
  if (sim.ink[owner] < card.cost) return { ok: false, reason: '墨量不足' };
  /* v1.18：同名卡冷却（升级版共用基础牌的冷却） */
  var ckCd = card.base || key;
  var cdT = sim.cardCd && sim.cardCd[owner] ? sim.cardCd[owner][ckCd] : 0;
  if (cdT != null && cdT > sim.t) return { ok: false, reason: '「' + card.name + '」冷却 ' + Math.ceil(cdT - sim.t) + ' 秒' };
  var hasOwn = false, hasFoe = false, hasEnemy = false, hasNeutral = false, hasEnemyArmy = false, hasOwnArmy = false;
  for (i = 0; i < sim.castles.length; i++){
    var c = sim.castles[i];
    if (c.owner === owner) hasOwn = true;
    else if (c.owner === 0) hasNeutral = true;
    else { hasEnemy = true; hasFoe = true; }
  }
  if (!hasFoe) { hasNeutral = sim.castles.some(function(x){ return x.owner === 0; }); hasFoe = hasEnemy || hasNeutral; }
  for (i = 0; i < sim.armies.length; i++){
    if (sim.armies[i].owner !== owner) hasEnemyArmy = true; else hasOwnArmy = true;
  }
  var ck = card && card.base ? card.base : key;      // v1.14：升级版沿用原版的目标前置条件
  switch (ck){
    case 'fire':      if (!hasFoe) return { ok: false, reason: '无可打击目标' }; break;
    case 'weak':
    case 'defect':    if (!hasEnemy) return { ok: false, reason: '无敌方城池' }; break;
    case 'shield':
    case 'reinforce':
    case 'holdfast':
    case 'surge':
    case 'levy':
    case 'granary':
    case 'rally':    if (!hasOwn) return { ok: false, reason: '无己方城池' }; break;
    case 'dagger':    if (!hasNeutral) return { ok: false, reason: '无中立城池' }; break;
    case 'divert':
    case 'arrows':    if (!hasEnemyArmy) return { ok: false, reason: '无敌军在途' }; break;
    /* v1.24 新增七卡的前置条件 */
    case 'ambush':
    case 'repeater':  if (!hasOwn) return { ok: false, reason: '无己方城池' }; break;
    case 'plague':
    case 'breach':    if (!hasEnemy) return { ok: false, reason: '无敌方城池' }; break;
    case 'supply':    if (!hasOwnArmy) return { ok: false, reason: '无己方在途部队' }; break;

      if (bk === 'weak' && c.garrison < 35) continue;         // 虚弱只拖强敌，软柿子不值得花墨
      if (bk === 'plague' && c.garrison < 30) continue;       // 瘟疫同理，只拖厚城（v1.24）

                            .sort(function(x, y){ return foeScore(x) - foeScore(y); });

    }

    for (var j = i + 1; j < sim.armies.length; j++){
      var aj = sim.armies[j];
      if (aj.count < 1 || aj.owner === ai.owner) continue;
      if (dist(ai.x, ai.y, aj.x, aj.y) <= armyR(ai) + armyR(aj)){
        var kill = Math.min(ai.count, aj.count);
        ai.count -= kill; aj.count -= kill;
        loss(sim, ai.owner, kill); loss(sim, aj.owner, kill);      // v1.25
        ai.atkT = 0.35; aj.atkT = 0.35;
        sim.events.push({ type: 'clash', x: (ai.x + aj.x) / 2, y: (ai.y + aj.y) / 2 });
        if (ai.count < 1) break;
      }
    }
  }
  sim.armies = sim.armies.filter(function(x){ return x.count >= 1; });
  /* 3.6 阵列迎敌：扎营后敌军经过即战斗（阵列以兵力扛线，可被消耗殆尽） */
  for (i = 0; i < sim.armies.length; i++){
    var ca = sim.armies[i];
    if (ca.count < 1) continue;
    for (var j2 = sim.camps.length - 1; j2 >= 0; j2--){
      var cp = sim.camps[j2];
      if (cp.owner === ca.owner) continue;
      if (dist(ca.x, ca.y, cp.x, cp.y) <= armyR(ca) + campR(cp)){
        var kill2 = Math.min(ca.count, cp.count);
        ca.count -= kill2; cp.count -= kill2;
        loss(sim, ca.owner, kill2); loss(sim, cp.owner, kill2);    // v1.25
        ca.atkT = 0.35; if (cp.atkT == null) cp.atkT = 0; cp.atkT = 0.35;   // 阵列兵同样做出攻击动作
        sim.events.push({ type: 'clash', x: (ca.x + cp.x) / 2, y: (ca.y + cp.y) / 2 });
      }
    }
  }
  /* 3.65 过城开战（v1.23）：在途部队经过**敌方 / 中立**城池即开战——与「敌军经过阵列即战斗」对称。
     己方城不拦截（走位不被自己人卡住）；**当前目标城交给抵达结算**，避免同一次行军被结算两次。
     v1.23~v1.35：只按兵力互耗、**永不占领** —— 结果就是「守军被我打光了，城还挂敌旗」，玩家眼里
     这是明摆着的 bug。v1.36：**守军被清空（或本就是空城）即顺手接管**，走与抵达完全相同的
     occupyCastle；守军还在 → 只是擦过（R3 不变：想拿下仍要点名攻打这座城），并给一次明确提示。 */
  for (i = 0; i < sim.armies.length; i++){
    var pa = sim.armies[i];
    if (pa.count < 1) continue;
    for (var j3 = 0; j3 < sim.castles.length; j3++){
      var pc = sim.castles[j3];
      if (pc.owner === pa.owner) continue;                       // 己方城：不响应
      if (pa.tKind === 'c' && pa.tid === pc.id) continue;        // 目标城：走抵达结算
      if (dist(pa.x, pa.y, pc.x, pc.y) > castleR(pc) + armyR(pa)) continue;
      if (pc.shieldT > 0){ passHint(sim, pa, pc, '护盾未破 · 该城免疫过路部队'); continue; }
      var gd = Math.floor(pc.garrison);
      var kill3 = Math.min(pa.count, gd);
      if (kill3 > 0){
        pa.count -= kill3; pc.garrison -= kill3;
        loss(sim, pa.owner, kill3); loss(sim, pc.owner, kill3);      // v1.25
        pa.atkT = 0.35; pc.hitT = 0.35;
        sim.events.push({ type: 'clash', x: (pa.x + pc.x) / 2, y: (pa.y + pc.y) / 2 });
      }
      /* v1.36 结算：守军被清空（或本就是空城）→ 顺手接管，走与抵达相同的 occupyCastle；
         兵力不足被守军吃掉 → 城池不易主，给一次明确提示（旧行为是静默消失）。
         「守军还在且部队还有兵」在互耗口径下不可能出现（min 必清零一方），故不另设分支。 */
      if (Math.floor(pc.garrison) < 1) occupyCastle(sim, pc, pa, true);
      else passHint(sim, pa, pc, '兵力不足 · 过城部队被守军吃掉了');
      if (pa.count < 1) break;
    }
  }
/* v1.32 塔火统一扣血：在途部队与阵列字段一致（count/owner/atkT），走同一套记账 */
function towerHit(sim, u, dmg){
  var hit = Math.min(dmg, Math.max(0, u.count));      // v1.25：塔火可能打超，只记真正吃到的
  u.count -= dmg; loss(sim, u.owner, hit);
}
/* v1.32 炮塔溅射：波及落点周围同侧敌军（在途部队 + 阵列，此前只波及在途部队） */
function towerSplash(sim, c, tgt, x, y, radius, dmg){
  var i;
  for (i = 0; i < sim.armies.length; i++){
    var sa = sim.armies[i];
    if (sa === tgt || sa.count < 1 || sa.owner === c.owner) continue;
    if (dist(sa.x, sa.y, x, y) <= radius) towerHit(sim, sa, dmg);
  }
  for (i = 0; i < sim.camps.length; i++){
    var sp = sim.camps[i];
    if (sp === tgt || sp.count < 1 || sp.owner === c.owner) continue;
    if (dist(sp.x, sp.y, x, y) <= radius) towerHit(sim, sp, dmg);
  }
}
/* 3.7 防御塔开火（v1.12）：周期射击射程内最近的敌军；爪子抓兵转化为己方驻军
     v1.32 修复「部分炮塔不攻击」：索敌目标集原为**只打 sim.armies（在途部队）**，
     敌军一旦在射程内扎营（v1.6 起可屯兵、v1.22 起阵列永久驻守）塔就一枪不放 —— 围城屯兵
     成了塔的绝对盲区，观感就是「这座塔坏了」。现改为在途部队 + 阵列统一索敌，取最近者。 */
  for (i = 0; i < sim.castles.length; i++){
    c = sim.castles[i];
    if (!c.tower || c.tower.cd > 0) continue;
    var tRange = towerStat(c.tower, 'range');
    var tgt = null, tgtCamp = null, td = Infinity;
    for (var ti = 0; ti < sim.armies.length; ti++){
      var ta = sim.armies[ti];
      if (ta.count < 1 || ta.owner === c.owner) continue;
      var dd2 = dist(ta.x, ta.y, c.x, c.y);
      if (dd2 <= tRange && dd2 < td){ td = dd2; tgt = ta; tgtCamp = null; }
    }
    for (var pi = 0; pi < sim.camps.length; pi++){
      var tp = sim.camps[pi];
      if (tp.count < 1 || tp.owner === c.owner) continue;
      var dd3 = dist(tp.x, tp.y, c.x, c.y);
      if (dd3 <= tRange && dd3 < td){ td = dd3; tgt = null; tgtCamp = tp; }
    }
    if (!tgt && !tgtCamp) continue;
    var tbase = TOWER_BY_KIND[c.tower.kind];
    var tv = tgt || tgtCamp, tgx = tv.x, tgy = tv.y;
    if (tbase.grab){
      var grabN = Math.min(tv.count, Math.max(1, Math.floor(tv.count * tbase.grab)));
      tv.count -= grabN;
      loss(sim, tv.owner, grabN);                                 // v1.25
      if (c.owner !== 0){                       // 中立城不产兵：爪子只消耗，不转化
        c.garrison = Math.min(Math.round(LEVELS[c.level - 1].cap * sim.mods.cap), c.garrison + grabN);
        sim.events.push({ type: 'grab', x: tgx, y: tgy, n: grabN, owner: c.owner });
      }
    } else {
      var dmg = towerStat(c.tower, 'dmg');
      towerHit(sim, tv, dmg);
      if (tbase.splash) towerSplash(sim, c, tv, tgx, tgy, tbase.splash, dmg);   // 炮塔溅射：波及落点周围敌军（含阵列）
    }
    tv.atkT = 0.35;
    c.tower.cd = towerStat(c.tower, 'cd');
    sim.events.push({ type: 'tower', kind: c.tower.kind, x: c.x, y: c.y, tx: tgx, ty: tgy });
  }
  sim.armies = sim.armies.filter(function(x){ return x.count >= 1; });   // 塔火清场
  for (i = 0; i < sim.armies.length; i++){
    if (sim.armies[i].atkT > 0) sim.armies[i].atkT = Math.max(0, sim.armies[i].atkT - dt);
  }
  /* 4 阵列：v1.22 起**不再散逸**（屯兵永久驻守，兵力只可能被派遣调走或被经过的敌军消耗） */
  for (i = 0; i < sim.camps.length; i++){
    var p = sim.camps[i];
    if (p.atkT > 0) p.atkT = Math.max(0, p.atkT - dt);
  }
  /* 空阵列清场：兵派光 / 被敌军打光后「屯」图即消失（id 保持稳定，v1.10） */
  sim.camps = sim.camps.filter(function(x){ return x.count >= 1; });
  /* 5 计时器 */
  for (i = 0; i < sim.castles.length; i++){
    c = sim.castles[i];
    if (c.shieldT > 0) c.shieldT = Math.max(0, c.shieldT - dt);
    if (c.weakT > 0) c.weakT = Math.max(0, c.weakT - dt);
    if (c.flashT > 0) c.flashT = Math.max(0, c.flashT - dt);
    if (c.buffT > 0) c.buffT = Math.max(0, c.buffT - dt);
    if (c.hitT > 0) c.hitT = Math.max(0, c.hitT - dt);
    if (c.ambushT > 0) c.ambushT = Math.max(0, c.ambushT - dt);          // v1.24 伏兵
    if (c.plagueT > 0) c.plagueT = Math.max(0, c.plagueT - dt);          // v1.24 瘟疫
    if (c.tower && c.tower.cd > 0) c.tower.cd = Math.max(0, c.tower.cd - dt);   // 塔冷却
    /* v1.24 连弩临时塔：到期自动拆除（不留下永久塔，避免白嫖） */
    if (c.tower && c.tower.temp){
      c.tower.tempT -= dt;
      if (c.tower.tempT <= 0) c.tower = null;
    }
  }
  for (o = 1; o <= 4; o++){
    if (sim.effects.rushT[o] > 0) sim.effects.rushT[o] = Math.max(0, sim.effects.rushT[o] - dt);
    if (sim.effects.prodT && sim.effects.prodT[o] > 0) sim.effects.prodT[o] = Math.max(0, sim.effects.prodT[o] - dt);   // v1.18 屯田
    if (sim.effects.slowT && sim.effects.slowT[o] > 0) sim.effects.slowT[o] = Math.max(0, sim.effects.slowT[o] - dt);   // v1.24 断粮
    if (sim.effects.starT[o] > 0){
      sim.effects.starT[o] = Math.max(0, sim.effects.starT[o] - dt);
      if (sim.effects.starT[o] === 0) sim.effects.starMul[o] = 1;   // 到期复位，避免残留加成
    }
    if (sim.aiCardCd[o] > 0) sim.aiCardCd[o] -= dt;
  }

  /* 6 墨量回复 */
  for (o = 1; o <= 4; o++) sim.ink[o] = Math.min(sim.inkMax, sim.ink[o] + CFG.INK_REGEN * sim.mods.inkRegen * dt);

  /* 6.5 抽牌（v1.14）：每 DRAW_T 秒抽 1 张，手牌满则本次不抽（计时器封顶，最多积压 1 次） */
  for (o = 1; o <= 4; o++){                     // v1.16：AI 阵营同样定时抽牌
    var pk = sim.piles[o];
    if (!pk) continue;
    sim.drawAcc[o] += dt;
    if (pk.hand.length >= CFG.HAND_MAX){                 // 手牌满：最多积压一次抽牌，防瞬间补满
      if (sim.drawAcc[o] > CFG.DRAW_T) sim.drawAcc[o] = CFG.DRAW_T;
      continue;
    }
    if (sim.drawAcc[o] >= CFG.DRAW_T){
      sim.drawAcc[o] -= CFG.DRAW_T;
      if (!drawOne(sim, o)) sim.drawAcc[o] = 0;          // 两堆皆空：不再空转
    }
  }

  /* 7 AI 决策（noAI 为单测/教学钩子：只跑玩家，不出手） */
  if (!sim.opts.noAI){
    for (o = 1; o <= 4; o++){
      if (o === 1 && !sim.opts.ambient) continue;
      var forces = castlesOf(sim, o).length > 0 || sim.armies.some(function(a){ return a.owner === o; });
      if (!forces) continue;
      sim.aiAcc[o] += dt;
      var iv = DIFF[diffOf(sim, o)].interval;
      if (sim.aiAcc[o] >= iv){
        sim.aiAcc[o] = 0;
        aiTick(sim, o);
      }
    }
  }

  /* 8 胜负判定：先按「敌方清空 / 己方被清空」兜底，再结算关卡目标（v1.24） */
  var pl = false, en = false;
  for (i = 0; i < sim.castles.length; i++){
    c = sim.castles[i];
    if (c.owner === 1) pl = true;
    else if (c.owner >= 2) en = true;
  }
  if (!en) sim.over = 1;
  else if (!pl) sim.over = 2;
  /* v1.24 关卡目标（sim.over 已定则不再改写：清空永远是最高的胜利方式）
     hold    = 撑满 sec 秒即胜；capture = 占领 n 座即胜（超时判负）；conquer + sec = 超时判负 */
  var gl = sim.opts.goal;
  if (gl && !sim.over){
    if (gl.type === 'hold'){
      if (sim.t >= gl.sec) sim.over = 1;
    } else if (gl.type === 'capture'){
      if ((sim.stats.capturedBy[1] || 0) >= gl.n) sim.over = 1;
      else if (gl.sec && sim.t >= gl.sec) sim.over = 2;
    } else if (gl.type === 'conquer' && gl.sec){
      if (sim.t >= gl.sec) sim.over = 2;
    } else if (gl.type === 'time' && gl.sec){          /* v1.25 自定义限时：到时按「占城数 → 总兵力」比大小，多者胜；相等判玩家负（鼓励主动出击） */
      if (sim.t >= gl.sec) sim.over = timeWinner(sim);
    }
  }
}

/* ---------- 导出 ---------- */
var InkSim = { CFG: CFG, LEVELS: LEVELS, DIFF: DIFF, CARDS: CARDS, CAMPAIGN: CAMPAIGN,
               createGame: createGame, command: command, cardPlay: cardPlay, canPlay: canPlay,
               validTarget: validTarget, step: step, aiTick: aiTick, dist: dist, armyR: armyR, campR: campR, castleR: castleR,
               armySpeed: armySpeed, campById: campById, TOWERS: TOWERS, TOWER_BY_KIND: TOWER_BY_KIND,
               towerStat: towerStat, DAILIES: DAILIES,
               /* v1.32 城池升级：升级阈值 / 可否升级（供 UI 的「↑」入口与提示复用同一判据） */
               upgradeNeed: upgradeNeed, canUpgrade: canUpgrade, upgradeCastle: upgradeCastle,
               /* v1.14 牌库：默认卡组 / 稀有度 / 抽牌与洗牌 / 卡数值 */
               DEFAULT_DECK: DEFAULT_DECK, RARITY: RARITY, cardVal: cardVal,
               drawOne: drawOne, shuffleInto: shuffleInto,
               /* v1.16 AI 用牌与就近选目标 */
               aiPlayCard: aiPlayCard, aiCardTarget: aiCardTarget, nearestDist: nearestDist,
               AI_CARD_LV: AI_CARD_LV, AI_CARD_PRI: AI_CARD_PRI, DIFF: DIFF,
               AI_CARD_KEEP: AI_CARD_KEEP, AI_CARD_CD: AI_CARD_CD,
               /* v1.25 伤亡记账与限时结算（纯累加 / 纯读取，不改变任何判定） */
               loss: loss, timeWinner: timeWinner };
if (typeof window !== 'undefined') window.InkSim = InkSim;
if (typeof module !== 'undefined' && module.exports) module.exports = InkSim;
})();
</script>

<script>
/* ============================================================
 * 块2 · UI 层（IIFE）—— 渲染 / 输入 / 音效 / 流程 / 存档
 * ============================================================ */
(function(){
'use strict';
var Sim = window.InkSim;
var CFG = Sim.CFG, LEVELS = Sim.LEVELS, CARDS = Sim.CARDS, CARD_BY_KEY = {};
CARDS.forEach(function(c){ CARD_BY_KEY[c.key] = c; });
var dist = Sim.dist;   // 几何工具（逻辑块同源）
var castleR = Sim.castleR;   // v1.23：城池半径与逻辑块同源（过城开战判定与渲染必须同一把尺子）
var APP_VER = '1.39';        // v1.35：唯一版本号来源（菜单底栏展示 + __ink.ver 钩子），发布核对以此为准

/* ===== DOM ===== */
var canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
var elInkfill = document.getElementById('inkfill'), elInkwrap = document.getElementById('inkwrap'), elInkval = document.getElementById('inkval');
var elTime = document.getElementById('timeval'), elMy = document.getElementById('myval'), elFoe = document.getElementById('foeval');
var elFacs = document.getElementById('facs');
var elOverlay = document.getElementById('overlay'), elPanel = document.getElementById('panel');
var elCards = document.getElementById('cards'), elRatio = document.getElementById('ratio'), elHint = document.getElementById('hint');
var elFoeBar = document.getElementById('foebar');      // v1.20：敌方出牌提示条
var elDpad = document.getElementById('dpad'), elDpadMid = document.getElementById('dpadMid');   // v1.20：屏内方向键
var elPiles = document.getElementById('piles');          // v1.14 牌堆计数（抽 / 弃 / 消）
var elPause = document.getElementById('btnPause');

/* ==================================================================================
 * v1.19 卡面插画（纯字符串资产 · 零绘制开销 · 单文件内联，无外部图片）
 *
 * 书写约定（改动前务必读完）：
 *  1) 统一画布 viewBox = "0 0 100 60"（横幅 5:3），安全绘制区 x∈[8,92] y∈[6,54]；
 *     每幅 ≤12 个图元、≤900 字符，只画「一眼能认出」的大形——手牌上它是 20% 水印，细节会糊。

 *  6) 升级版（key+'+'）不单独配图，复用基础卡同一幅 + CSS 盖朱砂「＋」印记。
 *  7) v1.33 起卡牌相关的新元素统一用 inkart / inkcost / inkpop / inkghost 前缀
 *     （费用角标 / 详情浮层 / 拖拽替身），同样不得以 card 开头；替身挂 document.body，
 *     绝不进 elCards.innerHTML。
 * ================================================================================== */
var M = {
  /* 带箭垛的一段城墙（左下角 x，落地 y，宽 w） */
  wall: function(x, y, w, col, op){
    return '<path d="M' + x + ' ' + y + 'V' + (y - 16) + 'h3v-3.5h3.5v3.5h3v-3.5h3.5v3.5h' + (w - 13) + 'V' + y + '"' +
           ' stroke="' + (col || '#2b2a26') + '" stroke-width="2.2" opacity="' + (op || '.9') + '"/>';
  },
  /* 一名墨兵：圆头 + 一笔身 + 撇脚（y = 落地线） */
  troop: function(x, y, col, op){
    var c = col || '#2b2a26', o = op || '1';
    return '<path d="M' + x + ' ' + (y - 13) + 'v9M' + x + ' ' + (y - 4) + 'l-3 4M' + x + ' ' + (y - 4) + 'l3 4"' +

  /* 朱砂军旗（flip = 旗面向左＝已倒戈） */

           '<path d="M' + x + ' ' + (y - 11) + (flip ? 'h-11v7h11z' : 'h11v7h-11z') +

  },
  /* 飞白：n 道断续横扫，做出干笔的枯感 */
  fly: function(x, y, n, op){

    for (var i = 0; i < (n || 2); i++)
      s += '<path d="M' + x + ' ' + (y - i * 7) + 'c7-2 11 1 17-1" stroke="#2b2a26" stroke-width="1.4" opacity="' + (op || '.28') + '"/>';

  },
  /* 墨点 / 火星 */
  spark: function(x, y, r, col, op){
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (col || '#b33327') + '" opacity="' + (op || '.5') + '"/>';
  },
  /* 四芒墨星 */
  star: function(x, y, r, op){

function cardArt(k){                                   // 手牌 / 结算三选一：内联 SVG
  var b = artKeyOf(k);
  if (ART_SVG[b] == null) ART_SVG[b] = ART_HEAD + (ART[b] || '') + '</svg>';
  return ART_SVG[b];
}
function cardArtURI(k){                                // 图鉴 chip：CSS 背景 data-URI
  var b = artKeyOf(k);
  if (ART_URI[b] == null) ART_URI[b] = 'url("data:image/svg+xml,' + encodeURIComponent(cardArt(b)) + '")';
  return ART_URI[b];
}
(function(){ for (var k in ART) cardArt(k); })();      // 30 幅一次性构建，之后只做字符串查找
/* 图鉴有 41 枚 chip，若逐个内联 SVG 会让 innerHTML 暴涨 ~28KB 且打断既有文本断言；
   改为按 data-art 一次性注入 [data-art]::before 背景规则，innerHTML 只多一个属性。 */
function injectArtStyle(){
  var css = Object.keys(ART).map(function(k){
    return '.dex[data-art="' + k + '"]::before{background-image:' + cardArtURI(k) + '}';
  }).join('\n');
  var s = document.createElement('style');
  s.textContent = css;
  /* 无头冒烟的 document 打桩没有 head，必须逐级回退，否则 UI 块加载即抛 */
  var host = document.head || document.body || document.documentElement;
  if (host && host.appendChild) host.appendChild(s);
}
injectArtStyle();

/* ===== 移动端自适应（v1.17/v1.18） =====
 * --stage-reserve 由 JS 实测「顶栏 + 卡牌栏 + 间距 + 安全区」写入，替代硬编码断点值：
 * 换机型 / 换系统字号 / 卡牌两行换行都不会算错；媒体查询里的值只作为 JS 未就绪时的兜底。
 * --vvh = 视觉视口高度：软键盘弹出时 visualViewport 缩小，舞台与面板按可见高度重排（R8）。 */
var elTop = document.querySelector('.topbar'), elCardbar = document.querySelector('.cardbar');
var rootStyle = document.documentElement && document.documentElement.style;
var lastReserve = -1, lastVvh = 0;
function setVar(k, v){
  if (!rootStyle) return;
  if (rootStyle.setProperty) rootStyle.setProperty(k, v);
  else rootStyle[k] = v;                             // 极简 DOM 环境（无头冒烟）兜底
}
function num(v){ return parseFloat(v) || 0; }
/* v1.21：手机横屏时卡栏是右侧竖排侧栏（fixed，不占纵向高度），预留只算顶栏 ——
   判据用 matchMedia 且与 CSS 断点写完全一样的条件，保证两边永远一致。
   惰性初始化：无头打桩环境加载时可能还没有 matchMedia，测到一半才补桩也要能生效 */
var mqLand = null;
function landscapeSide(){
  if (typeof window.matchMedia !== 'function') return false;
  if (!mqLand) mqLand = window.matchMedia('(max-width:950px) and (orientation:landscape)');
  return !!(mqLand && mqLand.matches);
}
var mqNarrow = null;
/* v1.37：窄屏竖屏（手机竖握）—— 与 CSS 断点 `@media (max-width:700px) and (orientation:portrait)` 同条件 */
function narrowPortrait(){
  if (typeof window.matchMedia !== 'function') return false;
  if (!mqNarrow) mqNarrow = window.matchMedia('(max-width:700px) and (orientation:portrait)');
  return !!(mqNarrow && mqNarrow.matches);
}
/* v1.37：手机（竖屏窄屏 或 横屏侧栏）都把「好友对战」提到「快速对战」之后 ——
   横屏手机视口只有 360~390px 高，菜单同样要滚两三屏才够得着联机入口。平板 / 桌面维持原顺序。 */
function menuPvpFirst(){ return narrowPortrait() || landscapeSide(); }
function measureStageReserve(){
  var cs = (typeof getComputedStyle === 'function' && document.body) ? getComputedStyle(document.body) : null;
  var h = cs ? num(cs.paddingTop) + num(cs.paddingBottom) + num(cs.rowGap || cs.gap) * 2 : 0;
  if (elTop) h += elTop.offsetHeight || 0;
  if (!landscapeSide() && elCardbar) h += elCardbar.offsetHeight || 0;   // 横屏侧栏不计入纵向预留
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
  return Math.round(Math.max(72, Math.min(h, vh * 0.72)));   // 钳制：预留不小于 72px、不超过视口 72%
}
function applyVvh(){
  var vv = window.visualViewport;

  var h = Math.round(vv.height);
  if (h > 0 && h !== lastVvh){ lastVvh = h; setVar('--vvh', h + 'px'); }
}
function relayout(force){
  applyVvh();
  var v = measureStageReserve();
  if (force || v !== lastReserve){ lastReserve = v; setVar('--stage-reserve', v + 'px'); }

}
function onViewportChange(){ relayout(true); pvpRestack(); }
/* v1.37 横竖屏切换：菜单里「好友对战」的位置取决于是否手机布局，转屏后必须重排一次，
   否则竖着进来在末屏、横过来还在末屏（反之亦然）。只在判定结果真的翻转时才重绘，避免 resize 抖动重排。 */
var lastPvpFirst = null;
function pvpRestack(){
  var f = menuPvpFirst();
  if (lastPvpFirst === null){ lastPvpFirst = f; return; }
  if (f === lastPvpFirst) return;
  lastPvpFirst = f;
  if (typeof mode !== 'undefined' && mode === 'menu' && typeof showMenu === 'function') showMenu();
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
if (window.visualViewport && window.visualViewport.addEventListener)
  window.visualViewport.addEventListener('resize', onViewportChange);       // 软键盘弹出 / 收起
if (typeof ResizeObserver === 'function' && elTop && elCardbar){

    ro.observe(elTop); ro.observe(elCardbar);

}
