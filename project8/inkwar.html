  if (!sim || !sim.cardCd || !sim.cardCd[mySide]) return '';
  return myHand().map(function(k){
    var c = cardOf(k); if (!c) return '';
    var t = sim.cardCd[mySide][c.base || k];
    return t != null && t > sim.t ? Math.ceil(t - sim.t) : 0;
  }).join(',');
}
function renderHandThrottled(force){
  var sig = mode + '|' + myHand().join(',') + '|' + Math.floor(sim.ink[mySide]) + '|' +
            (aim ? aim.slot : -1) + '|' + (dragCard ? dragCard.slot : -1) + '|' + handCdSig();
  /* v1.33：拖拽中冻结整块重建 —— renderHand() 是 elCards.innerHTML 全量重写，
     墨量整数位变化或冷却秒数跳变就会把 5 张卡全换掉，中途重建会让拖拽状态与 DOM 错位。 */
  if (dragCard && !force){ lastHandSig = sig; return; }
  if (force || sig !== lastHandSig){ lastHandSig = sig; renderHand(); }
}

/* ============================================================
 * v1.20 敌方出牌提示：顶部横幅 + 目标城池飘字/扩散环 + 专属提示音
 * 此前只有「地图顶部飘一个卡名 1.4s」，既看不出是谁打的，也看不出打谁
 * ============================================================ */
var foeBar = { txt: '', color: '#2c5f6e', t: 0, life: 0 };   // life=0 即不显示
function foeTargetText(tid){
  if (tid == null || tid < 0 || !sim) return '';
  var c = sim.castles[tid];
  if (!c) return '';
  if (c.owner === mySide) return ' · 指向你的城池';
  if (c.owner === 0) return ' · 指向中立城';
  return ' · 指向' + (SIDE_CHAR[c.owner] || '敌') + '方城池';
}
function showFoeBar(txt, color){
  foeBar.txt = txt; foeBar.color = color; foeBar.t = 0; foeBar.life = 2.6;
  if (!elFoeBar) return;
  elFoeBar.innerHTML = '<i style="color:' + color + '">' + txt + '</i>';
  elFoeBar.className = 'foebar'; void elFoeBar.offsetWidth;      // 强制回流以重启入场动画
  elFoeBar.className = 'foebar on';
}
function hideFoeBar(){
  foeBar.life = 0; foeBar.txt = '';
  if (!elFoeBar) return;
  elFoeBar.className = 'foebar'; elFoeBar.innerHTML = '';
}
function tickFoeBar(dt){
  if (foeBar.life <= 0) return;
  foeBar.t += dt / 1000;
  if (foeBar.t >= foeBar.life) hideFoeBar();
}

/* ===== 事件 → 表现层 ===== */
function handleEvents(list){
  for (var i = 0; i < list.length; i++){
    var ev = list[i];
    switch (ev.type){
      case 'capture':
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.7, color: ev.owner === 1 ? '#b33327' : '#2c5f6e' });
        if (ev.owner === 1) floats.push({ x: ev.x, y: ev.y - 40, txt: '占领 +2墨', color: '#b33327', t: 0, life: 1.1 });
        Sound.capture();
        break;
      case 'upgrade': {
        floats.push({ x: ev.x, y: ev.y - 42,
                      txt: (ev.spent ? ev.spent + '兵入城 · ' : '') + '升级 Lv' + ev.level,
                      color: '#c9962e', t: 0, life: 1.1 });
        if (ev.owner === mySide && sim && sim.castles[ev.id]){
          var uc = sim.castles[ev.id];
          var ucap = Math.round(LEVELS[uc.level - 1].cap * sim.mods.cap);
          setHint('<b>' + (ev.spent || 0) + '</b> 兵进城 · 城池升至 <b>Lv' + uc.level +
                  '</b>（容量 ' + ucap + ' · 产速 ' + LEVELS[uc.level - 1].rate + '/秒）');
        }
        Sound.upgrade();
        break;
      }
      case 'card': {
        var ccol = castleColor(ev.by)[1];                       // v1.20：按阵营取色（多方混战不再一律黛青）
        var sideCh = SIDE_CHAR[ev.by] || '敌';
        var isFoe = ev.by !== mySide;
        var tc = (ev.target >= 0 && sim) ? sim.castles[ev.target] : null;
        /* 有目标 → 飘字落在目标城池上方（一眼看到打的是哪里）；无目标（征兵/屯田之类）→ 仍走地图顶部 */
        floats.push({ x: tc ? tc.x : CFG.MAP_W / 2, y: tc ? tc.y - castleR(tc) - 16 : 70,
                      txt: (isFoe ? '「' + sideCh + '」' : '') + '「' + ev.name + '」',
                      color: ccol, t: 0, life: 1.4 });
        if (tc) fxs.push({ x: tc.x, y: tc.y, t: 0, life: 0.9, color: ccol });   // 目标城池扩散环
        if (isFoe){
          /* v1.20：敌方出牌三层提示 —— 顶部横幅 + 目标飘字/圆环 + 专属下行提示音 */
          showFoeBar('敌方【' + sideCh + '】使用「' + ev.name + '」' + foeTargetText(ev.target), ccol);
          Sound.foeCard();
        } else {
          Sound.card();
        }
        break;
      }
      case 'shuffle':                            // v1.14：弃牌堆洗回抽牌堆
        if (ev.owner === mySide){
          floats.push({ x: CFG.MAP_W / 2, y: 92, txt: '洗牌', color: '#5b6560', t: 0, life: 1.1 });
          Sound.shuffle();
          renderPiles();
        }
        break;
      case 'burn':
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.6, color: '#d4553f' });
        floats.push({ x: ev.x, y: ev.y - 40, txt: '火攻！', color: '#b33327', t: 0, life: 1 });
        break;
      case 'block':
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.4, color: '#c9962e' });
        Sound.block();
        break;
      case 'clash':                              // 墨色相溶：在途部队互相湮灭
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.45, color: '#3a3a3a' });
        Sound.clash();
        break;
      case 'hit':                                // 城池受击红闪
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.3, color: '#e03e2e' });
        break;
      case 'tower':                              // 防御塔：开火弹道 / 建塔升塔（v1.12）
        if (ev.tx != null){
          var twc = ev.kind === 'cannon' ? 'rgba(43,42,38,.75)' : ev.kind === 'arrow' ? 'rgba(60,80,90,.8)'
                  : ev.kind === 'mage' ? 'rgba(110,70,150,.8)' : 'rgba(179,51,39,.8)';
          bolts.push({ x0: ev.x, y0: ev.y, x1: ev.tx, y1: ev.ty, t: 0, life: 0.22, color: twc,
                       w: ev.kind === 'cannon' ? 3 : 1.6,
                       arc: ev.kind === 'cannon' || ev.kind === 'claw', sag: ev.kind === 'cannon' ? 30 : 16 });
          fxs.push({ x: ev.tx, y: ev.ty, t: 0, life: 0.3, color: twc });
          if (tNow - lastTowerSnd > 0.12){ lastTowerSnd = tNow; Sound.tower(ev.kind); }   // 速射塔限流
        } else {
          var twn = Sim.TOWER_BY_KIND[ev.kind];
          floats.push({ x: ev.x, y: ev.y - 52, txt: '建' + (twn ? twn.name : '塔') + ' Lv' + ev.lv,
                        color: '#c9962e', t: 0, life: 1.2 });
          Sound.upgrade();
        }
        break;
      case 'grab':                               // 爪子：抓兵转己方驻军
        floats.push({ x: ev.x, y: ev.y - 36, txt: '爪 +' + ev.n, color: '#b33327', t: 0, life: 1 });        Sound.grab();
        break;
      case 'allout':                             // 全军出击
        floats.push({ x: CFG.MAP_W / 2, y: 120, txt: '⚔ 全军出击 ⚔', color: '#b33327', t: 0, life: 1.6 });
        break;
      case 'defect':                             // 策反倒戈
        floats.push({ x: ev.x, y: ev.y - 44, txt: '策反 ' + ev.n + ' 兵倒戈', color: '#c9962e', t: 0, life: 1.2 });
        Sound.upgrade();
        break;
      /* ---- v1.24 新机制的表现 ---- */
      case 'ambush':                             // 伏兵就位：城下一圈墨色伏痕
        floats.push({ x: ev.x, y: ev.y - 44, txt: '伏兵已设', color: '#57534a', t: 0, life: 1.1 });
        break;
      case 'ambushHit':                          // 伏兵触发：城下溅起一团墨 + 飘出削减数
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.45, color: '#3a3a3a' });
        floats.push({ x: ev.x, y: ev.y - 36, txt: '伏击 -' + ev.n, color: '#b33327', t: 0, life: 1.1 });
        Sound.clash();
        break;
      case 'breach':                             // 摧塔：塔位一道朱砂裂痕
        fxs.push({ x: ev.x, y: ev.y, t: 0, life: 0.5, color: '#b33327' });
        floats.push({ x: ev.x, y: ev.y - 48, txt: '塔毁', color: '#b33327', t: 0, life: 1.2 });
        Sound.block();
        break;
      case 'supply':                             // 粮道：己方在途部队统一冒出 +N
        floats.push({ x: CFG.MAP_W / 2, y: 108, txt: '粮道 +' + ev.n + ' 兵', color: '#c9962e', t: 0, life: 1.2 });
        Sound.upgrade();
        break;
      case 'hint':
        floats.push({ x: CFG.MAP_W / 2, y: 70, txt: ev.txt, color: '#57534a', t: 0, life: 1.4 });
        break;
    }
  }
}
/* 消费当前 sim 的事件：主机转发给客机一份，再本地渲染 */
function drainEvents(){
  var list = sim.events.splice(0, sim.events.length);
  repSample(); repEvents(list);                    // v1.25 战报：采样与事件记账（唯一入口，loop 与测试钩子共用）
  tutCheck(list); tutTick();                       // v1.25 引导：等一个真实操作完成后自动下一步
  if (netRole === 'host') netEvts = netEvts.concat(list);
  handleEvents(list);
}

/* ===== 渲染 ===== */
/* v1.18：塔种图标（矢量笔触，替代文字徽记）——炮=炮管+炮架 / 箭=带羽箭矢 / 法=四芒星 / 爪=三道爪痕 */
function drawTowerMark(kind, x, y, col){
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'cannon'){
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(x - 3.2, y + 2.4); ctx.lineTo(x + 3.2, y - 3.2); ctx.stroke();     // 炮管
    ctx.beginPath(); ctx.arc(x + 3.2, y - 3.2, 1.5, 0, 7); ctx.fill();                             // 炮口
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(x - 0.6, y + 3.6, 3.2, Math.PI, 0); ctx.stroke();                     // 炮架
  } else if (kind === 'arrow'){
    ctx.lineWidth = 1.9;
    ctx.beginPath(); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x + 3.4, y - 3.4); ctx.stroke();         // 箭杆
    ctx.beginPath(); ctx.moveTo(x + 5.2, y - 5.2); ctx.lineTo(x + 0.9, y - 3.9);                   // 箭头
    ctx.lineTo(x + 3.9, y - 0.9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 4.8, y + 1.8); ctx.lineTo(x - 2.2, y + 4.4);                   // 尾羽
    ctx.moveTo(x - 1.8, y + 4.8); ctx.lineTo(x - 4.4, y + 2.2); ctx.stroke();
  } else if (kind === 'mage'){
    ctx.beginPath();                                                                                // 四芒星
    ctx.moveTo(x, y - 5.6); ctx.lineTo(x + 1.7, y - 1.7); ctx.lineTo(x + 5.6, y); ctx.lineTo(x + 1.7, y + 1.7);
    ctx.lineTo(x, y + 5.6); ctx.lineTo(x - 1.7, y + 1.7); ctx.lineTo(x - 5.6, y); ctx.lineTo(x - 1.7, y - 1.7);
    ctx.closePath(); ctx.fill();
  } else {                                          // claw
    ctx.lineWidth = 1.9;
    for (var i = -1; i <= 1; i++){
      ctx.beginPath(); ctx.arc(x + i * 3.1, y - 1.4, 2.7, Math.PI * 0.12, Math.PI * 1.02); ctx.stroke();   // 爪痕 ×3
    }
  }
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}
function fitCanvas(){
  var rect = canvas.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = Math.round(rect.width * dpr), h = Math.round(rect.height * dpr);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
}
function drawCastle(c, selected, aimingValid, tGlobal){
  var col = castleColor(c.owner), r = castleR(c);
  var shake = c.hitT > 0 ? Math.sin(tGlobal * 46) * 1.8 : 0;   // 受击抖动
  var cx = c.x + shake, cy = c.y;
  if (c.flashT > 0){                                  // 占领晕染扩散环
    var k = 1 - c.flashT / 0.6;
    ctx.strokeStyle = col[0]; ctx.globalAlpha = (1 - k) * 0.8; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 12 + k * 40, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 4 + k * 22, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (c.hitT > 0){                                    // 受击红闪
    ctx.strokeStyle = 'rgba(224,62,46,' + (c.hitT * 2.2) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r + 2, 0, 7); ctx.stroke();
  }
  if (c.buffT > 0){                                   // 固守金色产速环
    ctx.strokeStyle = 'rgba(201,150,46,.8)'; ctx.lineWidth = 2;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(cx, cy, r - 5, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
  }
  var g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.15, cx, cy, r);
  g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 2.5; ctx.stroke();
  /* 等级嵌套环（v1.12）：环数 = 城池等级，由内向外等分 —— 圈几层就是几级城 */
  ctx.strokeStyle = 'rgba(247,242,227,.42)'; ctx.lineWidth = 1.4;
  for (var li = 0; li < c.level; li++){
    ctx.beginPath(); ctx.arc(cx, cy, levelRingR(c, li), 0, 7); ctx.stroke();
  }
  /* 容量环（v1.11）：外圈按「驻军 / 容量」比例填充，满仓转朱砂 —— 城池人口有硬上限，一眼可见 */
  var capNow = capOf(c);
  var fill = capNow > 0 ? Math.max(0, Math.min(1, c.garrison / capNow)) : 0;
  var capR = r + 9;
  ctx.strokeStyle = 'rgba(43,42,38,.15)'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.arc(cx, cy, capR, 0, 7); ctx.stroke();          // 容量轨道
  if (fill > 0.001){
    ctx.strokeStyle = fill >= 0.999 ? 'rgba(179,51,39,.9)' : col[1];
    ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.arc(cx, cy, capR, -Math.PI / 2, -Math.PI / 2 + fill * Math.PI * 2); ctx.stroke();
  }
  if (fill >= 0.999){                                  // 满仓：环外点一枚朱砂「满」
    ctx.font = 'bold 12px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = '#b33327'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('满', cx, cy - capR - 8);
  }
  /* 城池血条（v1.13）：头顶按 驻军/容量 填充，墨绿 → 金 → 朱砂，攻城/塔火掉血一眼可见 */
  var hw = r * 1.7, hx2 = cx - hw / 2, hy2 = cy - r - 31;
  ctx.fillStyle = 'rgba(43,42,38,.15)'; ctx.fillRect(hx2, hy2, hw, 5);
  if (fill > 0.001){
    ctx.fillStyle = fill >= 0.999 ? '#b33327' : fill > 0.7 ? '#c9962e' : '#6a9a58';
    ctx.fillRect(hx2, hy2, hw * fill, 5);
  }
  ctx.strokeStyle = 'rgba(43,42,38,.32)'; ctx.lineWidth = 1;
  ctx.strokeRect(hx2, hy2, hw, 5);
  /* 可升级提示环（v1.12）：外圈虚线显示距下一级的进度，满进度转金 */
  var upNeed = Sim.upgradeNeed(c);
  if (upNeed > 0 && c.owner === mySide){
    var pr = Math.max(0, Math.min(1, c.garrison / upNeed));
    var upR = r + 18;
    ctx.setLineDash([3, 5]); ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(43,42,38,.16)';
    ctx.beginPath(); ctx.arc(cx, cy, upR, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    if (pr > 0.001){
      ctx.strokeStyle = pr >= 0.999 ? '#c9962e' : 'rgba(201,150,46,.7)'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(cx, cy, upR, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); ctx.stroke();
    }
    /* v1.32：「↑」由**进度文字**升级为**可点击入口**（点它 / 按 E = 兵进城升级）。
       坐标与命中同用 upChipOf()，绝不各写一份 —— 否则「看得见点不到」。 */
    var chip = upChipOf(c), ready = c.garrison >= upNeed;
    ctx.beginPath(); ctx.arc(chip.x, chip.y, UP_CHIP_R, 0, 7);
    ctx.fillStyle = ready ? 'rgba(201,150,46,.95)' : 'rgba(247,242,227,.94)'; ctx.fill();
    ctx.strokeStyle = ready ? '#c9962e' : 'rgba(43,42,38,.34)'; ctx.lineWidth = ready ? 2 : 1.3; ctx.stroke();
    ctx.font = 'bold ' + (ready ? 15 : 12) + 'px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = ready ? '#f7f2e3' : 'rgba(43,42,38,.6)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ready ? '↑' : '↑' + Math.max(1, Math.ceil(upNeed - c.garrison)), chip.x, chip.y);
    ctx.textAlign = 'center';
  }
  /* 防御塔（v1.12）：射程圈 + 右上徽记（炮/箭/法/爪）+ 塔等级墨点 */
  if (c.tower){
    var trange = Sim.towerStat(c.tower, 'range');
    if (sim && (c.owner === mySide || selected || aimingValid)){  // 射程圈只在自家 / 选中 / 瞄准时画，避免满屏噪声（菜单环境局不画）
      ctx.setLineDash([2, 7]); ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(43,42,38,.16)';
      ctx.beginPath(); ctx.arc(c.x, c.y, trange, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    var bx = cx + r * 0.78, by = cy - r * 0.78;
    ctx.beginPath(); ctx.arc(bx, by, 9.5, 0, 7);
    ctx.fillStyle = 'rgba(247,242,227,.94)'; ctx.fill();
    ctx.strokeStyle = col[1]; ctx.lineWidth = 1.8; ctx.stroke();
    drawTowerMark(c.tower.kind, bx, by, col[1]);       // v1.18：矢量图标替代文字徽记
    for (var td = 0; td < c.tower.lv; td++){                 // 塔等级：徽记下的金点
      ctx.beginPath(); ctx.arc(bx - (c.tower.lv - 1) * 3 + td * 6, by + 13, 1.9, 0, 7);
      ctx.fillStyle = '#c9962e'; ctx.fill();
    }
    if (c.tower.cd > 0){                                     // 冷却：徽记上一段淡弧
      var twcd = Sim.towerStat(c.tower, 'cd');
      ctx.strokeStyle = 'rgba(43,42,38,.35)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(bx, by, 11, -Math.PI / 2, -Math.PI / 2 + (c.tower.cd / twcd) * Math.PI * 2); ctx.stroke();
    }
  }
  if (c.shieldT > 0){                                 // 护盾金环
    ctx.strokeStyle = 'rgba(201,150,46,' + (0.55 + 0.3 * Math.sin(tGlobal * 6)) + ')';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, 7); ctx.stroke();
  }
  if (c.weakT > 0){
    ctx.font = '15px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = 'rgba(90,60,110,.9)'; ctx.textAlign = 'center';
    ctx.fillText('弱', cx, cy - r - 16);
  }
  /* 驻军字兵环绕城池：有多少驻军画多少字（个体坐标与兵级点选共用 castleRingUnits） */
  var ringUnits = castleRingUnits(c, tGlobal);
  ctx.font = '10px "STKaiti","KaiTi","楷体",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col[1];
  for (var gi = 0; gi < ringUnits.length; gi++){
    var gu = ringUnits[gi];
    if (selection.some(function(x){ return x.k === 'gs' && x.id === c.id && x.idx === gi; })){
      ctx.strokeStyle = '#c9962e'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(gu.x, gu.y, 6.5, 0, 7); ctx.stroke();
    }
    ctx.fillText('兵', gu.x, gu.y);
  }
  ctx.font = 'bold 20px "STKaiti","KaiTi","楷体",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(30,26,20,.55)';
  var txt = String(Math.floor(c.garrison));
  ctx.strokeText(txt, cx, cy + 1);
  ctx.fillStyle = '#f7f2e3'; ctx.fillText(txt, cx, cy + 1);
  ctx.font = '11px "STKaiti","KaiTi","楷体",serif';          // 人口上限（满仓标红）
  ctx.fillStyle = fill >= 0.999 ? '#e8705f' : (c.buffT > 0 ? '#c9962e' : 'rgba(245,240,224,.78)');
  ctx.fillText('/' + capNow, cx, cy + 14);
  if (selected){
    ctx.strokeStyle = '#c9962e'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 14, 0, 7); ctx.stroke();
    ctx.font = 'bold 13px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = '#c9962e';
    ctx.fillText(Math.round(ratio * 100) + '%', c.x, c.y - r - 24);   // v1.34：跟随比例条实时显示
  }
  if (aimingValid){
    ctx.strokeStyle = 'rgba(179,51,39,' + (0.45 + 0.35 * Math.sin(tGlobal * 7)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.x, c.y, r + 13, 0, 7); ctx.stroke();
  }
}
/* 阵列：所有驻扎字兵按「方阵」排列——有多少兵排多少字，行列成方，个体微动 */
function drawCamp(p, tGlobal, selected){
  var col = castleColor(p.owner);
  var units = campFormations(p, tGlobal);
  var R = campR(p);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var k = units.length - 1; k >= 0; k--){
    var u = units[k];
    var gx = u.x, gy = u.y;
    if (selection.some(function(x){ return x.k === 'ps' && x.id === p.id && x.idx === k; })){
      ctx.strokeStyle = '#c9962e'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(gx, gy, 6.5, 0, 7); ctx.stroke();
    }
    ctx.font = 'bold 11.5px "STKaiti","KaiTi","楷体",serif';
    ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(245,240,224,.8)'; ctx.strokeText('兵', gx, gy);
    ctx.fillStyle = col[1];
    ctx.fillText('兵', gx, gy);
  }
  /* 每个兵的攻击动作（v1.12）：各自节拍突刺 + 挥砍弧，最多画 24 道以控开销 */
  if (p.atkT > 0){
    ctx.strokeStyle = 'rgba(43,42,38,.5)'; ctx.lineWidth = 1.6;
    var arcs = 0;
    for (var m = 0; m < units.length && arcs < 24; m++){
      var uu = units[m];
      if (!(uu.atk > 0.45)) continue;
      arcs++;
      var ba = Math.atan2(Math.sin(uu.ph), Math.cos(uu.ph));
      ctx.beginPath();
      ctx.arc(uu.x + Math.cos(uu.ph) * 5.5, uu.y + Math.sin(uu.ph) * 5.5, 6.5, ba - 0.9, ba + 0.9);
      ctx.stroke();
    }
  }
  if (p.count >= 4){                                    // 方阵外框：一眼看出「阵」
    var bb = campBox(p);
    ctx.strokeStyle = selected ? 'rgba(201,150,46,.9)' : 'rgba(43,42,38,.28)';
    ctx.lineWidth = selected ? 2 : 1.2;
    ctx.setLineDash(selected ? [6, 4] : [3, 5]);
    ctx.strokeRect(p.x - bb.w / 2, p.y - bb.h / 2, bb.w, bb.h);
    ctx.setLineDash([]);
  }
  if (p.count >= 8){
    ctx.font = 'bold 12px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = 'rgba(43,42,38,.75)';
    ctx.fillText(Math.floor(p.count), p.x, p.y - R - 8);
  }
}
/* 字兵方阵：以「兵」字建模，字号/列数随兵力，攻击时突刺+挥砍 */
/* 队形与个体运动：每个兵有独立相位/步频/摆动（id+索引散列），渲染与点选共用 */
function armyFormations(a, tGlobal, star){
  var dx = a.tx - a.x, dy = a.ty - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
  var ux = dx / d, uy = dy / d;
  var total = Math.max(1, Math.round(a.count));
  var cols = Math.min(8, Math.max(1, Math.ceil(Math.sqrt(total * 1.4))));
  var fs = 13 - Math.min(4.5, total / 30);
  var out = [];
  for (var k = 0; k < total; k++){
    var ph = a.ph0 != null ? a.ph0 : (a.id * 37.17 + k * 2.399) % 6.283;   // 单兵出队沿用被点中兵的相位（同一个兵）
    var row = Math.floor(k / cols), cIdx = k % cols;
    var side = (cIdx - (cols - 1) / 2) * fs * 0.92 + Math.sin(tGlobal * 0.9 + ph) * 1.3;
    var back = row * fs * 0.95;
    var bobF = 7 + star * 3 + (a.atkT > 0 ? 5 : 0);       // 神速/攻击时步频加快
    var bob = Math.sin(tGlobal * bobF + ph) * 1.2;        // 沿行进方向的个体步幅
    var sway = Math.cos(tGlobal * bobF * 0.6 + ph) * 0.8; // 个体横向摆动
    /* 每个兵各自的挥击节拍：独立相位 + 个体步频（避免整队同步成一个人在砍） */
    var ap = (a.id * 5.31 + k * 2.399) % 6.283;
    var atk = a.atkT > 0 ? Math.max(0, Math.sin(tGlobal * (24 + (k % 5) * 1.6) + ap)) : 0;
    out.push({ x: a.x - ux * back - uy * side + ux * bob, y: a.y - uy * back + ux * side + uy * bob,
               ph: ph, fs: fs, k: k, atk: atk });
  }
  return out;
}
function drawArmy(a, tGlobal, selected, star, alpha){
  star = star || 1;
  if (alpha != null && alpha < 1) ctx.globalAlpha = alpha;      // v1.26 影子部队
  var col = castleColor(a.owner);
  var dx = a.tx - a.x, dy = a.ty - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
  var ux = dx / d, uy = dy / d;
  var r = Sim.armyR(a);                                   // 碰撞体积
  /* v1.39：这里**不能**用全局 sim —— 菜单态画的是 menuSim，而 sim 此时是 null，
     只要菜单背景里有一支正在攻城的军队就会抛 TypeError（偶发，且会污染控制台）。
     draw() 已把当前要画的那局记在 curSim 里，取它才是对的。 */
  var storm = a.tKind === 'c' && curSim && curSim.castles[a.tid] && curSim.castles[a.tid].owner !== a.owner;
  var atk = a.atkT > 0 ? Math.sin(tGlobal * 30) * 3.4 : 0;          // 遭遇突刺
  var lunge = storm ? Math.max(0, Math.sin(tGlobal * 8)) * 2.6 : 0; // 攻城推进
  var units = armyFormations(a, tGlobal, star);
  var total = Math.max(1, Math.round(a.count));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col[1];
  for (var k = units.length - 1; k >= 0; k--){
    var u = units[k];
    var fsK = u.fs + (Math.sin(u.ph) * 0.8);              // 个体字号微差
    /* v1.12：每个兵都突刺（各自节拍），领头兵额外叠加攻城推进 */
    var push = (u.atk || 0) * 3.6 + lunge * (k === 0 ? 1 : 0.35);
    ctx.font = 'bold ' + fsK.toFixed(1) + 'px "STKaiti","KaiTi","楷体",serif';
    if (fsK > 10.5){ ctx.lineWidth = 2.6; ctx.strokeStyle = 'rgba(245,240,224,.85)'; ctx.strokeText('兵', u.x + ux * push, u.y + uy * push); }
    ctx.fillText('兵', u.x + ux * push, u.y + uy * push);
  }
  /* v1.12：每个兵一道挥砍弧（上限 24 道，避免大兵团刷屏） */
  if (a.atkT > 0){
    ctx.strokeStyle = 'rgba(43,42,38,.55)'; ctx.lineWidth = 1.7;
    var arcs = 0;
    for (var m = 0; m < units.length && arcs < 24; m++){
      var uu = units[m];
      if (!(uu.atk > 0.45)) continue;
      arcs++;
      var ba = Math.atan2(uy, ux);
      ctx.beginPath();
      ctx.arc(uu.x + ux * (uu.fs * 0.85), uu.y + uy * (uu.fs * 0.85), uu.fs * 0.72, ba - 0.9, ba + 0.9);
      ctx.stroke();
    }
  }
  if (a.solo && units.length === 1){                  // 单兵信使：脚下朱砂墨点（就是被点中的那个兵在走）
    var sm = units[0];
    ctx.fillStyle = 'rgba(179,51,39,.5)';
    ctx.beginPath(); ctx.arc(sm.x, sm.y + 7.5, 2.2, 0, 7); ctx.fill();
  }
  if (storm){                                          // 攻城推进：整队一道大挥砍弧（个体弧见上）
    var sw = a.x + ux * (14 + (atk + lunge)), swy = a.y + uy * (14 + (atk + lunge));
    var base = Math.atan2(uy, ux);
    ctx.strokeStyle = 'rgba(43,42,38,.3)';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(sw, swy, 9, base - 0.9, base + 0.9); ctx.stroke();
  }
  if (a.count >= 8){
    ctx.font = 'bold 13px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = 'rgba(43,42,38,.8)';
    ctx.fillText(Math.floor(a.count), a.x, a.y - r - 6);
  }
  if (selected){                                          // 整队选中环 = 碰撞体积可视化
    ctx.strokeStyle = '#c9962e'; ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(a.x, a.y, r + 4, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
  }
  /* v1.15：被 WASD 操控的兵——朱砂虚线双环 + 「控」字旗标 */
  if (ctrl.id && a.id === ctrl.id){
    var cu = units[0] || { x: a.x, y: a.y, fs: 12 };
    ctx.strokeStyle = 'rgba(179,51,39,.9)'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.arc(cu.x, cu.y, u_R(cu.fs) + 3.5, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(201,150,46,.85)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cu.x, cu.y, u_R(cu.fs) + 7.5, tGlobal * 2, tGlobal * 2 + 4.6); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = 'bold 10px "STKaiti","KaiTi","楷体",serif';
    ctx.fillStyle = '#b33327'; ctx.textAlign = 'center';
    ctx.fillText('控', cu.x, cu.y - u_R(cu.fs) - 11);
  }
  /* 兵级选中：被点中的那个兵套金圈（旗手） */
  var selSoldier = selection.find(function(x){ return x.k === 's' && x.id === a.id; });
  if (selSoldier && units[selSoldier.idx]){
    var su = units[selSoldier.idx];
    ctx.strokeStyle = '#c9962e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(su.x, su.y, u_R(su.fs), 0, 7); ctx.stroke();
  }
  function u_R(fs){ return fs * 0.62; }
  if (alpha != null && alpha < 1) ctx.globalAlpha = 1;          // v1.26 影子画完即恢复，别污染后续绘制
}
function draw(simToDraw, tGlobal){
  curSim = simToDraw;                                  // 容量环需取该局的日卡修正
  fitCanvas();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#f5f0e0'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  viewApply();                                          /* v1.27：代替原先写死的 contain 变换 */
  ctx.drawImage(bg, 0, 0);

  var i;
  for (i = 0; i < simToDraw.camps.length; i++)
    drawCamp(simToDraw.camps[i], tGlobal, simToDraw === sim && selHas('p', simToDraw.camps[i].id));
  for (i = 0; i < simToDraw.armies.length; i++)
    /* v1.26 客机本地预测：影子部队半透明（真身随下一份快照到达即被重建覆盖，无需显式清理） */
    drawArmy(simToDraw.armies[i], tGlobal, simToDraw === sim && selHas('a', simToDraw.armies[i].id),
             starMulOf(simToDraw, simToDraw.armies[i]),
             simToDraw.armies[i].ghost ? 0.42 : 1);
  /* v1.33：瞄牌态与拖拽态共用同一套「合法城池脉动朱砂环」（drawCastle 的 aimingValid 一行未改） */
  var hlKey = aim ? myHand()[aim.slot] : (dragCard ? myHand()[dragCard.slot] : null);
  for (i = 0; i < simToDraw.castles.length; i++){
    var c = simToDraw.castles[i];
    var aimingValid = false;
    if (hlKey && simToDraw === sim) aimingValid = Sim.validTarget(sim, hlKey, mySide, c.id);
    drawCastle(c, simToDraw === sim && selHas('c', c.id), aimingValid, tGlobal);
  }
  /* 拖拽期：光标下那座城再加一道实环（合法朱砂 / 非法朱红），与替身的 .ok / .bad 同步 */
  if (dragCard && dragCard.hover >= 0 && simToDraw === sim){
    var hc = sim.castles[dragCard.hover];
    if (hc){
      ctx.strokeStyle = dragCard.ok ? '#b33327' : '#e03e2e';
      ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.arc(hc.x, hc.y, castleR(hc) + 19, 0, 7); ctx.stroke();
    }
  }

  for (i = 0; i < fxs.length; i++){                   // 特效扩散环
    var fx = fxs[i], k = fx.t / fx.life;
    ctx.strokeStyle = fx.color; ctx.globalAlpha = (1 - k) * 0.7; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, 26 + k * 52, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* 防御塔弹道（v1.12）：炮塔走抛物线，其余直线，命中点由 fxs 负责晕开 */
  for (i = 0; i < bolts.length; i++){
    var bl = bolts[i], kb = bl.t / bl.life;
    ctx.globalAlpha = (1 - kb) * 0.9;
    ctx.strokeStyle = bl.color; ctx.lineWidth = bl.w;
    ctx.beginPath(); ctx.moveTo(bl.x0, bl.y0);
    if (bl.arc) ctx.quadraticCurveTo((bl.x0 + bl.x1) / 2, (bl.y0 + bl.y1) / 2 - bl.sag, bl.x1, bl.y1);
    else ctx.lineTo(bl.x1, bl.y1);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (i = 0; i < floats.length; i++){                // 浮字
    var f = floats[i], k = f.t / f.life;
    ctx.globalAlpha = 1 - k;
    ctx.font = 'bold 18px "STKaiti","KaiTi","楷体",serif'; ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y - k * 26);
    ctx.globalAlpha = 1;
  }
  if (boxRect){                                       // 框选矩形
    ctx.fillStyle = 'rgba(179,51,39,.09)'; ctx.fillRect(boxRect.x, boxRect.y, boxRect.w, boxRect.h);
    ctx.strokeStyle = 'rgba(179,51,39,.85)'; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
    ctx.strokeRect(boxRect.x, boxRect.y, boxRect.w, boxRect.h);
    ctx.setLineDash([]);
  }
  if (dragArrow && dragArrow.count >= 1){             // 拖拽派遣预览
    ctx.strokeStyle = 'rgba(142,42,29,.8)'; ctx.lineWidth = 2.5; ctx.setLineDash([9, 6]);
    ctx.beginPath(); ctx.moveTo(dragArrow.x, dragArrow.y); ctx.lineTo(dragArrow.tx, dragArrow.ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = 'bold 15px "STKaiti","KaiTi","楷体",serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#8e2a1d';
    ctx.fillText(dragArrow.count + ' 兵', (dragArrow.x + dragArrow.tx) / 2, (dragArrow.y + dragArrow.ty) / 2 - 10);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawMiniMap(simToDraw);                               /* v1.27：屏幕坐标系，不随视图变换 */
}

/* v1.27 缩略图：只在「视野被裁切 / 被放大」时出现（默认全览时不画，白送的屏幕空间不占）。
   画全图城池点 + 当前视口红框，弥补手机竖屏「铺满」裁掉的两侧。
   v1.37：判据补上 viewCropped() —— 竖屏基准就是裁切态，此时 viewMoved() 为 false 但玩家正需要全图感知。
   桌面 / 横屏画布恒 16:9 → cover == contain → viewCropped() 恒 false，与旧行为逐像素一致。 */
function drawMiniMap(simToDraw){
  if (!(viewMoved() || viewCropped()) || !simToDraw) return;
  var W = canvas.width, H = canvas.height;
  var mw = Math.max(76, Math.round(Math.min(W, H) * 0.2)), mh = Math.round(mw * CFG.MAP_H / CFG.MAP_W);
  var x0 = 8, y0 = H - mh - 8;                          // 左下（右下是 dpad）
  ctx.globalAlpha = 0.86;
  ctx.fillStyle = 'rgba(247,242,227,.9)';
  ctx.fillRect(x0, y0, mw, mh);
  ctx.strokeStyle = 'rgba(43,42,38,.55)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x0, y0, mw, mh);
  var r = Math.max(1.8, mw * 0.022);
  for (var i = 0; i < simToDraw.castles.length; i++){
    var c = simToDraw.castles[i];
    ctx.fillStyle = castleColor(c.owner)[1];
    ctx.beginPath(); ctx.arc(x0 + c.x / CFG.MAP_W * mw, y0 + c.y / CFG.MAP_H * mh, r, 0, 7); ctx.fill();
  }
  var k = viewK(), hw = (W / 2) / k, hh = (H / 2) / k;
  ctx.strokeStyle = '#b33327'; ctx.lineWidth = 1.6;
  ctx.strokeRect(x0 + (CFG.MAP_W / 2 + view.px - hw) / CFG.MAP_W * mw,
                 y0 + (CFG.MAP_H / 2 + view.py - hh) / CFG.MAP_H * mh,
                 Math.min(mw, hw * 2 / CFG.MAP_W * mw), Math.min(mh, hh * 2 / CFG.MAP_H * mh));
  ctx.globalAlpha = 1;
}

/* ===== 主循环 ===== */
function loop(t){
  var dt = Math.min(50, t - lastT);
  lastT = t; tNow = t / 1000;
  var i;
  if (mode === 'playing' && sim){
    manualTick(dt / 1000);                            // v1.15：单兵操控（WASD 持续改向）
    if (netRole === 'guest'){
      /* 客机：不跑模拟，只做航位推算（快照间平滑部队位置） */
      var ddt = Math.min(100, dt) / 1000;
      for (i = 0; i < sim.armies.length; i++){
        var ra = sim.armies[i];
        /* v1.26 影子部队：只做展示，1.5 秒还没等到真身（指令丢失）就撤掉 */
        if (ra.ghost){
          ra.gt = (ra.gt || 0) + ddt;
          if (ra.gt > 1.5){ sim.armies.splice(i, 1); i--; continue; }
        }
        var rsp = Sim.armySpeed(sim, ra) * ddt;          // 与主机同一速度合成公式（增益按阵营归属）
        var rdx = ra.tx - ra.x, rdy = ra.ty - ra.y, rd = Math.sqrt(rdx*rdx + rdy*rdy);
        if (rd <= rsp){ ra.x = ra.tx; ra.y = ra.ty; }
        else { ra.x += rdx / rd * rsp; ra.y += rdy / rd * rsp; }
        /* v1.26 软纠正：每帧把推算位置往最新快照位置收敛，把「瞬移」摊成 120ms 的滑动 */
        if (ra.sx != null){
          var kk = Math.min(1, ddt / 0.12);
          ra.x += (ra.sx - ra.x) * kk; ra.y += (ra.sy - ra.y) * kk;
        }
      }
    } else {
      acc += dt;
      while (acc >= STEP * 1000){
        Sim.step(sim, STEP);
        acc -= STEP * 1000;
        if (sim.over) break;
      }
      drainEvents();
      if (netRole === 'host'){
        netT += dt;
        if (netT >= 100){ netT = 0; Net.pushSnapshot(); }
      }
      if (sim.over) endGame();
    }
    hudT += dt;
    if (hudT > 250){ hudT = 0; updateHud(); }
  } else if (mode === 'menu' && menuSim){
    acc += dt;
    while (acc >= STEP * 1000){
      Sim.step(menuSim, STEP);
      acc -= STEP * 1000;
      if (menuSim.over){ menuSim = Sim.createGame({ mode: 'ambient', opponents: 3, castles: 11, diff: 'normal', ambient: true, seed: (Math.random() * 1e9) | 0 }); break; }
    }
    menuSim.events.length = 0;                       // 环境局不消费事件，直接丢弃
    for (i = floats.length - 1; i >= 0; i--){ floats[i].t += dt / 1000; if (floats[i].t >= floats[i].life) floats.splice(i, 1); }
    for (i = fxs.length - 1; i >= 0; i--){ fxs[i].t += dt / 1000; if (fxs[i].t >= fxs[i].life) fxs.splice(i, 1); }
  }
  if (mode !== 'menu'){                                // 浮字/特效计时（对局中也走这里）
    for (i = floats.length - 1; i >= 0; i--){ floats[i].t += dt / 1000; if (floats[i].t >= floats[i].life) floats.splice(i, 1); }
    for (i = fxs.length - 1; i >= 0; i--){ fxs[i].t += dt / 1000; if (fxs[i].t >= fxs[i].life) fxs.splice(i, 1); }
    for (i = bolts.length - 1; i >= 0; i--){ bolts[i].t += dt / 1000; if (bolts[i].t >= bolts[i].life) bolts.splice(i, 1); }
  }
  if (mode === 'playing') tickFoeBar(dt); else if (foeBar.life > 0) hideFoeBar();   // v1.20 敌方出牌提示条计时
  /* v1.34 出兵比例条逐帧刷新：选中集一变（点选/框选/清空/驻军被打光）读数与禁用态立刻跟上，
     不等 updateHud 的 250ms 节流；内部按签名去重，无变化就不写 DOM */
  renderRatioBar();
  netTick(dt / 1000);                                                               // v1.26 联机心跳与重连宽限

/* 令牌只作用在 SDP 上：先替换再包 JSON —— 反过来的话令牌里的 { } 会和 JSON 自己的括号撞车 */
function packBody(desc){ return JSON.stringify({ t: desc.type, s: tok(sdpMin(desc.sdp)) }); }
/* 同步打包（打桩 / 不支持压缩时的兜底）：s 前缀 */
function packSync(desc){
  return 's' + b64uEnc(packBody(desc));
}
function descOf(o, toked){
  if (!o) return null;
  var ty = o.t || o.type, sd = o.s != null ? o.s : o.sdp;
  if (!ty || sd == null) return null;
  return { type: ty, sdp: toked ? untok(sd) : sd };
}
function unpackSync(raw, key){
  try {
    var code = pickCode(raw, key), o;
    if (code.charAt(0) === 's') o = JSON.parse(b64uDec(code.slice(1)));
    else if (code.charAt(0) === 'z') return null;               // 压缩码必须走异步
    else o = JSON.parse(b64d(code));                            // 旧版整份 base64（无令牌）
    return descOf(o, code.charAt(0) === 's');
  } catch (e){ return null; }
}
async function packCode(desc){
  var z = await deflateB64(packBody(desc));
  return z ? ('z' + z) : packSync(desc);
}
async function unpackCode(raw, key){
  var code;
  try {
    code = pickCode(raw, key);
    if (code.charAt(0) === 'z') return descOf(JSON.parse(await inflateB64(code.slice(1))), true);
  } catch (e){ return null; }
  return unpackSync(code, null);
}
/* 从「链接或裸码」里取码：优先匹配 ?join= / ?accept=，否则整段当码 */
function pickCode(raw, key){
  var s = String(raw == null ? '' : raw).trim();
  if (key){
    var m = s.match(new RegExp(key + '=([A-Za-z0-9+/_=%-]+)'));
    if (m) s = decodeURIComponent(m[1]);
  }
  return s;
}

/* ===== v1.26 连接过程可视化 =====
 * 以前只有一句「连接中…」，卡住时用户分不清是「还在协商」还是「压根连不通」。
 * 现在跟着 ICE 阶段实时播报，20 秒仍未连通明确报超时并给出可操作建议。 */
var NET_CONN_TIMEOUT = 20;
var NET_ICE_TXT = { new: '正在建立连接…', checking: '正在协商网络路径…', connecting: '正在协商网络路径…',
                    connected: '已连接', completed: '已连接', disconnected: '连接中断，正在重试…',
                    failed: '连接失败', closed: '连接已关闭' };
var netConn = { on: false, st: '', t: 0, timer: null };
function pvpStatEl(){ return document.getElementById('pvpStat'); }
function netStat(txt, bad){
  var el = pvpStatEl();
  if (el){ el.textContent = txt; el.className = bad ? 'pvpbad' : ''; }
}
function netStatTxt(){ var el = pvpStatEl(); return el ? String(el.textContent || '') : ''; }
function netIceText(st){ return NET_ICE_TXT[st] || '连接中…'; }
function netIceBad(st){ return st === 'failed' || st === 'closed'; }
function netConnStart(pc){
  netConnStop();
  netConn.on = true; netConn.st = ''; netConn.t = 0;
  if (pc && pc.addEventListener){
    pc.addEventListener('iceconnectionstatechange', function(){ netConnApply(pc.iceConnectionState); });
    pc.addEventListener('connectionstatechange', function(){ netConnApply(pc.connectionState); });
  }
  if (pc && pc.iceConnectionState) netConnApply(pc.iceConnectionState);
  else netStat(netIceText('new'), false);
  if (pc) netConn.timer = setInterval(netConnTick, 1000);   // 无 pc（打桩）时不挂真实定时器
}
function netConnApply(st){
  if (!netConn.on) return;
  st = st || 'new';
  if (st === netConn.st) return;
  netConn.st = st;
  if (st === 'connected' || st === 'completed'){
    netConnStop(); netStat('已连接 · 进入等待室…', false); return;
  }
  netStat(st === 'failed' ? '连接失败 · 可能是 NAT / 防火墙阻碍，试试同一 Wi-Fi 或手机热点'
                          : netIceText(st), netIceBad(st));
  if (st === 'failed' || st === 'closed') netConnStop();
}
function netConnTick(){
  if (!netConn.on) return;
  if (netConn.st === 'connected' || netConn.st === 'completed' || netConn.st === 'failed' || netConn.st === 'closed'){
    netConnStop(); return;
  }
  netConn.t++;
  if (netConn.t >= NET_CONN_TIMEOUT){
    netConn.on = false;
    netStat('连接超时（' + NET_CONN_TIMEOUT + ' 秒）· 双方网络未打通，请检查防火墙或改用手机热点', true);
    netConnStop(); return;
  }
  netStat('连接中… 已尝试 ' + netConn.t + ' 秒（' + NET_CONN_TIMEOUT + ' 秒超时）', false);
}
function netConnStop(){
  if (netConn.timer){ clearInterval(netConn.timer); netConn.timer = null; }
  netConn.on = false;
}
/* ICE 彻底失败（failed / closed）时立刻给出明确原因；disconnected 多为瞬时抖动，交给心跳宽限处理 */
function netBindDrop(pc){
  if (!pc || !pc.addEventListener) return;
  pc.addEventListener('iceconnectionstatechange', function(){
    var st = pc.iceConnectionState;
    if ((st === 'failed' || st === 'closed') && netRole !== 'none' && !netWaiting)
      Net.dropped(st === 'closed' ? '连接被关闭 · 对手已退出或刷新了页面' : '连接失败 · 网络路径被阻断（NAT / 防火墙）');
  });
}

/* v1.26 等待室规则设定：地图 / 节奏 / 限时。PVP 双方都是人，没有 AI，难度选项没有意义（故不提供）。 */
function lobbyCfgHtml(){
  function row(lab, key, opts, fmt){
    return '<div class="optrow"><span class="lab">' + lab + '</span>' +
      opts.map(function(v){
        return '<button class="opt' + (netCfg[key] === v ? ' sel' : '') + '" data-ncfg="' + key + '" data-v="' + v + '"' +
               (netRole === 'host' ? '' : ' disabled') + '>' + fmt(v) + '</button>';
      }).join('') + '</div>';
  }
  return '<div class="cstbox">' +
    row('地图', 'size', [8, 11, 14], function(v){ return v + ' 城'; }) +
    row('节奏', 'prod', [0.7, 1, 1.5], function(v){ return '×' + v; }) +
    row('限时', 'timeLimit', [0, 180, 300], function(v){ return v ? (v / 60) + ' 分钟' : '不限时'; }) +
    '<div class="cstnote">' + (netRole === 'host' ? '规则由你设定 · 对手那边实时同步' : '规则由房主设定 · 你这边自动同步') + '</div>' +
  '</div>';
}

var Net = {
  pc: null, ch: null, role: 'none',
  /* v1.37：续连标记 —— 真了就在建连成功后跳过等待室、直接把当前这局续上（不重开、不重抽地图） */
  relinking: false,
  /* 等待室（v1.13）：连接建立后不立即开局，双方准备 → 3 秒倒计时 */
  inLobby: false,
  lobby: { me: false, foe: false, foeW: 0, foeL: 0, log: [], cnt: 0 },
  lobbyTimer: null,
  /* v1.26 心跳：pingSent[序号] = 发送时刻（Date.now()），收到对应 pong 时算 RTT */
  pingSent: {},
  lobbyReset: function(){
    this.lobby.me = false; this.lobby.foe = false; this.lobby.foeW = 0; this.lobby.foeL = 0;
    this.lobby.log = []; this.lobby.cnt = 0;
    if (this.lobbyTimer){ clearInterval(this.lobbyTimer); this.lobbyTimer = null; }
  },
  lobbyLog: function(s){
    this.lobby.log.push(s);
    if (this.lobby.log.length > 8) this.lobby.log.shift();
    var el = document.getElementById('waitLog');
    if (el) el.innerHTML = this.lobby.log.map(function(x){ return '· ' + x; }).join('<br>');
  },
  showNetLobby: function(){
    var L = this.lobby, net = this;
    this.inLobby = true;
    showOverlay(
      '<h1>等<i>·</i>待</h1>' +
      '<div class="motto">五国点兵 · 虚位以待</div>' +
      '<div class="waitrow">' +
        '<div class="seat"><div class="face' + (L.me ? ' ok' : '') + '" style="background:' + castleColor(1)[0] + '">朱</div>' +
          '<div class="nm">' + (netRole === 'host' ? '我 · 房主' : '我') + '</div><div class="rc">' + netRec.w + '胜' + netRec.l + '负</div></div>' +
        '<div class="seat"><div class="face' + (L.foe ? ' ok' : '') + '" style="background:' + castleColor(2)[0] + '">青</div>' +
          '<div class="nm">对手</div><div class="rc">' + (L.foe ? L.foeW + '胜' + L.foeL + '负' : '等待加入…') + '</div></div>' +
      '</div>' +
      lobbyCfgHtml() +
      '<div class="rstat" style="font-size:16px;color:var(--cinnabar)">' +
        (L.cnt > 0 ? '游戏正在开始 ' + L.cnt + ' …' : (L.me && L.foe ? '即将开局…' : '双方都点「准备」后开局')) + '</div>' +
      '<div class="btnrow"><button class="bb pri" id="btnReady">' + (L.me ? '取消准备' : '准 备') + '</button>' +
      '<button class="bb" id="btnLobbyBack">退 出</button></div>' +
      '<div class="waitlog" id="waitLog">' + L.log.map(function(x){ return '· ' + x; }).join('<br>') + '</div>'
    );
    document.getElementById('btnReady').onclick = function(){ Sound.select(); net.lobbyReady(!net.lobby.me); };
    document.getElementById('btnLobbyBack').onclick = function(){ Sound.select(); backToMenu(); };
    /* v1.26 房主规则设定：打桩下 querySelectorAll 恒空，故同时提供 __ink.lobbyCfg 钩子 */
    elPanel.querySelectorAll('[data-ncfg]').forEach(function(b){
      b.onclick = function(){ Sound.select(); net.lobbyCfg(b.dataset.ncfg, +b.dataset.v); };
    });
  },
  lobbyCfg: function(key, val){
    if (this.role !== 'host' || val == null || isNaN(val)) return;
    netCfg[key] = val;
    this.send({ t: 'cfg', size: netCfg.size, prod: netCfg.prod, timeLimit: netCfg.timeLimit });
    this.lobbyLog(key === 'size' ? '地图改为 ' + val + ' 城'
                : key === 'prod' ? '节奏改为 ×' + val
                : '限时改为 ' + (val ? val / 60 + ' 分钟' : '不限时'));
    this.showNetLobby();
  },
  lobbyReady: function(on){
    if (mode !== 'menu') return;
    this.lobby.me = !!on;
    this.lobbyLog(on ? '我已准备' : '我取消了准备');
    this.send({ t: 'ready', on: !!on });
    this.showNetLobby();
    this.checkLobbyStart();
  },
  checkLobbyStart: function(){
    var L = this.lobby, net = this;
    if (L.cnt > 0 || !L.me || !L.foe || this.role !== 'host') return;   // 客机等主机发车
    L.cnt = 3;
    this.lobbyLog('双方已准备 · 游戏正在开始…');
    this.showNetLobby();
    this.lobbyTimer = setInterval(function(){ net.lobbyTick(); }, 1000);
  },
  lobbyTick: function(){
    var L = this.lobby;
    if (L.cnt <= 0) return;
    L.cnt--;
    if (L.cnt <= 0){
      if (this.lobbyTimer){ clearInterval(this.lobbyTimer); this.lobbyTimer = null; }
      if (this.role === 'host') this.hostRestart();      // 主机广播 start，双方各自开局
      return;
    }
    this.showNetLobby();
  },
  /* ===== v1.39 房间码：房主建房 → 云里存 offer → 轮询等 answer ===== */
  hostRoomCode: async function(){
    this.teardown();
    if (typeof RTCPeerConnection === 'undefined'){ pvpStatus('<div class="rstat">当前浏览器不支持 WebRTC，无法联机</div>'); return; }
    this.role = netRole = 'host';
    netRoomCode = '';
    netStat('正在连接云服务…', false);
    var db = await cloudDB();
    if (!db){
      pvpStatus('<div class="rstat">云服务连不上（离线，或用本地文件打开）· 请改用「联机码手动连接」，' +
                '或刷新页面重试</div>' + turnCfgHtml());
      this.role = netRole = 'none';
      return;
    }
    try {
      this.pc = new RTCPeerConnection(rtcConfig());
      this.ch = this.pc.createDataChannel('ink');
      this.bind(this.ch);
      netBindDrop(this.pc);
      var offer = await this.pc.createOffer();
      await this.pc.setLocalDescription(offer);
      /* 先收集完 ICE 再出码（v1.37 的教训：候选不全 = 对面少一半可用路径） */
      netStat('正在收集网络地址…（最多 ' + (NET_ICE_WAIT / 1000) + ' 秒）', false);
      var self = this;
      await gatherIce(this.pc, function(){ netStat(iceHint(self.pc), false); });
      var ocode = await packCode(this.pc.localDescription);
      var rc = await roomCreate(ocode);
      if (!rc.ok){
        pvpStatus('<div class="rstat">创建房间失败：' + rc.why + '</div>' + turnCfgHtml());
        this.role = netRole = 'none';
        return;
      }
      netRoomCode = rc.code;
      var url = roomInviteUrl(rc.code);
      pvpStatus(
        '<div class="rstat">把<b>房间码</b>告诉朋友 —— TA 点「加入房间」输入这 6 位即可：</div>' +
        '<div class="roomcode" id="roomCodeBox">' + rc.code + '</div>' +
        '<button class="tbtn" id="copyRoom">复制房间码</button> ' +
        (canShare() && url ? '<button class="tbtn" id="shareRoom">分享链接</button> ' : '') +
        '<button class="tbtn" id="roomCancel">取消</button>' +
        '<div class="pvpcode">' + iceHint(this.pc) + '</div>' +
        '<div class="pvpcode" id="pvpStat">等待对手输入房间码…</div>' +
        turnCfgHtml()
      );
      var cb = document.getElementById('copyRoom');
      if (cb) cb.onclick = function(){ copyText(rc.code, cb); };
      if (canShare() && url) bindShare('shareRoom', url);
      var net = this;
      var cbx = document.getElementById('roomCancel');
      if (cbx) cbx.onclick = function(){
        roomClose(rc.code); netRoomCode = ''; net.teardown(); showMenu();
        pvpStatus('<div class="rstat">已取消房间</div>');
      };
      bindTurnCfg();
      var w = await roomWaitAnswer(rc.code);
      if (!w.ok){ netStat(w.why, true); return; }
      var desc = await unpackCode(w.answer, 'accept');
      if (!desc){ netStat('应答码无效', true); return; }
      await this.pc.setRemoteDescription(new RTCSessionDescription(desc));
      roomClose(rc.code);
      netConnStart(this.pc);
    } catch (e){
      pvpStatus('<div class="rstat">创建失败：' + e.message + '</div>');
      this.role = netRole = 'none';
    }
  },
  /* 客机：输 6 位码 */
  joinRoomUI: function(prefill){
    this.teardown();
    if (typeof RTCPeerConnection === 'undefined'){ pvpStatus('<div class="rstat">当前浏览器不支持 WebRTC，无法联机</div>'); return; }
    this.role = netRole = 'guest';
    pvpStatus(
      '<div class="rstat">输入房主给你的 <b>6 位房间码</b>：</div>' +
      '<input class="roomin" id="roomIn" maxlength="6" autocomplete="off" spellcheck="false" placeholder="如 ABC123" value="' + roomNorm(prefill) + '">' +
      '<button class="tbtn" id="doJoinRoom">加入</button> <span id="pvpStat"></span>' +
      turnCfgHtml()
    );
    bindTurnCfg();
    var net = this;
    var go = function(){
      var el = document.getElementById('roomIn');
      net.joinRoomCode(roomNorm(el ? el.value : ''));
    };
    var b = document.getElementById('doJoinRoom');
    if (b) b.onclick = go;
    var inp = document.getElementById('roomIn');
    if (inp){
      inp.oninput = function(){ var v = roomNorm(inp.value); if (v !== inp.value) inp.value = v; };
      inp.onkeydown = function(e){ if (e.key === 'Enter') go(); };
      try { inp.focus(); } catch (e){}
    }
    if (roomNorm(prefill)) go();          // 点开分享链接直接进
  },
  joinRoomCode: async function(code){
    code = roomNorm(code);
    if (code.length !== 6){ netStat('房间码是 6 位', true); return; }
    netRoomCode = code;
    netStat('正在连接云服务…', false);
    var db = await cloudDB();
    if (!db){ netStat('云服务连不上 · 请改用「联机码手动连接」', true); return; }
    var g = await roomGet(code);
    if (!g.ok){ netStat(g.why, true); return; }
    if (!g.row.offer){ netStat('房间还没准备好（房主仍在收集网络地址）', true); return; }
    var desc = await unpackCode(g.row.offer, 'join');
    if (!desc){ netStat('房间里的邀请码无效', true); return; }
    try {
      var net = this;
      this.pc = new RTCPeerConnection(rtcConfig());
      netBindDrop(this.pc);
      this.pc.ondatachannel = function(e){ net.ch = e.channel; net.bind(e.channel); };
      await this.pc.setRemoteDescription(new RTCSessionDescription(desc));
      var ans = await this.pc.createAnswer();
      await this.pc.setLocalDescription(ans);
      netStat('正在收集网络地址…（最多 ' + (NET_ICE_WAIT / 1000) + ' 秒）', false);
      await gatherIce(this.pc, function(){ netStat(iceHint(net.pc), false); });
      var d2 = this.pc.localDescription.toJSON ? this.pc.localDescription.toJSON() : JSON.parse(JSON.stringify(this.pc.localDescription));
      var acode = await packCode(d2);
      var ra = await roomAnswer(code, acode);
      if (!ra.ok){ netStat(ra.why, true); return; }
      netStat('已应答 · 正在连接房主…', false);
      netConnStart(this.pc);
    } catch (e){ netStat('连接失败：' + e.message, true); }
  },
  hostRoom: async function(){
    this.teardown();
    if (typeof RTCPeerConnection === 'undefined'){ pvpStatus('<div class="rstat">当前浏览器不支持 WebRTC，无法联机</div>'); return; }
    this.role = netRole = 'host';
    try {
      this.pc = new RTCPeerConnection(rtcConfig());
      this.ch = this.pc.createDataChannel('ink');
      this.bind(this.ch);
      netBindDrop(this.pc);                       // v1.26：ICE 彻底失败时给出明确原因
      var offer = await this.pc.createOffer();
      await this.pc.setLocalDescription(offer);
      /* v1.37：收集期间实时播报（旧版静默等 3.5 秒，用户以为卡死；且超时后 SDP 候选不全） */
      netStat('正在收集网络地址…（最多 ' + (NET_ICE_WAIT / 1000) + ' 秒）', false);
      var self = this;
      await gatherIce(this.pc, function(){ netStat(iceHint(self.pc), false); });
      var full = b64e(JSON.stringify(this.pc.localDescription));
      var code = await packCode(this.pc.localDescription);   // v1.26 短码（裁剪 + 令牌 + 压缩）
      var url = inviteUrl('join', code);
      var out = url || code;
      pvpStatus(
        '<div class="rstat">① ' + (url ? '把<b>邀请链接</b>发给朋友' : '把<b>联机码</b>发给朋友') +
          (canShare() ? '（可直接点「分享」发到微信）' : '') + '：<br>' +
        '<textarea class="codebox" id="invUrl" readonly>' + out + '</textarea>' +
        '<button class="tbtn" id="copyInv">复制</button>' +
        (canShare() ? ' <button class="tbtn" id="shareInv">分享</button>' : '') +
        '<div class="pvpcode">联机码 ' + code.length + ' 字（原 ' + full.length + ' 字）</div>' +
        '<div class="pvpcode">' + iceHint(this.pc) + '</div></div>' +
        '</div><div class="rstat">② 收到朋友的<b>应答链接</b>后粘贴到这里：</div>' +
        '<textarea class="codebox" id="ansIn" placeholder="粘贴应答链接或联机码"></textarea>' +
        '<button class="tbtn" id="pasteAns">' + (canPaste() ? '粘贴' : '—') + '</button>' +
        '<button class="tbtn" id="acceptAns">完成连接</button> <span id="pvpStat"></span>' +
        turnCfgHtml()
      );
      var net = this;
      var invEl = document.getElementById('invUrl');
      document.getElementById('copyInv').onclick = function(){ copyText(invEl.value, document.getElementById('copyInv')); };
      bindShare('shareInv', out);
      bindPaste('pasteAns', 'ansIn');
      bindTurnCfg();
      document.getElementById('acceptAns').onclick = async function(){
        var desc = await unpackCode(document.getElementById('ansIn').value, 'accept');
        if (!desc){ netStat('应答码无效', true); return; }
        try {
          await net.pc.setRemoteDescription(new RTCSessionDescription(desc));   // v1.14：不再从应答码取手牌
          netConnStart(net.pc);                   // v1.26：播报 ICE 阶段 + 20 秒超时
        } catch (e){ netStat('应答码无效', true); }
      };
    } catch (e){ pvpStatus('<div class="rstat">创建失败：' + e.message + '</div>'); this.role = netRole = 'none'; }
  },

        /* v1.14：客机的起始手牌由主机抽取后随快照下发，应答码不再夹带手牌 */
        var code = await packCode(d2);            // v1.26 短码

  },
  bind: function(ch){
    var net = this;
    ch.onopen = function(){
      if (netRoomCode){ roomClose(netRoomCode); netRoomCode = ''; }   // v1.39 房间码一次性
      /* v1.37 续连：不进等待室、不重开局 —— 主机补一帧快照，客机要一份，接着打 */
      if (net.relinking){
        net.relinking = false;
        netConnStop();
        netRtt = 0; netMiss = 0; netAlive = true; netWaiting = false; netDropT = 0;
        netSelfAway = false; netFoeAway = false; netAwayPaused = false;
        hideOverlay();
        if (sim && !sim.over && (mode === 'paused' || mode === 'over')) mode = 'playing';
        if (net.role === 'host'){ net.pushSnapshot(); setHint('已重新连接 · 对局继续'); }
        else { net.send({ t: 'resnap' }); setHint('已重新连接 · 正在同步战局…'); }
        return;
      }
      /* v1.13：连接建立 → 进等待室（准备/战绩/动态 log），不再立即开局 */
      netConnStop(); netStat('已连接 · 进入等待室…', false);        // v1.26：撤掉连接播报
      net.lobbyReset();
      netRtt = 0; netMiss = 0; netAlive = true; netWaiting = false; netDropT = 0;   // v1.26 心跳归零
      netSelfAway = false; netFoeAway = false; netAwayPaused = false;               // v1.35 离开页面状态归零
      net.showNetLobby();
      net.lobbyLog(net.role === 'host' ? '对手已加入房间' : '已连接 · 等待房主确认');
      net.send({ t: 'info', w: netRec.w, l: netRec.l });                     // v1.26 展示的是联机战绩
      if (net.role === 'host') net.send({ t: 'cfg', size: netCfg.size, prod: netCfg.prod, timeLimit: netCfg.timeLimit });
    };
    ch.onclose = function(){ net.dropped('连接已断开'); };
    ch.onmessage = function(e){ net.onMsg(e.data); };
  },
  /* v1.26：断线原因显式化 —— 用户看到的不再是笼统的「断连」，而是「为什么断」 */
  dropped: function(reason){
    netLastRole = this.role !== 'none' ? this.role : netLastRole;   // v1.37：续连要知道自己原来是房主还是客机
    netLastRole = this.role !== 'none' ? this.role : netLastRole;   // v1.37：续连要知道自己原来是房主还是客机
    this.relinking = false;                      // v1.37：续连途中又断了 → 本次续连作废
    this.pc = null; this.ch = null;
    var wasInGame = mode === 'playing' || mode === 'paused';
    var wasLobby = this.inLobby && mode === 'menu';
    var why = reason || '连接已断开';
    netConnStop(); netWaiting = false; netDropT = 0; netAlive = true; netMiss = 0;
    netSelfAway = false; netFoeAway = false; netAwayPaused = false;      // v1.35
    this.role = netRole = 'none';
    this.lobbyReset(); this.inLobby = false;
    if (wasInGame){
      mode = 'over';
      showOverlay('<h1>断<i>·</i>连</h1><div class="motto">墨迹已散 · 对局终止</div>' +
        '<div class="rstat" style="color:var(--cinnabar)">' + why + '</div>' +
        /* v1.37：断线不该只能认输 —— 双方各自点「重新连接」再互换一次码即可续上本局 */
        '<div class="btnrow"><button class="bb pri" id="btnRelink2">重新连接</button>' +
        '<button class="bb" id="btnMenu3">返回菜单</button></div>');

  teardown: function(){
    netConnStop();
    netLastRole = this.role !== 'none' ? this.role : netLastRole;   // v1.37：续连要保持原角色
    netSelfAway = false; netFoeAway = false; netAwayPaused = false;      // v1.35
    /* 注意：这里**不能**清 relinking —— relinkUI() 就是「先置 relinking 再走 hostRoom/joinUI」，

    if (this.ch){ try { this.ch.onclose = null; this.ch.close(); } catch (e){} }
    if (this.pc){ try { this.pc.close(); } catch (e){} }

  },
  send: function(obj){

  },
  /* v1.26：seed / size 可显式指定 —— 等待室里房主选的地图与限时，以及自动化测试的双机闭环都要用 */
  hostRestart: function(seed, size, diff, goal){
    if (this.role !== 'host') return;
    this.lobbyReset(); this.inLobby = false;
    netAgain.me = false; netAgain.foe = false; netAgain.t = 0; netPauseT = 0;   // v1.26 请求状态复位
    if (!goal && netCfg.timeLimit) goal = { type: 'time', sec: netCfg.timeLimit };
    var opts = { mode: 'pvp', opponents: 1, castles: size || cfg.size, diff: diff || netCfg.diff, noAI: true, self: 1,
                 seed: seed != null ? seed : (Math.random() * 1e9) | 0 };
    if (goal) opts.goal = goal;
    if (netCfg.prod !== 1) opts.custom = { prodMul: netCfg.prod };       // v1.26 节奏（产兵倍率）
    startGame(opts);
    netEvts = [];
    this.send({ t: 'start', seed: opts.seed, size: opts.castles, diff: opts.diff, goal: opts.goal || null,
                prod: netCfg.prod });

  },
  pushSnapshot: function(){
    if (!this.ch || this.ch.readyState !== 'open' || !sim) return;
    this.send({
      t: 'st', tm: +sim.t.toFixed(2), ov: sim.over,
      rt: [0, +sim.effects.rushT[1].toFixed(1), +sim.effects.rushT[2].toFixed(1)],
      /* v1.26：断粮 / 屯田剩余秒数随快照下发 —— 客机航位推算走 Sim.armySpeed，它要读 slowT；
         缺了它客机在断粮期间会按原速推算、位置持续超前再被快照硬拉回（肉眼可见的抖动）。 */
      fx: [0, +(sim.effects.slowT[1] || 0).toFixed(1), +(sim.effects.slowT[2] || 0).toFixed(1)],
      pt: [0, +(sim.effects.prodT[1] || 0).toFixed(1), +(sim.effects.prodT[2] || 0).toFixed(1)],
      st: [0, sim.effects.starT[1] > 0 ? +sim.effects.starMul[1].toFixed(2) : 0,
              sim.effects.starT[2] > 0 ? +sim.effects.starMul[2].toFixed(2) : 0],
      /* cs 行尾追加四个字段（v1.26）：ambushT / ambushN / plagueT / 塔是否临时 —— 尾部追加保证新旧版本可互解 */
      cs: sim.castles.map(function(c){ return [c.owner, c.level, +c.garrison.toFixed(1), +(c.shieldT > 0), +(c.weakT > 0), +(c.flashT > 0), +(c.buffT > 0), +(c.hitT > 0),
                towerIdx(c.tower ? c.tower.kind : null), c.tower ? c.tower.lv : 0, c.tower ? +c.tower.cd.toFixed(1) : 0,
                +(c.ambushT || 0).toFixed(1), Math.round(c.ambushN || 0), +(c.plagueT || 0).toFixed(1),
                c.tower && c.tower.temp ? +c.tower.tempT.toFixed(1) : 0]; }),
      ar: sim.armies.map(function(a){ return [a.id, a.owner, a.count, +a.x.toFixed(1), +a.y.toFixed(1), +a.tx.toFixed(1), +a.ty.toFixed(1), a.tKind === 'c' ? 1 : 0, a.tid, a.srcId, +(a.atkT > 0)]; }),
      cp: sim.camps.map(function(p){ return [p.id, p.owner, Math.round(p.count), +p.x.toFixed(1), +p.y.toFixed(1), +(p.atkT > 0)]; }),
      ink: [0, +sim.ink[1].toFixed(1), +sim.ink[2].toFixed(1)],
      hd: { 1: sim.hands[1].slice(), 2: sim.hands[2].slice() },
      cd: [sim.cardCd[1], sim.cardCd[2]],                // v1.18：同名卡冷却表随快照同步（客机卡面显示）
      pl: pileCounts(sim, 1).concat(pileCounts(sim, 2)),   // v1.14：抽/弃/消 三堆计数（1、2 号各 3 个）
      cap: [sim.stats.capturedBy[1] || 0, sim.stats.capturedBy[2] || 0, sim.stats.cardsUsed || 0],
      ev: netEvts.splice(0, netEvts.length),
    });
  },
  onMsg: function(raw){
    var d;
    try { d = JSON.parse(raw); } catch (e){ return; }
    /* v1.26 心跳：任何下行包都证明链路还活着（DataChannel.onclose 在异常网络下可能长时间不触发） */
    netMiss = 0;
    if (!netAlive){ netAlive = true; netResume(); }
    if (d.t === 'pg'){ this.send({ t: 'po', s: d.s }); return; }
    if (d.t === 'po'){
      var sent = this.pingSent[d.s];
      if (sent != null){ netRtt = Math.max(1, Math.round(Date.now() - sent)); delete this.pingSent[d.s]; }
      return;
    }
    if (d.t === 'start'){
      if (this.role === 'guest'){
        this.lobbyReset(); this.inLobby = false;
        if (d.size) netCfg.size = d.size;                       // v1.26：房主选的地图/难度/限时为准
        if (d.diff) netCfg.diff = d.diff;
        if (d.prod != null) netCfg.prod = d.prod;
        netCfg.timeLimit = d.goal && d.goal.sec ? d.goal.sec : 0;
        netAgain.me = false; netAgain.foe = false; netAgain.t = 0; netPauseT = 0;
        startGame({ mode: 'pvp', opponents: 1, castles: netCfg.size, diff: netCfg.diff, noAI: true, self: 2,
                    seed: d.seed, goal: d.goal || null,
                    custom: netCfg.prod !== 1 ? { prodMul: netCfg.prod } : null });
      }
      return;
    }
    if (d.t === 'info'){                        // 等待室：对手生涯战绩（v1.13）
      this.lobby.foeW = d.w || 0; this.lobby.foeL = d.l || 0;
      this.lobbyLog('对手已就位 · 生涯 ' + (d.w || 0) + '胜' + (d.l || 0) + '负');
      if (this.inLobby && mode === 'menu') this.showNetLobby();
      return;
    }
    if (d.t === 'ready'){                       // 等待室：对手准备状态（v1.13）
      if (mode !== 'menu') return;
      this.lobby.foe = !!d.on;
      this.lobbyLog(d.on ? '对手已准备' : '对手取消了准备');
      if (this.inLobby) this.showNetLobby();
      this.checkLobbyStart();
      return;
    }
    if (d.t === 'pause'){
      if (this.role !== 'guest') return;
      if (d.on && mode === 'playing'){ mode = 'paused'; showOverlay('<h1>暂<i>·</i>停</h1><div class="motto">房主暂停了对局</div>'); }
      else if (!d.on && mode === 'paused'){ mode = 'playing'; hideOverlay(); }
      return;
    }
    if (d.t === 'cfg'){                         // v1.26：房主在等待室改规则，客机实时同步（只读）
      if (this.role !== 'guest') return;
      if (d.size) netCfg.size = d.size;
      if (d.prod != null) netCfg.prod = d.prod;
      netCfg.timeLimit = d.timeLimit || 0;
      this.lobbyLog('房主调整规则：' + netCfg.size + ' 城 · 节奏 ×' + netCfg.prod + ' · ' +
                    (netCfg.timeLimit ? netCfg.timeLimit / 60 + ' 分钟限时' : '不限时'));
      if (this.inLobby && mode === 'menu') this.showNetLobby();
      return;
    }
    if (d.t === 'pausereq'){                    // v1.26：客机可请求暂停，决定权仍在房主
      if (this.role !== 'host' || mode !== 'playing') return;
      setHint('对手请求暂停 · 点「‖ 暂停」同意，或直接继续');
      return;
    }
    if (d.t === 'again'){
      netAgain.foe = true; netAgain.t = 0;      // v1.26：再战双向确认，不再由一方单方面发车
      if (this.role === 'host'){
        if (netAgain.me) this.hostRestart();
        else setHint('对手请求再战 · 点「再来一局」开始');
      }
      return;
    }
    if (d.t === 'cmd'){
      if (this.role !== 'host' || !sim || sim.over) return;
      /* v1.35 权威校验：**不信任网络里的 owner / type 字段** —— 一律按「客机 = 2 号阵营」重建指令，
         块1 各指令还会再按 owner 校验来源（城池 / 阵列 / 部队归属），伪造 owner=1 到此为止。
         （v1.35 之前 send / split / retarget 直接用 d.cmd，客机可以伪造房主的兵令） */
      var G = 2, cm = d.cmd || {};
      var ratio01 = function(v){ v = +v; if (!(v >= 0)) v = 1; return v > 1 ? 1 : v; };
      if (d.kind === 'send'){
        if (!cm.from || !cm.to) return;
        Sim.command(sim, { type: 'send', owner: G, from: cm.from, to: cm.to,
                           ratio: ratio01(cm.ratio == null ? 1 : cm.ratio),
                           n: cm.n != null ? Math.max(0, +cm.n) : undefined });
      } else if (d.kind === 'retarget'){
        if (!cm.ids || !cm.to) return;
        Sim.command(sim, { type: 'retarget', owner: G, ids: cm.ids, to: cm.to });
      } else if (d.kind === 'split'){
        Sim.command(sim, { type: 'split', owner: G, armyId: cm.armyId, to: cm.to,
                           n: Math.max(1, +cm.n || 1), pt: cm.pt || null,
                           ph: cm.ph != null ? cm.ph : null });
      } else if (d.kind === 'allout') Sim.command(sim, { type: 'allout', owner: G, targetId: d.targetId });
      else if (d.kind === 'castleUp') Sim.command(sim, { type: 'castleUp', owner: G, id: cm.id });
      else if (d.kind === 'card') Sim.cardPlay(sim, d.slot, d.target === -1 ? undefined : d.target, G);
      return;
    }
    if (d.t === 'away'){ netFoeAwaySet(!!d.on); return; }          // v1.35 对手离开/回到页面
    if (d.t === 'resnap'){ if (this.role === 'host') this.pushSnapshot(); return; }   // v1.35 客机回来要快照
    if (d.t === 'st'){
      if (this.role === 'guest' && sim) applySnapshot(d);
    }
  },
};
/* 客机：把主机快照写入本地镜像（地图由同种子生成，城池 id/坐标一致） */
function applySnapshot(d){
  var i, c, o;
  sim.t = d.tm; sim.over = d.ov;
  for (o = 1; o <= 2; o++){
    sim.effects.rushT[o] = d.rt ? (d.rt[o] || 0) : 0;
    sim.effects.starT[o] = d.st && d.st[o] > 0 ? 1 : 0;
    sim.effects.starMul[o] = d.st && d.st[o] > 0 ? d.st[o] : 1;
    /* v1.26：断粮 / 屯田 —— 尤其 slowT，缺了它客机航位推算速度就是错的 */
    sim.effects.slowT[o] = d.fx ? (d.fx[o] || 0) : 0;
    sim.effects.prodT[o] = d.pt ? (d.pt[o] || 0) : 0;
  }
  for (i = 0; i < d.cs.length && i < sim.castles.length; i++){
    c = sim.castles[i];
    c.owner = d.cs[i][0]; c.level = d.cs[i][1]; c.garrison = d.cs[i][2];
    c.shieldT = d.cs[i][3] ? 1 : 0; c.weakT = d.cs[i][4] ? 1 : 0; c.flashT = d.cs[i][5] ? 0.3 : 0;
    c.buffT = d.cs[i][6] ? 1 : 0; c.hitT = d.cs[i][7] ? 0.25 : 0;
    c.ambushT = d.cs[i][11] || 0; c.ambushN = d.cs[i][12] || 0; c.plagueT = d.cs[i][13] || 0;   // v1.26
    var tk = towerKind(d.cs[i][8] || 0);                     // 塔随快照同步（客机不跑模拟）
    c.tower = tk ? { kind: tk, lv: d.cs[i][9] || 1, cd: d.cs[i][10] || 0 } : null;
    if (c.tower && d.cs[i][14] > 0){ c.tower.temp = true; c.tower.tempT = d.cs[i][14]; }        // v1.26 临时塔
  }
  /* v1.26：重建部队前先留一份旧坐标当插值起点（软目标 = 快照位置，由 loop 每帧收敛） */
  var oldPos = {};
  for (i = 0; i < sim.armies.length; i++) oldPos[sim.armies[i].id] = [sim.armies[i].x, sim.armies[i].y];
  sim.armies = d.ar.map(function(r){
    var a = { id: r[0], owner: r[1], count: r[2], x: r[3], y: r[4], tx: r[5], ty: r[6], tKind: r[7] ? 'c' : 'pt', tid: r[8], srcId: r[9], hx: r[3], hy: r[4], atkT: r[10] ? 0.3 : 0 };
    /* v1.26 软纠正：记住快照位置当软目标，起点留在旧位置，由 loop 每帧往软目标收敛 —— 抹掉瞬移抖动 */
    a.sx = r[3]; a.sy = r[4];
    var op = oldPos[a.id];
    if (op){ a.x = op[0]; a.y = op[1]; }
    return a;
  });
  sim.camps = d.cp.map(function(r){
    return { id: r[0], owner: r[1], count: r[2], x: r[3], y: r[4], atkT: r[5] ? 0.35 : 0 };
  });
  sim.ink[1] = d.ink[1]; sim.ink[2] = d.ink[2];
  if (d.cd){ sim.cardCd[1] = d.cd[0] || {}; sim.cardCd[2] = d.cd[1] || {}; }   // v1.18：卡牌冷却
  sim.hands[1] = d.hd[1]; sim.hands[2] = d.hd[2];
  sim.hand = sim.hands[1];
  if (d.pl){                                   // v1.14：客机同步三堆计数（前 3 个为 1 号，后 3 个为 2 号）
    if (sim.piles[1]){ sim.piles[1].hand = d.hd[1]; syncPiles(sim.piles[1], d.pl.slice(0, 3)); }
    if (sim.piles[2]){ sim.piles[2].hand = d.hd[2]; syncPiles(sim.piles[2], d.pl.slice(3, 6)); }
  }
  /* 客机不跑模拟：三堆只同步计数（见下方 syncPiles / pileNums） */
  sim.stats.capturedBy[1] = d.cap[0]; sim.stats.capturedBy[2] = d.cap[1]; sim.stats.cardsUsed = d.cap[2];
  pruneSelection();
  if (d.ev && d.ev.length) handleEvents(d.ev);
  if (d.ov && mode === 'playing') endGame();
}

/* ===== 调试钩子（仅 ?debug 生效）：供自动化测试泵动模拟与读取状态 ===== */
if (location.search.indexOf('debug') >= 0){
  var netSentLog = [];                                     // v1.35：测试捕获上行包用
  window.__ink = {
    mode: function(){ return mode; },
    side: function(){ return mySide; },                     // v1.38：玩家阵营（真机诊断里区分敌我需要）
    sim: function(){ return mode === 'menu' ? menuSim : sim; },
    side: function(){ return mySide; },
    ver: function(){ return APP_VER; },                                     // v1.35 版本号（发布核对用）
    net: function(){ return netRole; },
    step: function(secs){
      if (mode !== 'playing') return 0;
      var n = Math.round(secs * 30), i;
      for (i = 0; i < n && !sim.over; i++) Sim.step(sim, STEP);
      drainEvents();
      updateHud(true);                  // 与真实主循环一致：步进后刷新 HUD
      if (sim.over) endGame();
      return n;
    },
    sel: function(){ return selection; },
    /* v1.37：浏览器里直接下军令（tools/check-net.js 端到端实测用）。
       Sim 在块2 是 IIFE 局部变量，页面外拿不到，只能走钩子。 */
    cmd: function(o){ if (!sim) return false; Sim.command(sim, o); return true; },
    fx: function(){ return { floats: floats, fxs: fxs, bolts: bolts }; },   // 表现层特效（v1.12 含塔火弹道）
