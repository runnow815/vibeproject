<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋 · 古典棋韵</title>
<style>
  /* ===== 全局重置 & 基础 ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "STKaiti", "KaiTi", "楷体", "Noto Serif SC", serif;
    background: #f5f0e0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(200,180,150,0.15) 0%, transparent 70%),
      radial-gradient(ellipse at 80% 50%, rgba(200,180,150,0.15) 0%, transparent 70%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #2c1810;
    user-select: none;
    padding: 20px;
  }

  /* ===== 主容器 ===== */
  .container {
    background: #faf6ee;
    border-radius: 12px;
    box-shadow:
      0 8px 32px rgba(44,24,16,0.12),
      0 2px 8px rgba(44,24,16,0.08);
    padding: 28px 32px 24px;
    max-width: 920px;
    width: 100%;
    position: relative;
  }

  /* ===== 装饰边框 ===== */
  .container::before,
  .container::after {
    content: '';
    position: absolute;
    left: 12px; right: 12px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c0392b, transparent);
    opacity: 0.4;
  }
  .container::before { top: 8px; }
  .container::after  { bottom: 8px; }

  /* ===== 头部标题 ===== */
  .header {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
  }
  .header h1 {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 12px;
    color: #2c1810;
    text-shadow: 0 1px 2px rgba(0,0,0,0.10);
  }
  .header .subtitle {
    font-size: 13px;
    color: #8a7a6a;
    letter-spacing: 6px;
    margin-top: 2px;
    font-style: italic;
  }
  .header::after {
    content: '';
    display: block;
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c0392b, transparent);
    margin: 8px auto 0;
    opacity: 0.5;
  }

  /* ===== 主内容区：棋盘 + 面板 ===== */
  .main-area {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  /* ===== 棋盘容器 ===== */
  .board-wrapper {
    flex-shrink: 0;
    padding: 6px;
    background: linear-gradient(135deg, #a08060, #8a6e4e);
    border-radius: 6px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.15),
      0 3px 10px rgba(0,0,0,0.2);
  }
  .board-inner {
    background: #e8c87a;
    background-image:
      repeating-linear-gradient(
        90deg,
        transparent, transparent 40px,
        rgba(160,128,70,0.08) 40px, rgba(160,128,70,0.08) 41px
      ),
      repeating-linear-gradient(
        0deg,
        transparent, transparent 60px,
        rgba(160,128,70,0.06) 60px, rgba(160,128,70,0.06) 61px
      );
    border-radius: 4px;
    cursor: pointer;
  }
  #boardCanvas {
    display: block;
    /* 视口宽高双重约束（坐标换算已按 rect 缩放比适配，缩小不失真） */
    width: min(534px, 92vw, calc(100vh - 200px));
    height: auto;
    border-radius: 4px;
  }

  /* ===== 右侧面板 ===== */
  .side-panel {
    flex: 1;
    min-width: 220px;
    max-width: 270px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ===== 计时器区 ===== */
  .timer-section {
    background: #f8f4ec;
    border: 1px solid #e0d5c5;
    border-radius: 6px;
    padding: 12px 14px;
  }
  .timer-section .section-title {
    font-size: 13px;
    color: #8a7a6a;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .timer-row {
    display: flex;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed #e8e0d4;
    transition: background 0.2s;
  }
  .timer-row:last-child { border-bottom: none; }
  .timer-row.active-turn {
    background: rgba(192,57,43,0.06);
    border-radius: 4px;
    padding: 6px 4px;
  }
  .timer-stone {
    width: 20px; height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 8px;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .timer-stone.black {
    background: radial-gradient(circle at 35% 35%, #555, #111 70%, #000);
  }
  .timer-stone.white {
    background: radial-gradient(circle at 35% 35%, #fff, #e8e8e8 60%, #ccc);
  }
  .timer-label {
    font-size: 15px;
    flex: 1;
  }
  .timer-display {
    font-size: 18px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    min-width: 70px;
    text-align: right;
  }
  .timer-display.low-time {
    color: #c0392b;
    animation: pulse-red 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse-red {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }
  .timer-display.stopped {
    color: #aaa;
  }
  .timer-total {
    font-size: 12px;
    color: #aaa;
    font-weight: 400;
  }

  /* ===== 对战模式 ===== */
  .mode-section {
    background: #f8f4ec;
    border: 1px solid #e0d5c5;
    border-radius: 6px;
    padding: 10px 12px 12px;
  }
  .mode-section .section-title {
    font-size: 13px;
    color: #8a7a6a;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .mode-row {
    display: flex;
    gap: 6px;
  }
  .mode-btn {
    flex: 1;
    padding: 6px 0;
    border: 1px solid #d0c0a8;
    border-radius: 4px;
    background: #faf6ee;
    color: #2c1810;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .mode-btn:hover {
    background: #e8dcc8;
    border-color: #b0a090;
  }
  .mode-btn.active {
    background: #c0392b;
    border-color: #a03020;
    color: #fff;
  }
  .option-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    margin-top: 9px;
    font-size: 13px;
    color: #5a4a3a;
  }
  .option-row label {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }
  .option-row input[type="checkbox"] {
    accent-color: #c0392b;
    cursor: pointer;
  }
  .option-row select {
    font-family: inherit;
    font-size: 12px;
    border: 1px solid #d0c0a8;
    border-radius: 4px;
    background: #faf6ee;
    color: #2c1810;
    padding: 1px 2px;
    cursor: pointer;
  }

  /* ===== 回合记录 ===== */
  .history-section {
    flex: 1;
    background: #f8f4ec;
    border: 1px solid #e0d5c5;
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .history-section .section-title {
    font-size: 13px;
    color: #8a7a6a;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .history-list {
    overflow-y: auto;
    max-height: 220px;
    font-size: 14px;
    line-height: 1.8;
    padding-right: 4px;
  }
  .history-list::-webkit-scrollbar {
    width: 4px;
  }
  .history-list::-webkit-scrollbar-thumb {
    background: #d0c8bc;
    border-radius: 2px;
  }
  .history-item {
    padding: 1px 6px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .history-item:hover {
    background: #ede8de;
  }
  .history-item.active {
    background: rgba(192,57,43,0.10);
    color: #c0392b;
  }
  .history-item .move-num {
    color: #aaa;
    font-size: 12px;
    min-width: 32px;
    text-align: right;
  }
  .history-item .move-stone {
    font-size: 12px;
    min-width: 14px;
    text-align: center;
  }
  .history-item .move-coord {
    font-size: 13px;
  }
  .history-placeholder {
    color: #bbb;
    text-align: center;
    font-size: 13px;
    padding: 20px 0;
  }

  /* ===== 操作按钮 ===== */
  .controls {
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    padding: 8px 0;
    border: 1px solid #d0c0a8;
    border-radius: 4px;
    background: #f5f0e8;
    color: #2c1810;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover:not(:disabled) {
    background: #e8dcc8;
    border-color: #b0a090;
  }
  .btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-primary {
    background: #c0392b;
    border-color: #a03020;
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) {
    background: #a03020;
    border-color: #802010;
  }

  /* ===== 战绩统计 ===== */
  .stats-section {
    background: #f8f4ec;
    border: 1px solid #e0d5c5;
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 14px;
  }
  .stats-section .stat-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stats-section .stat-dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12);
  }
  .stats-section .stat-dot.black { background: radial-gradient(circle at 35% 35%, #555, #111); }
  .stats-section .stat-dot.white { background: radial-gradient(circle at 35% 35%, #fff, #e8e8e8); }
  .stats-section .stat-num {
    font-weight: 500;
    min-width: 16px;
    text-align: center;
  }

  /* ===== 底部状态栏 ===== */
  .status-bar {
    margin-top: 14px;
    padding: 8px 16px;
    background: #f8f4ec;
    border: 1px solid #e0d5c5;
    border-radius: 6px;
    text-align: center;
    font-size: 16px;
    letter-spacing: 2px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .status-bar .status-stone {
    display: inline-block;
    width: 18px; height: 18px;
    border-radius: 50%;
    vertical-align: middle;
    border: 1px solid rgba(0,0,0,0.12);
  }
  .status-bar .status-stone.black { background: radial-gradient(circle at 35% 35%, #555, #111 70%, #000); }
  .status-bar .status-stone.white { background: radial-gradient(circle at 35% 35%, #fff, #e8e8e8 60%, #ccc); }
  .status-bar.win {
    background: #faf0e8;
    border-color: #c0392b;
    color: #c0392b;
    font-weight: 500;
  }
  .status-bar.draw {
    background: #f0ece4;
    border-color: #8a7a6a;
    color: #6a5a4a;
  }

  /* ===== 胜利高亮标记 ===== */
  .win-indicator {
    display: inline-block;
    background: #c0392b;
    color: #fff;
    font-size: 11px;
    padding: 0 6px;
    border-radius: 3px;
    margin-left: 4px;
    letter-spacing: 1px;
  }

  /* ===== 响应式断点 ===== */
  @media (max-width: 820px) {
    .main-area {
      flex-direction: column;
      align-items: center;
    }
    .side-panel {
      max-width: 100%;
      width: 100%;
      min-width: 0;
    }
    .history-list {
      max-height: 150px;
    }
    .container {
      padding: 16px;
    }
    .header h1 {
      font-size: 26px;
      letter-spacing: 8px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 标题 -->
  <div class="header">
    <h1>五 子 棋</h1>
    <div class="subtitle">— 古典棋韵 —</div>
  </div>

  <!-- 主区域 -->
  <div class="main-area">

    <!-- 棋盘 -->
    <div class="board-wrapper">
      <div class="board-inner">
        <canvas id="boardCanvas"></canvas>
      </div>
    </div>

    <!-- 侧边面板 -->
    <div class="side-panel">

      <!-- 对战模式 -->
      <div class="mode-section">
        <div class="section-title">— 对 弈 —</div>
        <div class="mode-row">
          <button class="mode-btn" data-mode="pvp">双人对弈</button>
          <button class="mode-btn" data-mode="ai_black">人机·我执黑</button>
          <button class="mode-btn" data-mode="ai_white">人机·我执白</button>
        </div>
        <div class="option-row">
          <label><input type="checkbox" id="optForbidden">黑棋禁手</label>
          <label><input type="checkbox" id="optTimed">计时</label>
          <label><input type="checkbox" id="optSound">音效</label>
          <label>棋力
            <select id="aiDifficulty">
              <option value="easy">简单</option>
              <option value="normal" selected>中等</option>
              <option value="hard">困难</option>
            </select>
          </label>
        </div>
      </div>

      <!-- 计时器 -->
      <div class="timer-section">
        <div class="section-title">— 时 计 —</div>
        <div id="blackTimer" class="timer-row active-turn">
          <div class="timer-stone black"></div>
          <span class="timer-label">黑方</span>
          <span class="timer-display" id="blackTimeDisplay">15:00</span>
        </div>
        <div id="whiteTimer" class="timer-row">
          <div class="timer-stone white"></div>
          <span class="timer-label">白方</span>
          <span class="timer-display" id="whiteTimeDisplay">15:00</span>
        </div>
      </div>

      <!-- 回合记录 -->
      <div class="history-section">
        <div class="section-title">— 回合记录 —</div>
        <div class="history-list" id="historyList">
          <div class="history-placeholder">棋局尚未开始</div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="controls">
        <button class="btn" id="undoBtn" disabled>悔 棋</button>
        <button class="btn btn-primary" id="newGameBtn">新 局</button>
      </div>

      <!-- 战绩统计 -->
      <div class="stats-section" id="statsSection">
        <div class="stat-item">
          <span class="stat-dot black"></span>
          <span>黑胜</span>
          <span class="stat-num" id="blackWins">0</span>
        </div>
        <div class="stat-item">
          <span style="color:#aaa;">平</span>
          <span class="stat-num" id="drawCount">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-dot white"></span>
          <span>白胜</span>
          <span class="stat-num" id="whiteWins">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar">
    <span class="status-stone black"></span> 黑方落子
  </div>

</div>

<script>
(function() {
  'use strict';

  // ============================================================
  //  常量
  // ============================================================
  const BOARD_SIZE = 15;
  const CELL_SIZE = 36;
  const PADDING   = 30;
  const STONE_RADIUS = CELL_SIZE * 0.44;
  const TOTAL_TIME = 15 * 60; // 15 分钟（秒）

  const EMPTY = 0, BLACK = 1, WHITE = 2;

  // 四个判定方向（胜负判定 / AI / 禁手共用）
  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

  // 对局设置（localStorage 持久化）
  let settings = { mode: 'pvp', difficulty: 'normal', forbidden: false, timed: true, sound: true };

  // 星位（0-indexed）
  const STAR_POINTS = [
    [3,3], [3,7], [3,11],
    [7,3], [7,7], [7,11],
    [11,3],[11,7],[11,11]
  ];

  // DOM 缓存
  const canvas   = document.getElementById('boardCanvas');
  const ctx      = canvas.getContext('2d');
  const blackTD  = document.getElementById('blackTimeDisplay');
  const whiteTD  = document.getElementById('whiteTimeDisplay');
  const histList = document.getElementById('historyList');
  const undoBtn  = document.getElementById('undoBtn');
  const newBtn   = document.getElementById('newGameBtn');
  const statusEl = document.getElementById('statusBar');
  const bwEl     = document.getElementById('blackWins');
  const wwEl     = document.getElementById('whiteWins');
  const dwEl     = document.getElementById('drawCount');
  const blackTR  = document.getElementById('blackTimer');
  const whiteTR  = document.getElementById('whiteTimer');
  const modeBtns = document.querySelectorAll('.mode-btn');
  const optForbidden = document.getElementById('optForbidden');
  const optTimed = document.getElementById('optTimed');
  const optSound = document.getElementById('optSound');
  const aiDifficultySel = document.getElementById('aiDifficulty');

  const canvasSize = PADDING * 2 + (BOARD_SIZE - 1) * CELL_SIZE;
  canvas.width  = canvasSize;
  canvas.height = canvasSize;

  // ============================================================
  //  游戏状态
  // ============================================================
  const state = {
    board: [],          // 15×15, 0/1/2
    current: BLACK,     // 当前走棋方
    moves: [],          // [{ r, c, player }, ...]
    gameOver: false,
    winner: EMPTY,
    winLine: [],        // 获胜五子坐标 [{r,c}, ...]
    blackTime: TOTAL_TIME,
    whiteTime: TOTAL_TIME,
    timerActive: false,
    timerId: null,
    hoverPos: null,     // {r,c} 或 null
    lastMove: null,     // {r,c} 或 null
    selectedHist: -1,   // 回合记录选中下标
    anim: null,         // 落子动画 { r, c, t0, dur }
    aiTimer: null,      // AI 思考定时器
    stats: { black: 0, white: 0, draw: 0 },
  };

  // ============================================================
  //  WebAudio 合成音效
  // ============================================================
  const Sound = {
    ctx: null,
    ensure() {
      if (!settings.sound) return null;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { this.ctx = new AC(); } catch (_) { return null; }
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    tone(freq, dur, type, vol, slideTo) {
      const c = this.ensure();
      if (!c) return;
      try {
        const t0 = c.currentTime;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
        g.gain.setValueAtTime(vol, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(c.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
      } catch (_) {}
    },
    place()    { this.tone(660, 0.07, 'sine', 0.22, 240); },
    forbidden(){ this.tone(200, 0.18, 'square', 0.12, 120); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.2, 'triangle', 0.16), i * 130)); },
  };

  // ============================================================
  //  设置 — localStorage
  // ============================================================
  function loadSettings() {
    try {
      const saved = localStorage.getItem('gomoku_settings_chinese');
      if (saved) Object.assign(settings, JSON.parse(saved));
    } catch (_) { /* ignore */ }
  }

  function saveSettings() {
    try {
      localStorage.setItem('gomoku_settings_chinese', JSON.stringify(settings));
    } catch (_) { /* ignore */ }
  }

  // ============================================================
  //  初始化
  // ============================================================
  function init() {
    loadSettings();
    loadStats();
    syncSettingsUI();
    resetBoard();
    draw();
    updateUI();
  }

  /** 把 settings 同步到面板控件 */
  function syncSettingsUI() {
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === settings.mode));
    optForbidden.checked = !!settings.forbidden;
    optTimed.checked = !!settings.timed;
    optSound.checked = !!settings.sound;
    aiDifficultySel.value = settings.difficulty;
  }

  function resetBoard() {
    state.board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
    state.current = BLACK;
    state.moves = [];
    state.gameOver = false;
    state.winner = EMPTY;
    state.winLine = [];
    state.blackTime = TOTAL_TIME;
    state.whiteTime = TOTAL_TIME;
    state.lastMove = null;
    state.selectedHist = -1;
    state.hoverPos = null;
    state.anim = null;
    clearTimeout(state.aiTimer);
    stopTimer();
    if (settings.timed) {
      state.timerActive = true;
      startTimer();
    }
  }

  // ============================================================
  //  统计 — localStorage
  // ============================================================
  function loadStats() {
    try {
      const saved = localStorage.getItem('gomoku_stats_chinese');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.stats.black = parsed.black || 0;
        state.stats.white = parsed.white || 0;
        state.stats.draw  = parsed.draw  || 0;
      }
    } catch (_) { /* ignore */ }
  }

  function saveStats() {
    try {
      localStorage.setItem('gomoku_stats_chinese', JSON.stringify(state.stats));
    } catch (_) { /* ignore */ }
  }

  // ============================================================
  //  绘制
  // ============================================================
  function draw() {
    ctx.clearRect(0, 0, canvasSize, canvasSize);
    drawBoardBackground();
    drawGrid();
    drawStarPoints();
    drawStones();
    drawLastMoveMarker();
    drawHoverStone();
    drawWinHighlight();
    drawHistoryMarker();
  }

  /** 棋盘背景 — 木纹色渐变 */
  function drawBoardBackground() {
    const gradient = ctx.createLinearGradient(0, 0, canvasSize, canvasSize);
    gradient.addColorStop(0,   '#e8c87a');
    gradient.addColorStop(0.3, '#dfc07a');
    gradient.addColorStop(0.6, '#e5c572');
    gradient.addColorStop(1,   '#dcb868');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvasSize, canvasSize);
  }

  /** 网格线 */
  function drawGrid() {
    ctx.strokeStyle = '#5a3a22';
    ctx.lineWidth = 0.8;

    for (let i = 0; i < BOARD_SIZE; i++) {
      const pos = PADDING + i * CELL_SIZE;
      // 横线
      ctx.beginPath();
      ctx.moveTo(PADDING, pos);
      ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, pos);
      ctx.stroke();
      // 竖线
      ctx.beginPath();
      ctx.moveTo(pos, PADDING);
      ctx.lineTo(pos, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
      ctx.stroke();
    }
  }

  /** 星位（传统围棋星位，朱砂红） */
  function drawStarPoints() {
    ctx.fillStyle = '#c0392b';
    for (const [r, c] of STAR_POINTS) {
      const x = PADDING + c * CELL_SIZE;
      const y = PADDING + r * CELL_SIZE;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /** 所有棋子 */
  function drawStones() {
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        if (state.board[r][c] !== EMPTY) {
          let scale = 1;
          if (state.anim && state.anim.r === r && state.anim.c === c) {
            const p = Math.min(1, (performance.now() - state.anim.t0) / state.anim.dur);
            scale = easeOutBack(p);
          }
          drawStone(r, c, state.board[r][c], 1, scale);
        }
      }
    }
  }

  /** 落子回弹缓动 */
  function easeOutBack(p) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  }

  /** 启动落子动画（rAF 循环重绘） */
  function startPlaceAnim(r, c) {
    state.anim = { r, c, t0: performance.now(), dur: 200 };
    requestAnimationFrame(function animLoop() {
      if (!state.anim) return;
      draw();
      if (performance.now() - state.anim.t0 < state.anim.dur) {
        requestAnimationFrame(animLoop);
      } else {
        state.anim = null;
        draw();
      }
    });
  }

  /** 单个棋子 */
  function drawStone(r, c, player, alpha, scale) {
    const x = PADDING + c * CELL_SIZE;
    const y = PADDING + r * CELL_SIZE;
    const radius = STONE_RADIUS * (scale === undefined ? 1 : Math.max(0.05, scale));

    ctx.save();
    ctx.globalAlpha = alpha;

    // 阴影
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;

    if (player === BLACK) {
      const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 2, x, y, radius);
      grad.addColorStop(0,   '#666');
      grad.addColorStop(0.3, '#333');
      grad.addColorStop(0.8, '#111');
      grad.addColorStop(1,   '#000');
      ctx.fillStyle = grad;
    } else {
      const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 2, x, y, radius);
      grad.addColorStop(0,   '#ffffff');
      grad.addColorStop(0.3, '#f5f5f5');
      grad.addColorStop(0.8, '#e0e0e0');
      grad.addColorStop(1,   '#c8c8c8');
      ctx.fillStyle = grad;
    }

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    // 白棋加边框
    if (player === WHITE) {
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    ctx.restore();
  }

  /** 上一步标记 — 小朱砂红点 */
  function drawLastMoveMarker() {
    if (!state.lastMove) return;
    const { r, c } = state.lastMove;
    if (state.board[r][c] === EMPTY) return;
    const x = PADDING + c * CELL_SIZE;
    const y = PADDING + r * CELL_SIZE;
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  /** 鼠标悬停预览 */
  function drawHoverStone() {
    if (!state.hoverPos) return;
    if (state.gameOver) return;
    if (isAITurn()) return;
    const { r, c } = state.hoverPos;
    if (state.board[r][c] !== EMPTY) return;

    // 黑棋禁手点：淡子 + 朱砂叉提示
    if (settings.forbidden && state.current === BLACK && isForbiddenMove(r, c)) {
      drawStone(r, c, state.current, 0.15);
      const x = PADDING + c * CELL_SIZE;
      const y = PADDING + r * CELL_SIZE;
      const s = STONE_RADIUS * 0.6;
      ctx.save();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(192,57,43,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
      ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
      ctx.stroke();
      ctx.restore();
      return;
    }

    drawStone(r, c, state.current, 0.35);
  }

  /** 获胜五子高亮 — 朱砂红光圈 */
  function drawWinHighlight() {
    if (state.winLine.length === 0) return;
    for (const { r, c } of state.winLine) {
      const x = PADDING + c * CELL_SIZE;
      const y = PADDING + r * CELL_SIZE;
      ctx.save();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, STONE_RADIUS + 3, 0, Math.PI * 2);
      ctx.stroke();
      // 外层光晕
      ctx.strokeStyle = 'rgba(192,57,43,0.25)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x, y, STONE_RADIUS + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  /** 回合记录点击标记 — 淡红色小圈 */
  function drawHistoryMarker() {
    if (state.selectedHist < 0) return;
    const move = state.moves[state.selectedHist];
    if (!move) return;
    const x = PADDING + move.c * CELL_SIZE;
    const y = PADDING + move.r * CELL_SIZE;
    ctx.save();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(192,57,43,0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(x, y, STONE_RADIUS + 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ============================================================
  //  坐标转换
  // ============================================================
  function getNearestIntersection(mx, my) {
    const col = Math.round((mx - PADDING) / CELL_SIZE);
    const row = Math.round((my - PADDING) / CELL_SIZE);
    if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return null;

    // 距离检测
    const ix = PADDING + col * CELL_SIZE;
    const iy = PADDING + row * CELL_SIZE;
    const dist = Math.hypot(mx - ix, my - iy);
    if (dist > CELL_SIZE * 0.48) return null;

    return { r: row, c: col };
  }

  // ============================================================
  //  事件处理
  // ============================================================
  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      mx: (e.clientX - rect.left) * scaleX,
      my: (e.clientY - rect.top)  * scaleY
    };
  }

  function onCanvasClick(e) {
    if (state.gameOver) return;
    if (isAITurn()) return;   // AI 回合不可落子
    const { mx, my } = getCanvasCoords(e);
    const pos = getNearestIntersection(mx, my);
    if (!pos) return;

    const { r, c } = pos;
    if (state.board[r][c] !== EMPTY) return;

    // 黑棋禁手（简化连珠规则）
    if (settings.forbidden && state.current === BLACK && isForbiddenMove(r, c)) {
      flashForbidden();
      return;
    }

    placeStone(r, c);
  }

  /** 禁手提示（状态栏闪现 + 音效） */
  function flashForbidden() {
    Sound.forbidden();
    statusEl.className = 'status-bar win';
    statusEl.innerHTML = '⛔ 黑棋禁手点，另寻他处';
    clearTimeout(state.forbiddenFlash);
    state.forbiddenFlash = setTimeout(() => {
      if (!state.gameOver) updateUI();
    }, 1200);
  }

  function onCanvasMove(e) {
    const { mx, my } = getCanvasCoords(e);
    const pos = getNearestIntersection(mx, my);
    state.hoverPos = pos;
    draw();
  }

  function onCanvasLeave() {
    state.hoverPos = null;
    draw();
  }

  // ============================================================
  //  核心游戏逻辑
  // ============================================================
  function placeStone(r, c) {
    const player = state.current;

    // 落子
    state.board[r][c] = player;
    state.moves.push({ r, c, player });
    state.lastMove = { r, c };
    state.selectedHist = -1;

    Sound.place();
    startPlaceAnim(r, c);

    // 检查胜负
    const winResult = checkWin(r, c, player);
    if (winResult) {
      state.winLine = winResult;
      state.gameOver = true;
      state.winner = player;
      state.stats[player === BLACK ? 'black' : 'white']++;
      saveStats();
      stopTimer();
      state.timerActive = false;
      Sound.win();
      draw();
      updateUI();
      return;
    }

    // 检查平局
    if (state.moves.length >= BOARD_SIZE * BOARD_SIZE) {
      state.gameOver = true;
      state.winner = EMPTY;
      state.stats.draw++;
      saveStats();
      stopTimer();
      state.timerActive = false;
      draw();
      updateUI();
      return;
    }

    // 换手
    state.current = (player === BLACK) ? WHITE : BLACK;

    // 切换计时（stop → start for next player）
    restartTimer();

    draw();
    updateUI();

    // 若轮到 AI 则接续思考
    scheduleAI();
  }

  /** 四方向检测，返回获胜五子坐标数组或 null */
  function checkWin(r, c, player) {
    const directions = [[1,0], [0,1], [1,1], [1,-1]];

    for (const [dr, dc] of directions) {
      const line = [{ r, c }];

      // 正方向
      for (let step = 1; step < 5; step++) {
        const nr = r + dr * step;
        const nc = c + dc * step;
        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
        if (state.board[nr][nc] !== player) break;
        line.push({ r: nr, c: nc });
      }

      // 负方向
      for (let step = 1; step < 5; step++) {
        const nr = r - dr * step;
        const nc = c - dc * step;
        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
        if (state.board[nr][nc] !== player) break;
        line.push({ r: nr, c: nc });
      }

      if (line.length >= 5) return line;
    }

    return null;
  }

  // ============================================================
  //  AI 引擎 & 禁手判定（简化连珠规则）
  // ============================================================
  function inBoard(r, c) { return r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE; }

  /** 是否轮到 AI（mode: 'ai_black' = 玩家执黑 AI 执白，'ai_white' = 玩家执白 AI 执黑） */
  function isAITurn() {
    if (settings.mode === 'pvp') return false;
    const aiSide = settings.mode === 'ai_black' ? WHITE : BLACK;
    return state.current === aiSide;
  }

  /** 安排 AI 思考（延时落子，可被新局/悔棋打断） */
  function scheduleAI() {
    clearTimeout(state.aiTimer);
    if (state.gameOver || !isAITurn()) return;
    state.aiTimer = setTimeout(() => {
      state.aiTimer = null;
      aiMove();
    }, 350 + Math.random() * 350);
  }

  /** AI 落子入口 */
  function aiMove() {
    if (state.gameOver || !isAITurn()) return;
    const move = aiChooseMove();
    if (!move) return;
    placeStone(move.r, move.c);
  }

  /** 提取以 (r,c) 为中心、方向 (dr,dc) 的 9 格线：1=己方 0=空 2=对方或边界（(r,c) 记 1） */
  function buildLine(b, r, c, dr, dc, player) {
    const line = [];
    for (let k = -4; k <= 4; k++) {
      if (k === 0) { line.push(1); continue; }
      const nr = r + dr * k, nc = c + dc * k;
      if (!inBoard(nr, nc)) { line.push(2); continue; }
      const v = b[nr][nc];
      line.push(v === EMPTY ? 0 : (v === player ? 1 : 2));
    }
    return line;
  }

  function windowsOf(line, size) {
    const res = [];
    for (let i = 0; i + size <= line.length; i++) res.push(line.slice(i, i + size));
    return res;
  }

  /** 5 窗全己方（连五） */
  function hasFive(line) {
    return windowsOf(line, 5).some(w => w.every(v => v === 1));
  }

  /** 活四：_1111_ */
  function hasOpenFour(line) {
    return windowsOf(line, 6).some(w => w[0] === 0 && w[5] === 0 && w.slice(1, 5).every(v => v === 1));
  }

  /** 冲四数量：5 窗内 4 子 1 空 */
  function countRushFour(line) {
    return windowsOf(line, 5).filter(w => w.includes(0) && w.filter(v => v === 1).length === 4).length;
  }

  /** 活三：填一子可成活四 */
  function hasOpenThree(line) {
    for (let i = 0; i < line.length; i++) {
      if (line[i] !== 0) continue;
      line[i] = 1;
      const ok = hasOpenFour(line);
      line[i] = 0;
      if (ok) return true;
    }
    return false;
  }

  /** 5 窗内 3 子 2 空（眠三）数量 */
  function countSleepThree(line) {
    return windowsOf(line, 5).filter(w => !w.includes(2) && w.filter(v => v === 1).length === 3).length;
  }

  /** 单方向棋型分值 */
  function dirScore(line) {
    let s = 0;
    if (hasFive(line)) return 1000000;
    if (hasOpenFour(line)) s += 50000;
    s += Math.min(2, countRushFour(line)) * 8000;
    if (hasOpenThree(line)) s += 6000;
    s += Math.min(3, countSleepThree(line)) * 800;
    // 活二 / 眠二
    if (windowsOf(line, 6).some(w => !w.includes(2) && w.filter(v => v === 1).length === 2)) s += 300;
    else if (windowsOf(line, 5).some(w => !w.includes(2) && w.filter(v => v === 1).length === 2)) s += 120;
    else if (windowsOf(line, 4).some(w => !w.includes(2) && w.filter(v => v === 1).length === 1)) s += 25;
    return s;
  }

  /** 假设 (r,c) 已是 player 的棋子，评估该点四方向棋型总分 */
  function evalPoint(b, r, c, player) {
    let s = 0;
    for (const [dr, dc] of DIRS) s += dirScore(buildLine(b, r, c, dr, dc, player));
    return s;
  }

  /** 候选点：已有棋子 2 格范围内的空点；空盘返回天元 */
  function genCandidates(b) {
    const set = new Set();
    let hasStone = false;
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        if (b[r][c] === EMPTY) continue;
        hasStone = true;
        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            const nr = r + dr, nc = c + dc;
            if (inBoard(nr, nc) && b[nr][nc] === EMPTY) set.add(nr * BOARD_SIZE + nc);
          }
        }
      }
    }
    if (!hasStone) return [{ r: 7, c: 7 }];
    return Array.from(set, v => ({ r: Math.floor(v / BOARD_SIZE), c: v % BOARD_SIZE }));
  }

  /** 按当前难度选出 AI 落点 */
  function aiChooseMove() {
    const b = state.board;
    const me = state.current;
    const opp = me === BLACK ? WHITE : BLACK;
    let pool = genCandidates(b);

    // 开启禁手时 AI 主动规避禁手点
    if (settings.forbidden && me === BLACK) {
      const legal = pool.filter(m => !forbiddenCheck(b, m.r, m.c));
      if (legal.length) pool = legal;
    }

    // 一层评分：进攻 + 防守
    const scored = pool.map(m => {
      b[m.r][m.c] = me;
      const atk = evalPoint(b, m.r, m.c, me);
      b[m.r][m.c] = opp;
      const def = evalPoint(b, m.r, m.c, opp);
      b[m.r][m.c] = EMPTY;
      return { r: m.r, c: m.c, score: atk + def * 0.95 };
    }).sort((a, z) => z.score - a.score);

    if (scored.length === 0) return null;

    if (settings.difficulty === 'easy') {
      // 强噪声：会漏防、会失误
      let best = scored[0], bestN = -Infinity;
      for (const m of scored) {
        const n = m.score * (0.25 + Math.random()) + Math.random() * 10;
        if (n > bestN) { bestN = n; best = m; }
      }
      return best;
    }

    if (settings.difficulty === 'normal') {
      return scored[0];
    }

    // 困难：对前 8 个候选做两层搜索（扣减对手最佳应手的威胁）
    let best = scored[0], bestVal = -Infinity;
    for (const m of scored.slice(0, 8)) {
      b[m.r][m.c] = me;
      let oppBest = 0;
      for (const rp of genCandidates(b)) {
        b[rp.r][rp.c] = opp;
        const v = evalPoint(b, rp.r, rp.c, opp);
        b[rp.r][rp.c] = EMPTY;
        if (v > oppBest) oppBest = v;
        if (oppBest >= 1000000) break;   // 对手可连五，提前终止
      }
      b[m.r][m.c] = EMPTY;
      const val = m.score - oppBest * 0.9;
      if (val > bestVal) { bestVal = val; best = m; }
    }
    return best;
  }

  /** 黑棋禁手检测（简化连珠：长连 / 双四 / 双活三），假设 (r,c) 为空 */
  function isForbiddenMove(r, c) {
    const b = state.board;
    b[r][c] = BLACK;
    const res = forbiddenCheck(b, r, c);
    b[r][c] = EMPTY;
    return res;
  }

  function forbiddenCheck(b, r, c) {
    const lines = DIRS.map(([dr, dc]) => buildLine(b, r, c, dr, dc, BLACK));

    // 长连（六子及以上）禁手
    for (const line of lines) {
      if (line.join('').indexOf('111111') >= 0) return true;
    }
    // 恰好连五即获胜，不算禁手
    for (const line of lines) {
      if (hasFive(line)) return false;
    }
    // 双四禁手（同一方向出现两个冲四也计入）
    let fours = 0;
    for (const line of lines) fours += Math.min(2, countRushFour(line));
    if (fours >= 2) return true;
    // 双活三禁手
    let threes = 0;
    for (const line of lines) {
      if (hasOpenThree(line)) threes++;
    }
    return threes >= 2;
  }

  /** 悔棋 */
  function undoMove() {
    if (state.gameOver) return;
    if (state.moves.length === 0) return;
    clearTimeout(state.aiTimer);

    if (settings.mode !== 'pvp') {
      // 人机模式：若最后一手是 AI，连同玩家那手一起撤销
      const aiSide = settings.mode === 'ai_black' ? WHITE : BLACK;
      const steps = state.moves[state.moves.length - 1].player === aiSide ? 2 : 1;
      for (let i = 0; i < steps && state.moves.length > 0; i++) popOne();
    } else {
      popOne();
    }

    state.hoverPos = null;

    // 计时不变，继续当前方计时
    restartTimer();

    draw();
    updateUI();
    scheduleAI();
  }

  /** 弹出最后一手 */
  function popOne() {
    const last = state.moves.pop();
    state.board[last.r][last.c] = EMPTY;
    state.current = last.player;
    if (state.moves.length > 0) {
      const prev = state.moves[state.moves.length - 1];
      state.lastMove = { r: prev.r, c: prev.c };
    } else {
      state.lastMove = null;
    }
    state.selectedHist = -1;
  }

  /** 新一局 */
  function newGame() {
    resetBoard();
    draw();
    updateUI();
    scheduleAI();
  }

  // ============================================================
  //  计时器
  // ============================================================
  function startTimer() {
    if (state.timerId) return;
    if (!state.timerActive) return;
    state.timerId = setInterval(tick, 1000);
  }

  function stopTimer() {
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  function restartTimer() {
    stopTimer();
    if (state.timerActive && !state.gameOver) {
      startTimer();
    }
  }

  function tick() {
    if (state.gameOver) {
      stopTimer();
      return;
    }
    if (!settings.timed) return;

    if (state.current === BLACK) {
      state.blackTime--;
      if (state.blackTime <= 0) {
        state.blackTime = 0;
        handleTimeout(BLACK);
      }
    } else {
      state.whiteTime--;
      if (state.whiteTime <= 0) {
        state.whiteTime = 0;
        handleTimeout(WHITE);
      }
    }

    updateTimerDisplay();
    draw();
  }

  /** 超时判负：timeoutPlayer 为超时方，另一方获胜 */
  function handleTimeout(timeoutPlayer) {
    stopTimer();
    state.gameOver = true;
    state.winner = (timeoutPlayer === BLACK) ? WHITE : BLACK;
    state.stats[state.winner === BLACK ? 'black' : 'white']++;
    saveStats();
    Sound.win();
    draw();
    updateUI();
  }

  function updateTimerDisplay() {
    if (!settings.timed) {
      blackTD.textContent = '—:—';
      whiteTD.textContent = '—:—';
      blackTD.classList.remove('low-time');
      whiteTD.classList.remove('low-time');
    } else {
      blackTD.textContent = formatTime(state.blackTime);
      whiteTD.textContent = formatTime(state.whiteTime);
      blackTD.classList.toggle('low-time', state.blackTime <= 60 && !state.gameOver && state.current === BLACK);
      whiteTD.classList.toggle('low-time', state.whiteTime <= 60 && !state.gameOver && state.current === WHITE);
    }

    blackTR.classList.toggle('active-turn', state.current === BLACK && !state.gameOver);
    whiteTR.classList.toggle('active-turn', state.current === WHITE && !state.gameOver);
  }

  function formatTime(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ============================================================
  //  UI 更新
  // ============================================================
  function updateUI() {
    // 状态栏
    if (state.gameOver) {
      if (state.winner === BLACK) {
        statusEl.className = 'status-bar win';
        statusEl.innerHTML = '<span class="status-stone black"></span> 黑方胜！';
      } else if (state.winner === WHITE) {
        statusEl.className = 'status-bar win';
        statusEl.innerHTML = '<span class="status-stone white"></span> 白方胜！';
      } else {
        statusEl.className = 'status-bar draw';
        statusEl.innerHTML = '平 局';
      }
    } else {
      statusEl.className = 'status-bar';
      const stoneClass = state.current === BLACK ? 'black' : 'white';
      const label = state.current === BLACK ? '黑方' : '白方';
      const suffix = isAITurn() ? '（AI 思考中…）' : '落子';
      statusEl.innerHTML = `<span class="status-stone ${stoneClass}"></span> ${label}${suffix}`;
    }

    // 悔棋按钮
    undoBtn.disabled = state.gameOver || state.moves.length === 0;

    // 计时器
    updateTimerDisplay();

    // 回合记录
    renderHistory();

    // 统计
    bwEl.textContent = state.stats.black;
    wwEl.textContent = state.stats.white;
    dwEl.textContent = state.stats.draw;
  }

  /** 渲染回合记录 */
  function renderHistory() {
    if (state.moves.length === 0) {
      histList.innerHTML = '<div class="history-placeholder">棋局尚未开始</div>';
      return;
    }

    let html = '';
    for (let i = 0; i < state.moves.length; i++) {
      const m = state.moves[i];
      const stone = m.player === BLACK ? '●' : '○';
      const coord = `(${m.r + 1}, ${m.c + 1})`;
      const active = (i === state.selectedHist) ? ' active' : '';
      html += `<div class="history-item${active}" data-index="${i}">
        <span class="move-num">第${i + 1}手</span>
        <span class="move-stone">${stone}</span>
        <span class="move-coord">${coord}</span>
      </div>`;
    }
    histList.innerHTML = html;

    // 绑定点击事件
    histList.querySelectorAll('.history-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.index, 10);
        if (state.selectedHist === idx) {
          state.selectedHist = -1;
        } else {
          state.selectedHist = idx;
        }
        draw();
        renderHistory();
      });
    });

    // 自动滚动到最新
    histList.scrollTop = histList.scrollHeight;
  }

  // ============================================================
  //  事件绑定
  // ============================================================
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousemove', onCanvasMove);
  canvas.addEventListener('mouseleave', onCanvasLeave);

  undoBtn.addEventListener('click', undoMove);
  newBtn.addEventListener('click', newGame);

  // 对战模式切换（切换即开新局）
  modeBtns.forEach(b => {
    b.addEventListener('click', () => {
      if (settings.mode === b.dataset.mode) return;
      settings.mode = b.dataset.mode;
      saveSettings();
      syncSettingsUI();
      newGame();
    });
  });

  // 选项开关
  optForbidden.addEventListener('change', () => {
    settings.forbidden = optForbidden.checked;
    saveSettings();
    draw();
  });
  optTimed.addEventListener('change', () => {
    settings.timed = optTimed.checked;
    saveSettings();
    if (settings.timed && !state.gameOver) {
      state.blackTime = TOTAL_TIME;
      state.whiteTime = TOTAL_TIME;
      state.timerActive = true;
      restartTimer();
    } else if (!settings.timed) {
      state.timerActive = false;
      stopTimer();
    }
    updateUI();
  });
  optSound.addEventListener('change', () => {
    settings.sound = optSound.checked;
    saveSettings();
  });
  aiDifficultySel.addEventListener('change', () => {
    settings.difficulty = aiDifficultySel.value;
    saveSettings();
  });

  // ============================================================
  //  启动
  // ============================================================
  init();

})();
</script>
</body>
</html>
